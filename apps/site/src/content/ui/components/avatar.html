<!--oc-page {"title": "OmniaUI - Avatar", "category": "Layout", "description": "Circular avatars with sizes; optional group.", "layout": "sidebar", "shell": "ui", "shellClass": "ocd-shell", "bodyClass": "", "head": []}-->
<section class="oc-hero" id="overview">
                <h1 class="oc-hero-title">Avatar</h1>
                <p class="oc-hero-text">Circular avatars with sizes sm, default, lg, xl. Group avatars with
                    <code>.oc-avatar-group</code>.</p>
            </section>

            <section class="ocd-section" id="avatar">
                <oc-demo><div class="preview">
                    <div class="preview-row">
                        <span class="oc-avatar oc-avatar--sm">S</span>
                        <span class="oc-avatar">MD</span>
                        <span class="oc-avatar oc-avatar--lg">LG</span>
                        <span class="oc-avatar oc-avatar--xl">XL</span>
                        <span style="width:20px"></span>
                        <div class="oc-avatar-group">
                            <span class="oc-avatar" style="background:var(--color-vividblue-70);color:var(--color-white-2)">A</span>
                            <span class="oc-avatar" style="background:var(--color-green-10);color:var(--color-white-2)">B</span>
                            <span class="oc-avatar" style="background:var(--color-red-50);color:var(--color-white-2)">C</span>
                        </div>
                    </div>
                </div></oc-demo>
            </section>
