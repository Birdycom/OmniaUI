<!-- OmniaUI component: badge — Badges. Needs @birdycom/omniaui CSS. -->
<span class="oc-badge">Badge</span>
<span class="oc-badge oc-badge--secondary">Secondary</span>
<span class="oc-badge oc-badge--outline">Outline</span>
<span class="oc-badge oc-badge--destructive">Error</span>
<!-- 0.17.1 status set: .oc-badge--status + data-status (paid, pending, overdue, draft, sent, cancelled, approved, rejected, active,
     inactive, archived, failed, refunded, scheduled, in-progress, done, read-only), a webicon before the label -->
<span class="oc-badge oc-badge--status" data-status="paid"><iconify-icon icon="mdi:check-circle-outline" aria-hidden="true"></iconify-icon>Paid</span>
<span class="oc-badge oc-badge--status" data-status="pending"><iconify-icon icon="mdi:clock-outline" aria-hidden="true"></iconify-icon>Pending</span>
<span class="oc-badge oc-badge--status" data-status="overdue"><iconify-icon icon="mdi:alert-circle-outline" aria-hidden="true"></iconify-icon>Overdue</span>
<!-- 0.17.1 read-only value: the inner span is cut off with an ellipsis -->
<span class="oc-badge oc-badge--readonly" title="Customer 1"><iconify-icon icon="mdi:account-outline" aria-hidden="true"></iconify-icon><span>Customer 1</span></span>
