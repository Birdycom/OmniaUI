<!-- OmniaUI component: expandable-table - Table that shows the first rows, "Show more" reveals the rest (CSS only). Needs @birdycom/omniaui CSS.
     Class API: .oc-expandable-table (wrapper) · .oc-expandable-table__row-dimmed (last visible row, faded) · .oc-expandable-table__row-more (hidden rows) ·
       .oc-expandable-table__wrap (+ --full) holds the toggle · label.oc-expandable-table__trigger.oc-btn > input.oc-expandable-table__toggle + .__more / .__less
     Generic toggle button: label.oc-btn.oc-btn--toggle > input[type=checkbox] + .oc-btn-toggle__off / .oc-btn-toggle__on ; reveal area: .oc-showmore > .oc-showmore__extra
-->
<div class="oc-expandable-table">
  <table class="oc-table-ref">
    <thead><tr><th>Class</th><th>Description</th></tr></thead>
    <tbody>
      <tr><td><code>.oc-btn</code></td><td>Primary button</td></tr>
      <tr><td><code>.oc-btn--secondary</code></td><td>Quiet button</td></tr>
      <tr class="oc-expandable-table__row-dimmed"><td><code>.oc-btn--outline</code></td><td>Outlined button</td></tr>
      <tr class="oc-expandable-table__row-more"><td><code>.oc-btn--ghost</code></td><td>Frameless button</td></tr>
      <tr class="oc-expandable-table__row-more"><td><code>.oc-btn--link</code></td><td>Looks like a link</td></tr>
    </tbody>
  </table>
  <div class="oc-expandable-table__wrap oc-expandable-table__wrap--full">
    <label class="oc-btn oc-btn--secondary oc-expandable-table__trigger"><input type="checkbox" class="oc-expandable-table__toggle"><span class="oc-expandable-table__more">Show more</span><span class="oc-expandable-table__less">Show less</span></label>
  </div>
</div>

<div class="oc-showmore">
  <p>Short text that is always visible.</p>
  <p class="oc-showmore__extra">Extra text that appears after pressing the button.</p>
  <label class="oc-btn oc-btn--outline oc-btn--toggle"><input type="checkbox"><span class="oc-btn-toggle__off">Show more</span><span class="oc-btn-toggle__on">Show less</span></label>
</div>
