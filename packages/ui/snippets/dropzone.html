<!-- OmniaUI component: dropzone - File upload target - a label around a real file input. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-dropzone: Label wrapper. State: .is-dragover; disabled via the input.
       input[type=file]: The real input, stretched over the zone
       .oc-dropzone-icon: Optional icon
       .oc-dropzone-hint: Small hint text (accepted types, size)
-->
<label class="oc-dropzone">
  <input type="file" accept=".pdf,.xml" multiple>
  <span class="oc-dropzone-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></span>
  <span><strong>Drop invoices here</strong> or click to choose</span>
  <span class="oc-dropzone-hint">PDF or UBL XML, up to 10 MB</span>
</label>
