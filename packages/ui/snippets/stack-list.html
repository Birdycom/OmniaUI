<!-- OmniaUI component: stack-list - Technology pills for a product or project tech stack. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/stack-list.html | Map: ul.oc-stack-list -> li.oc-stack-list__item (optional __icon)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-stack-list: The list (aria-label names it). Modifiers: --neutral (no accent tint), --sm
       .oc-stack-list__item: One pill
       .oc-stack-list__icon: Optional glyph or SVG before the name (aria-hidden)
       .oc-accent--*: Accent preset for the tint
     Slots: items
-->
<ul class="oc-stack-list oc-accent--violet" aria-label="Tech stack">
  <li class="oc-stack-list__item">PHP 8.4</li>
  <li class="oc-stack-list__item">MySQL</li>
  <li class="oc-stack-list__item">TypeScript</li>
  <li class="oc-stack-list__item">Vue 3</li>
  <li class="oc-stack-list__item">Docker</li>
</ul>
