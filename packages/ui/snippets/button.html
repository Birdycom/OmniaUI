<!-- OmniaUI component: button — Buttons: default, secondary, outline, ghost, destructive and sizes. Needs @birdycom/omniaui CSS. -->
<button class="oc-btn">Default</button>
<button class="oc-btn oc-btn--secondary">Secondary</button>
<button class="oc-btn oc-btn--outline">Outline</button>
<button class="oc-btn oc-btn--ghost">Ghost</button>
<button class="oc-btn oc-btn--destructive">Delete</button>
<button class="oc-btn oc-btn--sm">Small</button>
<button class="oc-btn oc-btn--lg">Large</button>
<!-- 0.17.1 inherit: an outline or ghost button on a dark or coloured band follows the text colour around it -->
<div class="p-4" style="background: var(--oc-primary); color: var(--oc-primary-foreground)">
  <button class="oc-btn oc-btn--outline oc-btn--inherit">Outline</button>
  <button class="oc-btn oc-btn--ghost oc-btn--inherit">Ghost</button>
</div>
<!-- 0.17.1 theming tokens (all unset by default): --oc-btn-radius, --oc-btn-hover-mix, --oc-btn-hover-tint,
     --oc-btn-hover-opacity, --oc-btn-outline-mix, --oc-btn-disabled-opacity -->
<div style="--oc-btn-radius: 999px; --oc-btn-hover-mix: 85%; --oc-btn-hover-opacity: 1; --oc-btn-outline-mix: 55%">
  <button class="oc-btn">Rounded</button>
  <button class="oc-btn oc-btn--outline">Sturdier edge</button>
</div>
