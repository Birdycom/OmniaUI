<!-- OmniaUI component: form-density - Compact forms: .oc-density-compact makes every control in it 2rem high instead of 2.5rem. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/form-density.html | Map: form density demo markup.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-density-compact: On a form or wrapper: controls inside are 2rem high, labels and gaps a step smaller.
-->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem;inline-size:100%">
<form class="" style="display:grid;gap:0.75rem;padding:1rem;border:1px solid var(--oc-border);border-radius:var(--oc-radius)" onsubmit="event.preventDefault()">
  <p style="margin:0;font-weight:600">Standard (2.5rem)</p>
  <div class="oc-field"><label class="oc-field-label" for="d-desc">Description</label><input class="oc-input" id="d-desc" value="Article 1"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
    <div class="oc-field"><label class="oc-field-label" for="d-qty">Quantity</label><input class="oc-input" id="d-qty" value="2"></div>
    <div class="oc-field"><label class="oc-field-label" for="d-vat">VAT</label><select class="oc-select" id="d-vat"><option>21%</option><option>6%</option></select></div>
  </div>
  <div style="display:flex;gap:0.5rem"><button class="oc-btn oc-btn--sm" type="submit"><iconify-icon icon="mdi:content-save-outline" aria-hidden="true"></iconify-icon>Save</button><button class="oc-btn oc-btn--outline oc-btn--sm" type="button">Cancel</button></div>
</form>
<form class="oc-density-compact" style="display:grid;gap:0.75rem;padding:1rem;border:1px solid var(--oc-border);border-radius:var(--oc-radius)" onsubmit="event.preventDefault()">
  <p style="margin:0;font-weight:600">Compact (2rem)</p>
  <div class="oc-field"><label class="oc-field-label" for="oc-density-compact-desc">Description</label><input class="oc-input" id="oc-density-compact-desc" value="Article 1"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
    <div class="oc-field"><label class="oc-field-label" for="oc-density-compact-qty">Quantity</label><input class="oc-input" id="oc-density-compact-qty" value="2"></div>
    <div class="oc-field"><label class="oc-field-label" for="oc-density-compact-vat">VAT</label><select class="oc-select" id="oc-density-compact-vat"><option>21%</option><option>6%</option></select></div>
  </div>
  <div style="display:flex;gap:0.5rem"><button class="oc-btn oc-btn--sm" type="submit"><iconify-icon icon="mdi:content-save-outline" aria-hidden="true"></iconify-icon>Save</button><button class="oc-btn oc-btn--outline oc-btn--sm" type="button">Cancel</button></div>
</form>
</div>
