<!-- OmniaUI component: media-row — Compact horizontal media item for up-next lists and numbered playlists. Needs @birdycom/omniaui CSS.

     Class API: ul/ol.oc-media-row-list > li.oc-media-row > .oc-media-thumb (see media-thumb) ·
       .oc-media-row__text (h3.oc-media-row__title > a, p.oc-media-row__meta) · button.oc-media-row__menu (optional).
     Modifiers: .oc-media-row-list--numbered (CSS counter column). States: aria-current="true" (now playing).
     The title link covers the row; the menu button stays clickable. No JavaScript.
-->
