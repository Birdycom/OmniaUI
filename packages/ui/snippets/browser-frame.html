<!-- OmniaUI component: browser-frame — Fake browser chrome around a screenshot or live content. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/browser-frame.html | Map: figure -> bar (dots, address, actions) -> view (screenshot slot) -> caption
     Class API: figure.oc-browser-frame > .oc-browser-frame__bar (3 × <i>, .oc-browser-frame__address, .oc-browser-frame__actions) ·
       .oc-browser-frame__view > img / video / iframe / any content · figcaption.oc-browser-frame__caption (optional).
     Modifiers: --minimal (dots only), --dark (dark chrome), --tilt (3D angle, straightens on hover), --auto (free height).
     Ratio: --oc-browser-frame-ratio (default 16 / 10). No JavaScript.
-->
<figure class="oc-browser-frame" style="max-inline-size:36rem">
  <div class="oc-browser-frame__bar">
    <i></i><i></i><i></i>
    <span class="oc-browser-frame__address">shop.example.com/collections/spring</span>
    <span class="oc-browser-frame__actions" aria-hidden="true">&#8635; &#8942;</span>
  </div>
  <div class="oc-browser-frame__view">
    <div class="oc-media-art oc-media-art--5" role="img" aria-label="Screenshot of the spring collection page"></div>
  </div>
  <figcaption class="oc-browser-frame__caption">Spring collection, 2026 redesign</figcaption>
</figure>
