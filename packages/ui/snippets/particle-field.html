<!-- OmniaUI component: particle-field - A background canvas with slowly drifting points and thin lines between points that are close together. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/particle-field.html | Map: behind a hero.
     Behaviour: particles.js (npx omniaui copy-js particles); works without it.
     Class API (modifiers are extra classes / attributes on the same element):
       canvas.oc-particles: Fixed behind the page (z-index -1). color = points and lines, border-color = a second point color.
       .oc-particles--local: Fills a positioned parent instead of the viewport.
       data-count / data-speed / data-link: Number of points (110), drift speed (0.35) and the line distance in px (115).
       initParticles(canvas, options): From @birdycom/omniaui/particles.js; returns a stop function.
-->
<div style="position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;align-content:center;gap:0.5rem;min-block-size:18rem;inline-size:100%;border-radius:var(--oc-radius);background:var(--oc-card)">
  <canvas class="oc-particles oc-particles--local" data-count="70" aria-hidden="true"></canvas>
  <p style="margin:0;font-size:1.6rem;font-weight:800">See what is out there</p>
  <p style="margin:0;color:var(--oc-muted-foreground)">Points and lines in the accent colors.</p>
</div>
