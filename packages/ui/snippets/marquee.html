<!-- OmniaUI component: marquee - Endless scrolling strip of chips; pauses on hover and focus, static with reduced motion. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/marquee.html | Map: .oc-marquee -> .oc-marquee__track -> items + aria-hidden copies
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-marquee: Clipping wrapper (aria-label describes the list). Modifiers: --reverse, --slow, --fast, --plain (text only), --no-fade
       .oc-marquee__track: The moving row. Render the items twice; the second set gets aria-hidden="true"
       .oc-marquee__item: One chip
       --oc-marquee-duration: Custom speed (default 40s)
     Slots: items (rendered twice for a seamless loop)
-->
<div class="oc-marquee" aria-label="Technologies">
  <div class="oc-marquee__track">
    <span class="oc-marquee__item">HTML</span><span class="oc-marquee__item">CSS</span><span class="oc-marquee__item">PHP</span><span class="oc-marquee__item">MySQL</span><span class="oc-marquee__item">TypeScript</span><span class="oc-marquee__item">Node.js</span>
    <span class="oc-marquee__item" aria-hidden="true">HTML</span><span class="oc-marquee__item" aria-hidden="true">CSS</span><span class="oc-marquee__item" aria-hidden="true">PHP</span><span class="oc-marquee__item" aria-hidden="true">MySQL</span><span class="oc-marquee__item" aria-hidden="true">TypeScript</span><span class="oc-marquee__item" aria-hidden="true">Node.js</span>
  </div>
</div>
