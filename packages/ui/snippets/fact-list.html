<!-- OmniaUI component: fact-list - Key / value product facts in a card, a variant of the definition list. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/fact-list.html | Map: dl.oc-fact-list -> div rows (dt label + dd value)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-fact-list: The dl (card with a line between rows)
       Modifiers: --plain (no card), --compact, --stacked (value below label), --accent (values in the accent)
       Rows: <div><dt>Label</dt><dd>Value</dd></div>
     Slots: rows (label + value)
-->
<dl class="oc-fact-list">
  <div><dt>Platform</dt><dd>Web, desktop</dd></div>
  <div><dt>Built with</dt><dd>PHP 8.4, MySQL</dd></div>
  <div><dt>License</dt><dd>Subscription</dd></div>
  <div><dt>Status</dt><dd>Live since 2021</dd></div>
</dl>
