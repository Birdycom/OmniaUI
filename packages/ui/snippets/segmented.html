<!-- OmniaUI component: segmented - Radio group as a pill switcher for a single choice - no JavaScript. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-segmented: Group wrapper (role="radiogroup"). Modifiers: --block (full width), --sm.
       .oc-segmented-item: Label that wraps one radio input and its text
     Slots: one .oc-segmented-item per option (radio input + label text)
-->
<div class="oc-segmented" role="radiogroup" aria-label="Period">
  <label class="oc-segmented-item"><input type="radio" name="oc-period" value="month" checked> Month</label>
  <label class="oc-segmented-item"><input type="radio" name="oc-period" value="quarter"> Quarter</label>
  <label class="oc-segmented-item"><input type="radio" name="oc-period" value="year"> Year</label>
</div>
