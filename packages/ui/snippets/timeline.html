<!-- OmniaUI component: timeline - Vertical timeline with dated entries and an accent dot per item. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/timeline.html | Map: ol.oc-timeline -> li.oc-timeline__item (date, title, text)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-timeline: The list (ol or ul) with the vertical line. Modifiers: --lg (more space), --accent (accent line)
       .oc-timeline__item: One entry with a dot on the line. Modifier: --current (filled dot + ring)
       .oc-timeline__date: Year or date label (use <time> for real dates)
       .oc-timeline__title / .oc-timeline__text: Entry heading and description
       Simple form (no item classes): <li><strong>2001</strong><span>Text</span></li>
     Accent: --oc-accent-from, or an .oc-accent--* preset on the list.
     Slots: items (date, title, text)
-->
<ol class="oc-timeline">
  <li class="oc-timeline__item">
    <time class="oc-timeline__date" datetime="2012">2012</time>
    <h3 class="oc-timeline__title">Acme is founded</h3>
    <p class="oc-timeline__text">Two developers start building websites for local shops.</p>
  </li>
  <li class="oc-timeline__item">
    <time class="oc-timeline__date" datetime="2019">2019</time>
    <h3 class="oc-timeline__title">First own product</h3>
    <p class="oc-timeline__text">A small invoicing app grows into a modular business suite.</p>
  </li>
  <li class="oc-timeline__item oc-timeline__item--current">
    <span class="oc-timeline__date">Today</span>
    <h3 class="oc-timeline__title">Products and custom work</h3>
    <p class="oc-timeline__text">Web apps, desktop tools and plugins for clients across Europe.</p>
  </li>
</ol>
