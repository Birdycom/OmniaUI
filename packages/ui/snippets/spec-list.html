<!-- OmniaUI component: spec-list - Technical specifications in named groups: label and value rows, two columns when there is room. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/spec-list.html | Map: specifications.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-spec-list: The list (a container): groups side by side from 40rem wide. --stack keeps one column.
       .oc-spec-group / __title: A group and its title (small caps, an optional icon).
       dl.oc-spec-group__rows > .oc-spec-row: The rows: a <div> with <dt> (label) and <dd> (value; a <small> inside is a quiet unit or note).
-->
<div class="oc-spec-list">
  <section class="oc-spec-group">
    <h3 class="oc-spec-group__title">Dimensions</h3>
    <dl class="oc-spec-group__rows">
      <div class="oc-spec-row"><dt>Height</dt><dd>52 cm</dd></div>
      <div class="oc-spec-row"><dt>Shade diameter</dt><dd>28 cm</dd></div>
      <div class="oc-spec-row"><dt>Base</dt><dd>18 × 18 cm</dd></div>
      <div class="oc-spec-row"><dt>Weight</dt><dd>2.4 kg</dd></div>
    </dl>
  </section>
  <section class="oc-spec-group">
    <h3 class="oc-spec-group__title">Electrical</h3>
    <dl class="oc-spec-group__rows">
      <div class="oc-spec-row"><dt>Lamp holder</dt><dd>E27 <small>max. 40 W</small></dd></div>
      <div class="oc-spec-row"><dt>Cable</dt><dd>1.8 m, with switch</dd></div>
      <div class="oc-spec-row"><dt>Energy class</dt><dd>A+</dd></div>
    </dl>
  </section>
  <section class="oc-spec-group">
    <h3 class="oc-spec-group__title">Article</h3>
    <dl class="oc-spec-group__rows">
      <div class="oc-spec-row"><dt>Article number</dt><dd>PRD-0001</dd></div>
      <div class="oc-spec-row"><dt>EAN</dt><dd>5400000000010</dd></div>
      <div class="oc-spec-row"><dt>Warranty</dt><dd>24 months</dd></div>
    </dl>
  </section>
</div>
