<!-- OmniaUI component: carousel - Carousel: CSS scroll-snap with ::scroll-button arrows and ::scroll-marker dots, fallback links. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-carousel: wrapper (anchor scope). Modifiers: --halves, --thirds (slides per view)
       .oc-carousel-viewport: the scroller (tabindex="0", role="region", aria-roledescription="carousel")
       .oc-carousel-item: one slide (role="group" aria-roledescription="slide")
       .oc-carousel-dots > a.oc-carousel-dot: fallback navigation (hidden where ::scroll-marker works)
-->
<div class="oc-carousel" style="max-inline-size:34rem">
  <div class="oc-carousel-viewport" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Highlights">
    <div class="oc-carousel-item" id="oc-slide-1" role="group" aria-roledescription="slide" aria-label="1 of 4"><div class="oc-aspect oc-aspect--wide oc-aspect--center"><span class="oc-item-title" style="font-size:1.75rem">Slide 1</span></div></div>
    <div class="oc-carousel-item" id="oc-slide-2" role="group" aria-roledescription="slide" aria-label="2 of 4"><div class="oc-aspect oc-aspect--wide oc-aspect--center"><span class="oc-item-title" style="font-size:1.75rem">Slide 2</span></div></div>
    <div class="oc-carousel-item" id="oc-slide-3" role="group" aria-roledescription="slide" aria-label="3 of 4"><div class="oc-aspect oc-aspect--wide oc-aspect--center"><span class="oc-item-title" style="font-size:1.75rem">Slide 3</span></div></div>
    <div class="oc-carousel-item" id="oc-slide-4" role="group" aria-roledescription="slide" aria-label="4 of 4"><div class="oc-aspect oc-aspect--wide oc-aspect--center"><span class="oc-item-title" style="font-size:1.75rem">Slide 4</span></div></div>
  </div>
  <nav class="oc-carousel-dots" aria-label="Choose a slide">
    <a class="oc-carousel-dot" href="#oc-slide-1" aria-label="Slide 1"></a>
    <a class="oc-carousel-dot" href="#oc-slide-2" aria-label="Slide 2"></a>
    <a class="oc-carousel-dot" href="#oc-slide-3" aria-label="Slide 3"></a>
    <a class="oc-carousel-dot" href="#oc-slide-4" aria-label="Slide 4"></a>
  </nav>
</div>
