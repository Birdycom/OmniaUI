<!-- OmniaUI component: code-plate - A QR code or barcode on its own white plate, with a caption on the plate itself (scans in any theme, the label is on a photo or print too). Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       figure.oc-code-plate: the white plate (always light). Modifier: --sm (for a code of about 72px).
       Child: the code (img, svg, canvas or .oc-barcode), then figcaption.oc-code-plate__caption.
       data-mode="test|live|both": the caption in the mode colors; "both" = two spans in the caption.
-->
<figure class="oc-code-plate" data-mode="test" style="inline-size: 12rem">
  <img src="/img/samples/qr-company-1-test.svg" alt="QR code to join the test round of Company 1" width="192" height="192">
  <figcaption class="oc-code-plate__caption">Test</figcaption>
</figure>
