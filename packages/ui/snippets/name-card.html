<!-- OmniaUI component: name-card - Collapsible card with a name, rename pencil, amount and delete button; nests for titles and parts. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/name-card.html | Map: name card demo markup. Behaviour: form-extras.js.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-name-card: The card: a <details>; open shows the content.
       .oc-name-card__head: The <summary>: chevron, name, rename, meta, amount and actions on one line.
       .oc-name-card__title / __meta / __amount: Name (cut with an ellipsis), a quiet extra ("6 articles") and the amount (tabular numbers, pushed right).
       .oc-name-card__actions: Buttons on the right, e.g. a soft destructive delete.
       [data-oc-rename]: With form-extras.js: the pencil turns the name into an input; Enter or leaving the field saves (oc-namecard-rename event with the name), Escape cancels.
       .oc-name-card__body: The content. Name cards inside it are the parts of a title (quieter surface).
       .oc-name-card--total: The amount of this card in the primary color (a total).
-->
<div style="display:grid;gap:0.5rem;inline-size:min(100%,40rem)">
<details class="oc-name-card oc-name-card--total" open>
  <summary class="oc-name-card__head">
    <span class="oc-name-card__title">Kitchen – ground floor</span>
    <button type="button" class="oc-btn oc-btn--plain" data-oc-rename aria-label="Rename Kitchen – ground floor" title="Rename"><iconify-icon icon="mdi:pencil-outline" aria-hidden="true"></iconify-icon></button>
    
    <span class="oc-name-card__amount">€ 8.480,00</span>
    <span class="oc-name-card__actions"><button type="button" class="oc-btn oc-btn--soft-destructive oc-btn--icon oc-btn--sm" aria-label="Delete Kitchen – ground floor" title="Delete"><iconify-icon icon="mdi:trash-can-outline" aria-hidden="true"></iconify-icon></button></span>
  </summary>
  <div class="oc-name-card__body">
<details class="oc-name-card">
  <summary class="oc-name-card__head">
    <span class="oc-name-card__title">Base cabinets</span>
    <button type="button" class="oc-btn oc-btn--plain" data-oc-rename aria-label="Rename Base cabinets" title="Rename"><iconify-icon icon="mdi:pencil-outline" aria-hidden="true"></iconify-icon></button>
    <span class="oc-name-card__meta">6 articles</span>
    <span class="oc-name-card__amount">€ 4.180,00</span>
    <span class="oc-name-card__actions"><button type="button" class="oc-btn oc-btn--soft-destructive oc-btn--icon oc-btn--sm" aria-label="Delete Base cabinets" title="Delete"><iconify-icon icon="mdi:trash-can-outline" aria-hidden="true"></iconify-icon></button></span>
  </summary>
  <div class="oc-name-card__body">
    <p class="m-0 text-muted">6 articles · 2 options</p>
  </div>
</details>
<details class="oc-name-card">
  <summary class="oc-name-card__head">
    <span class="oc-name-card__title">Wall cabinets</span>
    <button type="button" class="oc-btn oc-btn--plain" data-oc-rename aria-label="Rename Wall cabinets" title="Rename"><iconify-icon icon="mdi:pencil-outline" aria-hidden="true"></iconify-icon></button>
    <span class="oc-name-card__meta">4 articles</span>
    <span class="oc-name-card__amount">€ 2.360,00</span>
    <span class="oc-name-card__actions"><button type="button" class="oc-btn oc-btn--soft-destructive oc-btn--icon oc-btn--sm" aria-label="Delete Wall cabinets" title="Delete"><iconify-icon icon="mdi:trash-can-outline" aria-hidden="true"></iconify-icon></button></span>
  </summary>
  <div class="oc-name-card__body">
    <p class="m-0 text-muted">4 articles</p>
  </div>
</details>
<details class="oc-name-card">
  <summary class="oc-name-card__head">
    <span class="oc-name-card__title">Worktop</span>
    <button type="button" class="oc-btn oc-btn--plain" data-oc-rename aria-label="Rename Worktop" title="Rename"><iconify-icon icon="mdi:pencil-outline" aria-hidden="true"></iconify-icon></button>
    <span class="oc-name-card__meta">1 article</span>
    <span class="oc-name-card__amount">€ 1.940,00</span>
    <span class="oc-name-card__actions"><button type="button" class="oc-btn oc-btn--soft-destructive oc-btn--icon oc-btn--sm" aria-label="Delete Worktop" title="Delete"><iconify-icon icon="mdi:trash-can-outline" aria-hidden="true"></iconify-icon></button></span>
  </summary>
  <div class="oc-name-card__body">
    <p class="m-0 text-muted">1 article · cut to size</p>
  </div>
</details>
  </div>
</details>
<details class="oc-name-card">
  <summary class="oc-name-card__head">
    <span class="oc-name-card__title">Bathroom – first floor</span>
    <button type="button" class="oc-btn oc-btn--plain" data-oc-rename aria-label="Rename Bathroom – first floor" title="Rename"><iconify-icon icon="mdi:pencil-outline" aria-hidden="true"></iconify-icon></button>

  <div class="oc-name-card__body">
    <p class="m-0 text-muted">Add a part with the button below.</p>

</details>
</div>
