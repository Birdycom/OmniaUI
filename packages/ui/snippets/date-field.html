<!-- OmniaUI component: date-field - Native date input with a calendar icon zone and the ISO week (Week 45) next to it. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/date-field.html | Map: date field demo markup. Behaviour: form-extras.js.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-date-field: The frame around icon, input and week; focus ring on the frame.
       .oc-date-field__icon: The calendar icon zone with a line after it.
       input.oc-date-field__input[type=date]: The native date input (value YYYY-MM-DD).
       output.oc-date-field__week: With form-extras.js: the ISO week of the date, "Week 45". Template: data-oc-week="W{week} · {year}". Hidden without a date.
       .oc-date-field--sm: 2rem high (also inside .oc-density-compact).
       isoWeek(date): Exported from form-extras.js: { week, year } after ISO 8601 (week 1 holds the first Thursday).
-->
<div style="display:flex;flex-wrap:wrap;gap:1.5rem;align-items:end">
<div class="oc-field">
  <label class="oc-field-label" for="oc-date-delivery">Delivery date</label>
  <div class="oc-date-field">
    <span class="oc-date-field__icon"><iconify-icon icon="mdi:calendar-blank-outline" aria-hidden="true"></iconify-icon></span>
    <input class="oc-date-field__input" id="oc-date-delivery" type="date" value="2026-11-12">
    <output class="oc-date-field__week" for="oc-date-delivery"></output>
  </div>
</div>
<div class="oc-field">
  <label class="oc-field-label" for="oc-date-start">Start of works</label>
  <div class="oc-date-field">
    <span class="oc-date-field__icon"><iconify-icon icon="mdi:calendar-blank-outline" aria-hidden="true"></iconify-icon></span>
    <input class="oc-date-field__input" id="oc-date-start" type="date" value="2027-01-01">
    <output class="oc-date-field__week" for="oc-date-start" data-oc-week="Week {week} · {year}"></output>
  </div>
</div>
<div class="oc-field">
  <label class="oc-field-label" for="oc-date-plain">Without week</label>
  <div class="oc-date-field">
    <span class="oc-date-field__icon"><iconify-icon icon="mdi:calendar-blank-outline" aria-hidden="true"></iconify-icon></span>
    <input class="oc-date-field__input" id="oc-date-plain" type="date" value="2026-12-24">
    
  </div>
</div>
<div class="oc-field">
  <label class="oc-field-label" for="oc-date-small">Small</label>
  <div class="oc-date-field oc-date-field--sm">
    <span class="oc-date-field__icon"><iconify-icon icon="mdi:calendar-blank-outline" aria-hidden="true"></iconify-icon></span>
    <input class="oc-date-field__input" id="oc-date-small" type="date" value="2026-11-03">
    <output class="oc-date-field__week" for="oc-date-small"></output>
  </div>
</div>
</div>
