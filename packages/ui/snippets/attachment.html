<!-- OmniaUI component: attachment — File chip and image preview for chat messages and composers: icon by type, name, size, remove and upload states. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/attachment.html | Map: file chips (types) -> image preview -> composer row (thumb, uploading, error, remove)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-attachment-list: Wrapping row of chips (ul or div). Modifier: --stack (one per line, full width)
       a.oc-attachment | div.oc-attachment: File chip. Types: --pdf, --doc, --sheet, --zip, --image (tint of the icon tile).
         States: --uploading (progress line from --oc-attachment-progress), --error
       .oc-attachment__icon: Page tile with the extension text, or an img for a small preview
       .oc-attachment__body > .oc-attachment__name + .oc-attachment__size
       button.oc-attachment__remove: Remove button (composer); give it an aria-label with the file name
       a.oc-attachment-image > img + .oc-attachment-image__caption: Image preview inside a message (4 : 3, max 18rem wide)
       .oc-attachment-thumb > img + button.oc-attachment__remove: Square thumbnail of a pasted screenshot
     No JavaScript. Removing a file or tracking upload progress is up to your app; set --oc-attachment-progress inline.
-->
<div style="display:grid;gap:1.25rem;inline-size:100%;max-inline-size:40rem">
  <ul class="oc-attachment-list" aria-label="Files in this message">
    <li><a class="oc-attachment oc-attachment--pdf" href="#quote.pdf" download><span class="oc-attachment__icon" aria-hidden="true">PDF</span><span class="oc-attachment__body"><span class="oc-attachment__name">Quote kitchen Dewitte v2.pdf</span><span class="oc-attachment__size">1.2 MB</span></span></a></li>
    <li><a class="oc-attachment oc-attachment--sheet" href="#measurements.xlsx" download><span class="oc-attachment__icon" aria-hidden="true">XLS</span><span class="oc-attachment__body"><span class="oc-attachment__name">Measurements ground floor.xlsx</span><span class="oc-attachment__size">86 KB</span></span></a></li>
    <li><a class="oc-attachment oc-attachment--doc" href="#contract.docx" download><span class="oc-attachment__icon" aria-hidden="true">DOC</span><span class="oc-attachment__body"><span class="oc-attachment__name">Contract addendum.docx</span><span class="oc-attachment__size">240 KB</span></span></a></li>
    <li><a class="oc-attachment oc-attachment--zip" href="#plans.zip" download><span class="oc-attachment__icon" aria-hidden="true">ZIP</span><span class="oc-attachment__body"><span class="oc-attachment__name">Plans architect.zip</span><span class="oc-attachment__size">14.8 MB</span></span></a></li>
  </ul>

  <a class="oc-attachment-image" href="#worktop-sample.jpg">
    <span class="oc-media-art oc-media-art--6" role="img" aria-label="Photo of the Calacatta worktop sample"></span>
    <span class="oc-attachment-image__caption">worktop-sample.jpg · 2.1 MB</span>
  </a>

  <div class="oc-attachment-list" aria-label="Files to send">
    <div class="oc-attachment-thumb">
      <span class="oc-media-art oc-media-art--2" role="img" aria-label="Pasted screenshot"></span>
      <button type="button" class="oc-attachment__remove" aria-label="Remove screenshot.png">&#10005;</button>
    </div>
    <div class="oc-attachment oc-attachment--pdf oc-attachment--uploading" style="--oc-attachment-progress:65%">
      <span class="oc-attachment__icon" aria-hidden="true">PDF</span>
      <span class="oc-attachment__body"><span class="oc-attachment__name">Delivery note 4471.pdf</span><span class="oc-attachment__size" role="status">Uploading… 65%</span></span>
      <button type="button" class="oc-attachment__remove" aria-label="Cancel upload of Delivery note 4471.pdf">&#10005;</button>
    </div>
    <div class="oc-attachment oc-attachment--image oc-attachment--error">
      <span class="oc-attachment__icon" aria-hidden="true">HEIC</span>
      <span class="oc-attachment__body"><span class="oc-attachment__name">IMG_2048.heic</span><span class="oc-attachment__size">Larger than 25 MB</span></span>
      <button type="button" class="oc-attachment__remove" aria-label="Remove IMG_2048.heic">&#10005;</button>
    </div>
  </div>
</div>
