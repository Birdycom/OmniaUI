<!-- OmniaUI component: result - The outcome of an action in the place where the form was: an icon tile, a title, a short text and a button such as Send another message. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/result.html | Map: message sent -> centered.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-result: The result: tile, title, text and actions stacked, aligned at the start.
       .oc-result__title: The title (1.2rem).
       .oc-result__text: Muted text; links in the primary color, underlined.
       .oc-result__actions: Row of buttons under the text.
       .oc-result--center: Centers everything (an empty state or a full page).
       role="status" tabindex="-1": Announces the result and lets the script move the focus to it.
-->
<div class="oc-panel" style="inline-size:min(100%, 34rem)">
  <div class="oc-result" role="status" tabindex="-1">
    <span class="oc-icon-tile oc-icon-tile--sm oc-accent--green" aria-hidden="true"><iconify-icon icon="mdi:check"></iconify-icon></span>
    <h2 class="oc-result__title">Thank you, your message was sent</h2>
    <p class="oc-result__text">You will get a confirmation by e-mail.<br>Urgent? Call us on <a href="tel:+3230000000">+32 3 000 00 00</a>.</p>
    <div class="oc-result__actions">
      <a class="oc-btn oc-btn--outline" href="#contact-form">Send another message</a>
    </div>
  </div>
</div>
<div class="oc-panel" style="inline-size:min(100%, 34rem)">
  <div class="oc-result oc-result--center" role="status" tabindex="-1">
    <span class="oc-icon-tile oc-icon-tile--sm oc-accent--orange" aria-hidden="true"><iconify-icon icon="mdi:clock-outline"></iconify-icon></span>
    <h2 class="oc-result__title">Your request is waiting for approval</h2>
    <p class="oc-result__text">Customer 1 gets an e-mail as soon as it is approved.</p>
    <div class="oc-result__actions">
      <a class="oc-btn" href="#orders">Back to the orders</a>
      <a class="oc-btn oc-btn--ghost" href="#request">View the request</a>
    </div>
  </div>
</div>
