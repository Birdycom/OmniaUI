<!-- OmniaUI component: filter-counts - View filter tiles with counts (active / deleted / all) - no JavaScript. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/filter-counts.html | Map: group (fieldset) -> one tile per view (radio + value + label + hint)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-filter-counts: Group of tiles (a <fieldset> or role="radiogroup"). Modifier: --compact (inline pills "Active 12").
       .oc-filter-counts-item: Tile label around one radio. Tones: --success, --destructive, --muted (default primary).
       .oc-filter-counts-value: The count (big number)
       .oc-filter-counts-label: Name of the view
       .oc-filter-counts-hint: Short description (hidden in --compact)
     States: checked (accent border + background), :focus-visible (outline), disabled (faded)
-->
<fieldset class="oc-filter-counts" aria-label="Show transactions">
  <label class="oc-filter-counts-item oc-filter-counts-item--success">
    <input type="radio" name="view" value="active" checked>
    <span class="oc-filter-counts-value">128</span>
    <span class="oc-filter-counts-label">Active</span>
    <span class="oc-filter-counts-hint">Visible in reports</span>
  </label>
  <label class="oc-filter-counts-item oc-filter-counts-item--destructive">
    <input type="radio" name="view" value="deleted">
    <span class="oc-filter-counts-value">6</span>
    <span class="oc-filter-counts-label">Deleted</span>
    <span class="oc-filter-counts-hint">Can be restored</span>
  </label>
  <label class="oc-filter-counts-item">
    <input type="radio" name="view" value="all">
    <span class="oc-filter-counts-value">134</span>
    <span class="oc-filter-counts-label">All</span>
    <span class="oc-filter-counts-hint">Everything together</span>
  </label>
</fieldset>
