<!-- OmniaUI component: chip-filter - Rounded filter chips (checkboxes for several, radios for one) - no JavaScript. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/chip-filter.html | Map: group (fieldset) -> one label per chip (checkbox + text + optional count)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-chip-filter: Group (a <fieldset> or role="group"/"radiogroup"). Modifiers: --scroll (one line, scrolls sideways), --sm.
       .oc-chip-filter-item: Pill label around one checkbox or radio input
       .oc-chip-filter-count: Optional count bubble inside a chip
     States: checked (tinted primary), :focus-visible (outline), disabled (faded)
-->
<fieldset class="oc-chip-filter" aria-label="Filter by type">
  <label class="oc-chip-filter-item"><input type="checkbox" name="type" value="video" checked> Video <span class="oc-chip-filter-count">24</span></label>
  <label class="oc-chip-filter-item"><input type="checkbox" name="type" value="audio"> Audio <span class="oc-chip-filter-count">8</span></label>
  <label class="oc-chip-filter-item"><input type="checkbox" name="type" value="image" checked> Images <span class="oc-chip-filter-count">112</span></label>
  <label class="oc-chip-filter-item"><input type="checkbox" name="type" value="docs" disabled> Documents <span class="oc-chip-filter-count">0</span></label>
</fieldset>
