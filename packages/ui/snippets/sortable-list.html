<!-- OmniaUI component: sortable-list - A list you reorder with a finger, pen or mouse (pointer events) or the keyboard (Space + arrows). Needs @birdycom/omniaui CSS and sortable-list.js.
     File: packages/ui/snippets/sortable-list.html | Map: ol.oc-sortable-list[data-oc-sortable] -> li.oc-sortable-item (grip, body, arrows). Behaviour: sortable-list.js (0.18.0).
     Class API (modifiers are extra classes / attributes on the same element):
       ul|ol.oc-sortable-list[data-oc-sortable]: The list; ol shows the positions (1., 2., ...) from a CSS counter.
       li.oc-sortable-item[data-id]: One item; data-id is reported in the new order (data-label: name for announcements).
       button.oc-sortable-row-grip: The grip (six dots, the same as the sortable row): drag it, or Space to pick up, arrows to move, Space to drop, Escape to cancel.
       .oc-sortable-item__body: The content. .oc-sortable-item__arrows > button[data-oc-move="up|down"]: optional buttons.
       .oc-sortable-item--grabbed / --dragging: Picked up with the keyboard / the original place while dragging.
       .oc-dropline: The line where the item lands. .oc-drag-ghost: the copy that follows the pointer.
       oc-reorder event: { from, to, order: [ids] } on the list. data-oc-reorder-call="method": calls that Livewire method with the order.
-->
<ol class="oc-sortable-list" data-oc-sortable aria-label="Route order">
  <li class="oc-sortable-item" data-id="stop-1">
    <button type="button" class="oc-sortable-row-grip" aria-label="Move Town hall"></button>
    <span class="oc-sortable-item__body">Town hall</span>
    <span class="oc-sortable-item__arrows"><button type="button" data-oc-move="up" aria-label="Move up: Town hall"><iconify-icon icon="mdi:chevron-up" aria-hidden="true"></iconify-icon></button><button type="button" data-oc-move="down" aria-label="Move down: Town hall"><iconify-icon icon="mdi:chevron-down" aria-hidden="true"></iconify-icon></button></span>
  </li>
  <li class="oc-sortable-item" data-id="stop-2">
    <button type="button" class="oc-sortable-row-grip" aria-label="Move Old harbour"></button>
    <span class="oc-sortable-item__body">Old harbour</span>
    <span class="oc-sortable-item__arrows"><button type="button" data-oc-move="up" aria-label="Move up: Old harbour"><iconify-icon icon="mdi:chevron-up" aria-hidden="true"></iconify-icon></button><button type="button" data-oc-move="down" aria-label="Move down: Old harbour"><iconify-icon icon="mdi:chevron-down" aria-hidden="true"></iconify-icon></button></span>
  </li>
  <li class="oc-sortable-item" data-id="stop-3">
    <button type="button" class="oc-sortable-row-grip" aria-label="Move Windmill"></button>
    <span class="oc-sortable-item__body">Windmill</span>
    <span class="oc-sortable-item__arrows"><button type="button" data-oc-move="up" aria-label="Move up: Windmill"><iconify-icon icon="mdi:chevron-up" aria-hidden="true"></iconify-icon></button><button type="button" data-oc-move="down" aria-label="Move down: Windmill"><iconify-icon icon="mdi:chevron-down" aria-hidden="true"></iconify-icon></button></span>
  </li>
  <li class="oc-sortable-item" data-id="stop-4">
    <button type="button" class="oc-sortable-row-grip" aria-label="Move Market square"></button>
    <span class="oc-sortable-item__body">Market square</span>
    <span class="oc-sortable-item__arrows"><button type="button" data-oc-move="up" aria-label="Move up: Market square"><iconify-icon icon="mdi:chevron-up" aria-hidden="true"></iconify-icon></button><button type="button" data-oc-move="down" aria-label="Move down: Market square"><iconify-icon icon="mdi:chevron-down" aria-hidden="true"></iconify-icon></button></span>
  </li>
</ol>
