<!-- OmniaUI component: barcode-input - Code field with a barcode icon in the left column. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/barcode-input.html | Map: labeled field (icon column + value) -> optional preview
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-barcode-input: Wrapper when you also show a preview under the field
       .oc-input-group--affix + .oc-input-addon: The icon column (same chrome as the euro and percent fields)
       .oc-barcode-input-field: Add to .oc-input
       .oc-barcode-preview: Optional preview under the field. Modifier: --empty
     States: aria-invalid="true" on the field turns the frame and the preview red
     Slots: replace .oc-barcode-preview-bars with your own svg, canvas or img
-->
<div class="oc-field">
  <label class="oc-field-label" for="oc-barcode-demo">Our barcode</label>
  <div class="oc-input-group oc-input-group--affix">
    <span class="oc-input-addon" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M1 1h1.4v14H1zm2.2 0h.7v14h-.7zm1.6 0h1.5v14H4.8zm2.4 0h.7v14H7.2zm1.6 0h.7v14H8.8zm1.5 0h1.4v14h-1.4zm2.2 0H15v14h-.9z"/></svg></span>
    <input class="oc-input oc-barcode-input-field" id="oc-barcode-demo" name="ean" type="text" maxlength="80" placeholder="EAN-13 or internal code" autocomplete="off" spellcheck="false">
  </div>
  <p class="oc-field-description">13 digits is an EAN-13. Anything else is an internal code.</p>
</div>
