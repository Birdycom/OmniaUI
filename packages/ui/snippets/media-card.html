<!-- OmniaUI component: media-card — Video card: thumb, avatar, two-line title, meta and an overflow menu. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/media-card.html | Map: card -> media thumb -> body (avatar, text, menu button) -> dropdown menu (popover)
     Class API: article.oc-media-card > .oc-media-thumb (see media-thumb) · .oc-media-card__body >
       .oc-media-card__avatar (img or initials) · .oc-media-card__text (h3.oc-media-card__title > a, p.oc-media-card__meta) ·
       button.oc-media-card__menu (popovertarget → any .oc-dropdown-menu).
     Modifiers: .oc-media-card--compact. The title link covers the whole card; meta links and the menu stay clickable.
-->
<article class="oc-media-card" style="max-inline-size:20rem">
  <div class="oc-media-thumb">
    <div class="oc-media-art oc-media-art--2"></div>
    <span class="oc-media-thumb__duration">18:32</span>
    <progress class="oc-media-thumb__progress" value="65" max="100" aria-label="Watched 65%">65%</progress>
  </div>
  <div class="oc-media-card__body">
    <span class="oc-media-card__avatar" aria-hidden="true">NS</span>
    <div class="oc-media-card__text">
      <h3 class="oc-media-card__title"><a href="#">Building a cabin by the lake, part 3: the roof goes on</a></h3>
      <p class="oc-media-card__meta"><a href="#">North Studio</a> · 24K views · 3 days ago</p>
    </div>
    <button type="button" class="oc-media-card__menu" popovertarget="oc-media-card-menu" aria-label="More actions">&#8942;</button>
  </div>
  <div class="oc-dropdown-menu" id="oc-media-card-menu" popover>
    <a class="oc-dropdown-item" href="#">Save to playlist</a>
    <a class="oc-dropdown-item" href="#">Share</a>
    <div class="oc-dropdown-separator"></div>
    <a class="oc-dropdown-item" href="#">Not interested</a>
  </div>
</article>
