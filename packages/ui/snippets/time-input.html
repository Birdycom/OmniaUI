<!-- OmniaUI component: time-input - 24h time field (HH:mm) with suggested slots and an optional slot list. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/time-input.html | Map: field + datalist of slots -> slot list (radio chips) -> time picker (0.18.0)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-time-input: Add to .oc-input. Narrow centered field; pattern checks HH:mm (00:00 - 23:59).
       .oc-time-slots: Grid of slot chips (role="radiogroup"). Modifier: --sm.
       .oc-time-slot: Label with one radio input and the time text
       .oc-time-picker (0.18.0): field + clock button (.oc-btn--icon, popovertarget) + the slots in a native popover (.oc-popover);
         oc-form-extras.js puts a picked slot into the field (input + change events) and closes the popover.
     States: :user-invalid on a wrong time (red), checked slot (primary), disabled slot (struck through)
     Slots: <datalist> options = suggestions while typing; one .oc-time-slot per time in the list.
-->
<div class="oc-field">
  <label class="oc-field-label" for="oc-time-demo">Start time</label>
  <input class="oc-input oc-time-input" id="oc-time-demo" name="start" type="text" inputmode="numeric" placeholder="hh:mm" maxlength="5" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" list="oc-time-demo-slots" value="08:30">
  <datalist id="oc-time-demo-slots">
    <option value="08:00"></option>
    <option value="08:30"></option>
    <option value="09:00"></option>
    <option value="09:30"></option>
  </datalist>
</div>
<div class="oc-time-slots" role="radiogroup" aria-label="Pick a time slot">
  <label class="oc-time-slot"><input type="radio" name="slot" value="09:00"> 09:00</label>
  <label class="oc-time-slot"><input type="radio" name="slot" value="09:30" checked> 09:30</label>
  <label class="oc-time-slot"><input type="radio" name="slot" value="10:00" disabled> 10:00</label>
  <label class="oc-time-slot"><input type="radio" name="slot" value="10:30"> 10:30</label>
  <label class="oc-time-slot"><input type="radio" name="slot" value="11:00"> 11:00</label>
</div>

<!-- Time picker (0.18.0): the slots in a popover under a clock button. -->
<div class="oc-time-picker">
  <input class="oc-input oc-time-input" id="oc-time-pick" name="meeting" type="text" inputmode="numeric" placeholder="hh:mm" maxlength="5" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" value="09:00">
  <button type="button" class="oc-btn oc-btn--outline oc-btn--icon" popovertarget="oc-time-pick-slots" aria-label="Choose a time"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 20a8 8 0 0 0 8-8a8 8 0 0 0-8-8a8 8 0 0 0-8 8a8 8 0 0 0 8 8m0-18a10 10 0 0 1 10 10a10 10 0 0 1-10 10C6.47 22 2 17.5 2 12A10 10 0 0 1 12 2m.5 5v5.25l4.5 2.67l-.75 1.23L11 13V7z"/></svg></button>
  <div class="oc-popover" id="oc-time-pick-slots" popover="auto" role="dialog" aria-label="Choose a time">
    <div class="oc-time-slots" role="radiogroup" aria-label="Choose a time">
      <label class="oc-time-slot"><input type="radio" name="oc-time-pick-slot" value="09:00" checked>09:00</label>
      <label class="oc-time-slot"><input type="radio" name="oc-time-pick-slot" value="09:30">09:30</label>
      <label class="oc-time-slot"><input type="radio" name="oc-time-pick-slot" value="10:00">10:00</label>
      <label class="oc-time-slot"><input type="radio" name="oc-time-pick-slot" value="10:30">10:30</label>
    </div>
  </div>
</div>
