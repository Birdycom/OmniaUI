<!-- OmniaUI component: time-input - 24h time field (HH:mm) with suggested slots and an optional slot list. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/time-input.html | Map: field + datalist of slots -> slot list (radio chips)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-time-input: Add to .oc-input. Narrow centered field; pattern checks HH:mm (00:00 - 23:59).
       .oc-time-slots: Grid of slot chips (role="radiogroup"). Modifier: --sm.
       .oc-time-slot: Label with one radio input and the time text
     States: :user-invalid on a wrong time (red), checked slot (primary), disabled slot (struck through)
     Slots: <datalist> options = suggestions while typing; one .oc-time-slot per time in the list.
-->
<div class="oc-field">
  <label class="oc-field-label" for="oc-time-demo">Start time</label>
  <input class="oc-input oc-time-input" id="oc-time-demo" name="start" type="text" inputmode="numeric" placeholder="hh:mm" maxlength="5" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" list="oc-time-demo-slots" value="08:30">
  <datalist id="oc-time-demo-slots">
    <option value="08:00"></option>
    <option value="08:30"></option>
    <option value="09:00"></option>
    <option value="09:30"></option>
  </datalist>
</div>
<div class="oc-time-slots" role="radiogroup" aria-label="Pick a time slot">
  <label class="oc-time-slot"><input type="radio" name="slot" value="09:00"> 09:00</label>
  <label class="oc-time-slot"><input type="radio" name="slot" value="09:30" checked> 09:30</label>
  <label class="oc-time-slot"><input type="radio" name="slot" value="10:00" disabled> 10:00</label>
  <label class="oc-time-slot"><input type="radio" name="slot" value="10:30"> 10:30</label>
  <label class="oc-time-slot"><input type="radio" name="slot" value="11:00"> 11:00</label>
</div>
