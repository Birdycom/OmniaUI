<!-- OmniaUI component: table - Data table: sortable header, selection, row actions, empty state, density modifiers. Needs @birdycom/omniaui CSS.
-->
<div class="oc-table-wrap">
  <table class="oc-table oc-table--striped">
    <caption>Contacts</caption>
    <thead>
      <tr>
        <th style="width:2.5rem"><input class="oc-checkbox" type="checkbox" aria-label="Select all"></th>
        <th aria-sort="ascending"><a class="oc-table-sort" href="?sort=name">Name</a></th>
        <th><a class="oc-table-sort" href="?sort=email">E-mail</a></th>
        <th data-numeric>Balance</th>
        <th><span class="oc-visually-hidden">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      <tr aria-selected="true">
        <td><input class="oc-checkbox" type="checkbox" checked aria-label="Select Ada"></td>
        <td>Ada Lovelace</td><td>ada@example.com</td><td data-numeric>1,250.00</td>
        <td class="oc-table-actions"><a class="oc-table-row-action" href="#">Edit</a><button class="oc-table-row-action oc-table-row-action--destructive" type="button">Delete</button></td>
      </tr>
      <tr>
        <td><input class="oc-checkbox" type="checkbox" aria-label="Select Alan"></td>
        <td>Alan Turing</td><td>alan@example.com</td><td data-numeric>0.00</td>
        <td class="oc-table-actions"><a class="oc-table-row-action" href="#">Edit</a><button class="oc-table-row-action oc-table-row-action--destructive" type="button">Delete</button></td>
      </tr>
    </tbody>
  </table>
</div>
<!-- Empty state: <tbody><tr class="oc-table-empty"><td colspan="5"><div class="oc-empty">...</div></td></tr></tbody> -->
