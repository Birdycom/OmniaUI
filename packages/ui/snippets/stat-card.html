<!-- OmniaUI component: stat-card - KPI tile with an icon tile, a big number, a label and an optional trend; tone modifiers and a clickable variant. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/stat-card.html | Map: grid -> default card -> card with trend -> clickable accent card
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-stat-card-grid: Responsive grid for a row of cards
       .oc-stat-card: Card (div, or a / button for a clickable card with hover lift). Modifiers: --accent (needs attention), --success, --warning, --stripe (start edge stripe).
       .oc-stat-card-icon: Tinted icon tile
       .oc-stat-card-body / -value / -label: Text column, big number, small label
       .oc-stat-card-trend: Chip after the value. Modifiers: --up, --down.
     Slots: icon, value, label, trend
-->
<div class="oc-stat-card-grid">
  <div class="oc-stat-card">
    <span class="oc-stat-card-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/></svg></span>
    <div class="oc-stat-card-body"><span class="oc-stat-card-value">248</span><span class="oc-stat-card-label">Active customers</span></div>
  </div>
  <div class="oc-stat-card oc-stat-card--success">
    <span class="oc-stat-card-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span>
    <div class="oc-stat-card-body"><span class="oc-stat-card-value">&euro;18.4k<span class="oc-stat-card-trend oc-stat-card-trend--up">+12%</span></span><span class="oc-stat-card-label">Revenue this month</span></div>
  </div>
  <a class="oc-stat-card oc-stat-card--accent oc-stat-card--stripe" href="#">
    <span class="oc-stat-card-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg></span>
    <span class="oc-stat-card-body"><span class="oc-stat-card-value">7</span><span class="oc-stat-card-label">Open orders - needs attention</span></span>
  </a>
</div>
