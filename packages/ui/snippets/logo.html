<!-- OmniaUI component: logo - A customer logo in its own colors and ratio, never filtered, with a neutral plate only in the theme where it would disappear. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-logo > img: the logo at --oc-logo-h (height), at most --oc-logo-w wide. Modifier: --box (the same box for every logo).
       data-plate="light" (a white logo: a plate in the light theme) | "dark" (a dark logo: a plate in the dark theme) |
         "both" (a mid plate in both) | "none" | "auto" (measured once by oc-logo.js: npx omniaui copy-js logo).
       Tokens: --oc-logo-plate-light, --oc-logo-plate-dark, --oc-logo-plate-both.
     The image must be same-origin (or send CORS headers) for "auto"; otherwise it stays without a plate.
-->
<span class="oc-logo" data-plate="auto"><img src="/uploads/logo-company-1.svg" alt="Company 1"></span>
<script type="module" src="/js/oc-logo.js"></script>
