<!-- OmniaUI component: flip-card — 3D flip card (front / back) on a checkbox toggle or on hover and focus. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/flip-card.html | Map: card -> hidden checkbox -> inner -> front face (+ flip label) -> back face (+ flip label)
     Class API: .oc-flip-card > input.oc-flip-card__toggle[type=checkbox] (optional) + .oc-flip-card__inner >
       .oc-flip-card__face--front / --back (.oc-flip-card__title, .oc-flip-card__text, label.oc-flip-card__flip for the checkbox).
     Modifiers: .oc-flip-card--hover (flip on hover / focus; give the card tabindex="0"), .oc-flip-card--vertical.
     States: checkbox :checked or .is-flipped. Reduced motion: no 3D turn, the faces cross-fade. No JavaScript.
-->
<div class="oc-flip-card" style="max-inline-size:18rem">
  <input type="checkbox" class="oc-flip-card__toggle" id="oc-flip-demo">
  <div class="oc-flip-card__inner">
    <div class="oc-flip-card__face oc-flip-card__face--front">
      <p class="oc-flip-card__text">Translate</p>
      <h3 class="oc-flip-card__title">la mariposa</h3>
      <label class="oc-flip-card__flip" for="oc-flip-demo">Show answer</label>
    </div>
    <div class="oc-flip-card__face oc-flip-card__face--back">
      <p class="oc-flip-card__text">Spanish → English</p>
      <h3 class="oc-flip-card__title">the butterfly</h3>
      <label class="oc-flip-card__flip" for="oc-flip-demo">Back to question</label>
    </div>
  </div>
</div>
