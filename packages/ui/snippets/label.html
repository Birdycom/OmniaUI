<!-- OmniaUI component: label - Form label: block, inline (around a control), required mark, muted. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-label: block label above a control. Modifiers: --required (red asterisk), --inline (wraps a checkbox/radio), --muted (secondary text)
-->
<div class="oc-form-group">
  <label class="oc-label oc-label--required" for="oc-label-email">E-mail</label>
  <input class="oc-input" id="oc-label-email" type="email" placeholder="name@example.com">
</div>
<label class="oc-label oc-label--inline"><input class="oc-checkbox" type="checkbox"> Accept terms and conditions</label>
