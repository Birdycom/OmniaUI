<!-- OmniaUI component: color-select - Pick one color from round swatches (or a list with names). Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/color-select.html | Map: fieldset group -> one label per color (radio + swatch + name)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-color-select: Group (a <fieldset> or role="radiogroup"). Modifiers: --list (rows with names), --sm.
       .oc-color-select-option: Label around one radio. Set the color with style="--oc-swatch: var(--color-...)".
       .oc-color-select-swatch: Round color dot
       .oc-color-select-name: Color name (visible in --list, screen-reader only in the swatch grid)
     States: checked (double ring), :focus-visible (outline), disabled (faded + diagonal line; add a title such as "Purple, in use")
     Only Omnia palette tokens as colors, e.g. var(--color-red-70) or var(--oc-primary).
-->
<fieldset class="oc-color-select" role="radiogroup" aria-label="Label color">
  <label class="oc-color-select-option" style="--oc-swatch: var(--color-vividblue-95)"><input type="radio" name="color" value="blue" checked><span class="oc-color-select-swatch"></span><span class="oc-color-select-name">Blue</span></label>
  <label class="oc-color-select-option" style="--oc-swatch: var(--color-teal-80)"><input type="radio" name="color" value="teal"><span class="oc-color-select-swatch"></span><span class="oc-color-select-name">Teal</span></label>
  <label class="oc-color-select-option" style="--oc-swatch: var(--color-green-60)"><input type="radio" name="color" value="green"><span class="oc-color-select-swatch"></span><span class="oc-color-select-name">Green</span></label>
  <label class="oc-color-select-option" style="--oc-swatch: var(--color-orange-95)"><input type="radio" name="color" value="orange"><span class="oc-color-select-swatch"></span><span class="oc-color-select-name">Orange</span></label>
  <label class="oc-color-select-option" style="--oc-swatch: var(--color-red-70)"><input type="radio" name="color" value="red"><span class="oc-color-select-swatch"></span><span class="oc-color-select-name">Red</span></label>
  <label class="oc-color-select-option" style="--oc-swatch: var(--color-purple-40)"><input type="radio" name="color" value="purple"><span class="oc-color-select-swatch"></span><span class="oc-color-select-name">Purple</span></label>
</fieldset>
