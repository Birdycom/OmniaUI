<!-- OmniaUI component: shot-grid - A grid of screenshots with a caption that open in the lightbox, and a browser frame with a glow in the accent color and a product mark on it. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/shot-grid.html | Map: screenshots -> browser frame with a glow.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-shot-grid: Auto-fit grid; --oc-shot-min is the minimum column width (18rem).
       .oc-shot: Figure: image (or picture) with object-fit: contain, --oc-shot-ratio (16 / 10), caption under it; a link or button around the image shows a zoom cursor.
       .oc-browser-frame--glow: Browser frame with a shadow in --oc-accent-from; the screenshot zooms in a little on hover.
       .oc-browser-frame__mark: A product mark or tile on the bottom end corner of the frame.
-->
<div class="oc-shot-grid" style="inline-size:100%">
  <figure class="oc-shot">
    <a href="/img/blocks/dashboard-01.jpg"><img src="/img/blocks/dashboard-01.jpg" alt="Dashboard" loading="lazy" width="640" height="400"></a>
    <figcaption>Dashboard with the figures of the day</figcaption>
  </figure>
  <figure class="oc-shot">
    <a href="/img/blocks/data-table.jpg"><img src="/img/blocks/data-table.jpg" alt="Customer list" loading="lazy" width="640" height="400"></a>
    <figcaption>Customer list with filters</figcaption>
  </figure>
  <figure class="oc-shot">
    <a href="/img/blocks/product-detail.jpg"><img src="/img/blocks/product-detail.jpg" alt="Product page" loading="lazy" width="640" height="400"></a>
    <figcaption>Product page with stock and documents</figcaption>
  </figure>
</div>
<div class="oc-browser-frame oc-browser-frame--glow oc-accent--green" style="inline-size:min(100%, 34rem)">
  <div class="oc-browser-frame__bar"><i></i><i></i><i></i></div>
  <img class="oc-browser-frame__body" src="/img/blocks/dashboard-01.jpg" alt="Dashboard of Product 1" width="640" height="400">
  <span class="oc-browser-frame__mark oc-icon-tile oc-icon-tile--lg oc-accent--green" aria-hidden="true"><iconify-icon icon="mdi:chart-box-outline"></iconify-icon></span>
</div>
