<!-- OmniaUI component: stack-card — Playlist or course cover drawn as a stacked deck with a count badge. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/stack-card.html | Map: card -> deck (cover thumb + count badge) -> title link + meta
     Class API: article.oc-stack-card > .oc-stack-card__deck > .oc-media-thumb (cover) + .oc-stack-card__count ·
       h3.oc-stack-card__title > a (covers the card) · p.oc-stack-card__meta.
     Modifiers: .oc-stack-card--panel (count as a dark side panel). The two layers behind the cover are ::before / ::after
       and fan out on hover (skipped with reduced motion). No JavaScript.
-->
<article class="oc-stack-card" style="max-inline-size:20rem">
  <div class="oc-stack-card__deck">
    <div class="oc-media-thumb"><div class="oc-media-art oc-media-art--4"></div></div>
    <span class="oc-stack-card__count"><span aria-hidden="true">&#9776;</span> 12 videos</span>
  </div>
  <div>
    <h3 class="oc-stack-card__title"><a href="#">Cabin build, start to finish</a></h3>
    <p class="oc-stack-card__meta">North Studio · Updated yesterday</p>
  </div>
</article>
