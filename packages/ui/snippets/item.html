<!-- OmniaUI component: item - Item: list row with media, content and actions. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-item: flex row (div, li or a). Variants: --outline, --muted, --sm, --interactive
       .oc-item-media: left slot. Modifiers: --icon (boxed icon), --image
       .oc-item-content: grows; holds .oc-item-title and .oc-item-description
       .oc-item-actions: right slot (buttons)
       .oc-item-header / .oc-item-footer: full-width rows above/below
       .oc-item-group: vertical list of items; .oc-item-separator between them
-->
<div class="oc-item oc-item--outline">
  <div class="oc-item-media oc-item-media--icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg></div>
  <div class="oc-item-content">
    <p class="oc-item-title">Two-factor authentication</p>
    <p class="oc-item-description">Verify sign-ins with an authenticator app.</p>
  </div>
  <div class="oc-item-actions"><button class="oc-btn oc-btn--outline oc-btn--sm" type="button">Enable</button></div>
</div>

<div class="oc-item-group oc-item--outline" style="border:1px solid var(--oc-border);border-radius:var(--oc-radius);padding:.25rem">
  <a class="oc-item oc-item--sm" href="#a"><div class="oc-item-media oc-item-media--icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h8l5 5v15H6z"/><path d="M14 2v5h5"/></svg></div><div class="oc-item-content"><p class="oc-item-title">invoice-2026-014.pdf</p><p class="oc-item-description">128 KB &middot; today</p></div><div class="oc-item-actions"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div></a>
  <hr class="oc-item-separator">
  <a class="oc-item oc-item--sm" href="#b"><div class="oc-item-media oc-item-media--icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><div class="oc-item-content"><p class="oc-item-title">Contracts</p><p class="oc-item-description">12 files</p></div><div class="oc-item-actions"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div></a>
</div>
<div class="oc-item oc-item--muted">
  <div class="oc-item-content"><p class="oc-item-title">Muted background, no media</p><p class="oc-item-description">Useful for inline notices and read-only rows.</p></div>
</div>
