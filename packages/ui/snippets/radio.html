<!-- OmniaUI component: radio - Radio group: native inputs, stacked or row, descriptions, card style. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-radio: the input (accent-color from the theme)
       .oc-radio-group: fieldset/div wrapper. Modifier: --row
       .oc-radio-item: label around input + text. Modifier: --card (bordered, highlights when checked)
-->
<fieldset class="oc-radio-group">
  <legend class="oc-label">Plan</legend>
  <label class="oc-radio-item"><input class="oc-radio" type="radio" name="oc-plan" value="free" checked> Free</label>
  <label class="oc-radio-item"><input class="oc-radio" type="radio" name="oc-plan" value="pro"> Pro</label>
  <label class="oc-radio-item"><input class="oc-radio" type="radio" name="oc-plan" value="team" disabled> Team (soon)</label>
</fieldset>

<div class="oc-radio-group">
  <label class="oc-radio-item oc-radio-item--card"><input class="oc-radio" type="radio" name="oc-bill" value="month" checked><span>Monthly<small>Billed every month, cancel anytime.</small></span></label>
  <label class="oc-radio-item oc-radio-item--card"><input class="oc-radio" type="radio" name="oc-bill" value="year"><span>Yearly<small>Two months free.</small></span></label>
</div>
