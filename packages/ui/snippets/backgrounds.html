<!-- OmniaUI component: backgrounds - Decorative layers behind a page or a section: a line grid, a soft glowing orb and fine scan lines. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/backgrounds.html | Map: grid, orbs and scan lines.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-bg-grid: Thin lines (4% primary) in a 60px grid, behind the content of a positioned parent.
       .oc-bg-grid--fixed / --fade: Fixed to the viewport (40px); lines that fade out towards the edges.
       --oc-bg-grid-size / --oc-bg-grid-line: Size and color of the grid.
       .oc-orb: A soft round glow in --oc-accent-from; place it with inset-*. Another color: .oc-accent--violet …
       .oc-orb--sm / --drift: A smaller orb (18rem); a slow drift.
       --oc-orb-size / --oc-orb-strength / --oc-orb-blur: Size, strength (0.15) and blur (50px) of the orb.
       .oc-scanlines: Fine horizontal lines over the whole page (fixed, on top, ignores the pointer). --local: inside a positioned parent.
-->
<div style="position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;min-block-size:16rem;inline-size:100%;border-radius:var(--oc-radius)">
  <div class="oc-bg-grid oc-bg-grid--fade" aria-hidden="true"></div>
  <div class="oc-orb oc-orb--drift" aria-hidden="true" style="inset-block-start:-6rem;inset-inline-start:-4rem;--oc-orb-strength:0.3"></div>
  <div class="oc-orb oc-orb--sm oc-accent--violet" aria-hidden="true" style="inset-block-end:-3rem;inset-inline-end:2rem;--oc-orb-strength:0.3"></div>
  <div class="oc-scanlines oc-scanlines--local" aria-hidden="true"></div>
  <p style="margin:0;font-size:1.5rem;font-weight:700">Your content</p>
</div>
