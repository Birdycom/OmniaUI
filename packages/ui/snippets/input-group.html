<!-- OmniaUI component: input-group - Input with prefix/suffix addon (currency, percent, units). Needs @birdycom/omniaui CSS.
-->
<div class="oc-input-group">
  <span class="oc-input-addon">&euro;</span>
  <input class="oc-input" type="text" inputmode="decimal" value="125.00" aria-label="Amount">
</div>
<div class="oc-input-group">
  <input class="oc-input" type="text" inputmode="decimal" value="21" aria-label="VAT rate">
  <span class="oc-input-addon">%</span>
</div>
