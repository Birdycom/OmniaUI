<!-- OmniaUI component: price - A price with old price, discount, VAT note and the amount incl. or excl. VAT. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/price.html | Map: prices.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-price: The block: __main line, then __note and __alt below.
       .oc-price__amount: The price (bold, tabular digits, never wraps).
       .oc-price__old: The old price, struck through. Add an .oc-badge in __main for the discount.
       .oc-price__note / __alt: A quiet note ("excl. VAT") and the other amount ("€ 121,00 incl. VAT").
       .oc-price--sm / --lg / --sale: Smaller or larger amount; --sale colors the amount red.
       .oc-price--inline / --end: Amount and note on one line (lists); right aligned (also automatic in a td[data-numeric]).
-->
<div class="flex flex-wrap gap-2 align-items-start">
  <div class="oc-price oc-price--lg">
    <div class="oc-price__main"><span class="oc-price__amount">€ 149,00</span></div>
    <span class="oc-price__note">excl. VAT</span>
    <span class="oc-price__alt">€ 180,29 incl. VAT</span>
  </div>
  <div class="oc-price oc-price--lg oc-price--sale">
    <div class="oc-price__main"><span class="oc-price__amount">€ 119,00</span><s class="oc-price__old">€ 149,00</s><span class="oc-badge oc-badge--destructive">-20%</span></div>
    <span class="oc-price__note">incl. VAT · free delivery</span>
  </div>
  <div class="oc-price oc-price--sm">
    <div class="oc-price__main"><span class="oc-price__amount">€ 6,40</span></div>
    <span class="oc-price__note">per piece · from 10 pieces € 5,90</span>
  </div>
</div>
