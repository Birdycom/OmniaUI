<!-- OmniaUI component: price-card - Plan card with a monthly / yearly toggle (radio + :has), discount badge and included / excluded features. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/price-card.html | Map: article.oc-price-card -> head (name + discount) -> toggle -> prices -> features -> cta
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-price-card: The card. Modifier: --featured (accent border + glow; use with .oc-accent--*)
       .oc-price-card__head / __name / __desc: Title row, plan name, short description
       .oc-price-card__discount: Badge ("Save 20%"), dimmed while monthly is selected
       .oc-price-card__toggle: Put on an .oc-segmented with radios value="monthly" and value="yearly" (unique name per card)
       .oc-price-card__price--monthly / --yearly: Price rows; the checked radio decides which one shows
       .oc-price-card__amount / __period / __was / __note: Big number, "/month", old price (<s>), small note
       .oc-price-card__features: List. .oc-price-card__feature (✓), modifier --excluded (✕ + muted)
       .oc-price-card__cta: Full-width button
     Slots: name, discount, description, prices, features, cta
-->
<article class="oc-price-card">
  <div class="oc-price-card__head">
    <h3 class="oc-price-card__name">Pro</h3>
    <span class="oc-price-card__discount">Save 20%</span>
  </div>
  <p class="oc-price-card__desc">For small teams that send invoices every week.</p>
  <div class="oc-segmented oc-price-card__toggle" role="radiogroup" aria-label="Billing period">
    <label class="oc-segmented-item"><input type="radio" name="oc-price-pro" value="monthly" checked> Monthly</label>
    <label class="oc-segmented-item"><input type="radio" name="oc-price-pro" value="yearly"> Yearly</label>
  </div>
  <p class="oc-price-card__price oc-price-card__price--monthly"><span class="oc-price-card__amount">&euro;12</span><span class="oc-price-card__period">/month</span></p>
  <p class="oc-price-card__price oc-price-card__price--yearly"><span class="oc-price-card__amount">&euro;115</span><span class="oc-price-card__period">/year</span><s class="oc-price-card__was">&euro;144</s><span class="oc-price-card__note">Billed once a year</span></p>
  <ul class="oc-price-card__features">
    <li class="oc-price-card__feature">Unlimited invoices</li>
    <li class="oc-price-card__feature">5 team members</li>
    <li class="oc-price-card__feature">Bank import</li>
    <li class="oc-price-card__feature oc-price-card__feature--excluded">Custom domain</li>
    <li class="oc-price-card__feature oc-price-card__feature--excluded">Priority support</li>
  </ul>
  <a class="oc-btn oc-price-card__cta" href="#signup">Choose Pro</a>
</article>
