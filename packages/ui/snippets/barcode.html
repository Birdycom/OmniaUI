<!-- OmniaUI component: barcode - EAN-13, EAN-8, UPC-A or Code 128 drawn as SVG from a value, no dependency. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/barcode.html | Map: barcode demo markup. Behaviour: barcode.js.
     Class API (modifiers are extra classes / attributes on the same element):
       figure.oc-barcode[data-value]: The barcode. The script replaces its content with the SVG and the digits.
       data-format: auto (default: 12–13 digits EAN-13, 7–8 EAN-8, 11 UPC-A, else Code 128), EAN13, EAN8, UPC or CODE128.
       data-digits="false": Bars only, no digits.
       .oc-barcode--hero / --compact: Large (product page, label) or small (table cell).
       --oc-barcode-height: Height of the bars (4rem).
       [data-error]: Set when the value cannot be encoded (wrong check digit, non-ASCII in Code 128); the reason shows instead of bars.
       encodeBarcode(value, format): Exported: the module string and the text, for your own canvas or PDF.
-->
<div style="display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center">
  <figure class="oc-barcode oc-barcode--hero" data-value="5400000000010"></figure>
  <figure class="oc-barcode" data-value="SKU-000105"></figure>
  <figure class="oc-barcode" data-value="96385074"></figure>
  <figure class="oc-barcode oc-barcode--compact" data-value="012345678905" data-format="UPC" data-digits="false"></figure>
  <figure class="oc-barcode" data-value="5400000000018"></figure>
</div>
