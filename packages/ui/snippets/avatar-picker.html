<!-- OmniaUI component: avatar-picker - Avatar or company logo with a preview, Upload and Remove, and drag and drop. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/avatar-picker.html | Map: avatar picker demo markup. Behaviour: form-extras.js.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-avatar-picker: Preview and text side by side.
       label.oc-avatar-picker__preview: The preview; clicking it opens the file dialog (the file input fills it, invisible).
       [data-oc-initials]: Shown until an image is picked.
       [data-oc-avatar-upload] / [data-oc-avatar-remove]: Open the dialog / go back to the initials. Remove only shows while there is an image.
       .oc-avatar-picker--square / --logo: Rounded square; --logo fits the whole image on white (no crop).
       oc-avatar-change: Event with detail.file (the File, or null after Remove).
-->
<div style="display:grid;gap:1.5rem">
<div class="oc-avatar-picker">
  <label class="oc-avatar-picker__preview" for="oc-avatar-me" title="Choose an image">
    <span data-oc-initials>C1</span>
    <input class="oc-avatar-picker__file" id="oc-avatar-me" type="file" accept="image/*">
  </label>
  <div class="oc-avatar-picker__text">
    <span class="oc-avatar-picker__label">Profile picture</span>
    <span class="oc-avatar-picker__hint">PNG or JPG, at least 256 × 256 px. Drop an image on the circle.</span>
    <div class="oc-avatar-picker__actions">
      <button type="button" class="oc-btn oc-btn--outline oc-btn--sm" data-oc-avatar-upload><iconify-icon icon="mdi:upload" aria-hidden="true"></iconify-icon>Upload</button>
      <button type="button" class="oc-btn oc-btn--ghost oc-btn--sm" data-oc-avatar-remove><iconify-icon icon="mdi:close" aria-hidden="true"></iconify-icon>Remove</button>
    </div>
  </div>
</div>
<div class="oc-avatar-picker oc-avatar-picker--square oc-avatar-picker--logo">
  <label class="oc-avatar-picker__preview" for="oc-logo-company" title="Choose an image">
    <span data-oc-initials>CO</span>
    <input class="oc-avatar-picker__file" id="oc-logo-company" type="file" accept="image/*">
  </label>
  <div class="oc-avatar-picker__text">
    <span class="oc-avatar-picker__label">Company logo</span>
    <span class="oc-avatar-picker__hint">SVG or PNG on a transparent background.</span>
    <div class="oc-avatar-picker__actions">
      <button type="button" class="oc-btn oc-btn--outline oc-btn--sm" data-oc-avatar-upload><iconify-icon icon="mdi:upload" aria-hidden="true"></iconify-icon>Upload</button>
      <button type="button" class="oc-btn oc-btn--ghost oc-btn--sm" data-oc-avatar-remove><iconify-icon icon="mdi:close" aria-hidden="true"></iconify-icon>Remove</button>
    </div>
  </div>
</div>
</div>
