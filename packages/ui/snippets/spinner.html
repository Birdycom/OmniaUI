<!-- OmniaUI component: spinner - Spinner: loading ring in sizes sm to xl, inherits currentColor. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-spinner: the ring (role="status" + aria-label). Sizes: --sm, --lg, --xl. Colors: --primary, --muted (or set `color`)
       --oc-spinner-size: custom size
-->
<div style="display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap">
  <span class="oc-spinner oc-spinner--sm" role="status" aria-label="Loading"></span>
  <span class="oc-spinner" role="status" aria-label="Loading"></span>
  <span class="oc-spinner oc-spinner--lg oc-spinner--primary" role="status" aria-label="Loading"></span>
  <span class="oc-spinner oc-spinner--xl oc-spinner--muted" role="status" aria-label="Loading"></span>
</div>

<button class="oc-btn" type="button" disabled aria-busy="true"><span class="oc-spinner oc-spinner--sm" aria-hidden="true"></span> Saving&hellip;</button>
<button class="oc-btn oc-btn--outline" type="button" disabled aria-busy="true"><span class="oc-spinner oc-spinner--sm" aria-hidden="true"></span> Loading</button>
