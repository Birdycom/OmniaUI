<!-- OmniaUI component: separator - Separator: horizontal, vertical and with label. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-separator: 1px divider (use on <hr>). Modifiers: --vertical, --strong
       .oc-separator-text: divider lines with a centered label
-->
<p style="margin:0;font-size:.875rem">Content above</p>
<hr class="oc-separator">
<p style="margin:0;font-size:.875rem">Content below</p>

<div style="display:flex;align-items:center;block-size:1.5rem;font-size:.875rem">
  <span>Blog</span><span class="oc-separator oc-separator--vertical" role="separator" aria-orientation="vertical"></span>
  <span>Docs</span><span class="oc-separator oc-separator--vertical" role="separator" aria-orientation="vertical"></span>
  <span>Source</span>
</div>
<div class="oc-separator-text" role="separator"><span>or continue with</span></div>
