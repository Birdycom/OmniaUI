<!-- OmniaUI component: chart - Chart tokens --oc-chart-1..5 (light-dark Omnia colors) with legend, bar and pie helpers. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       --oc-chart-1 .. --oc-chart-5: series colors (blue, teal, orange, purple, pink); --oc-chart-grid, --oc-chart-axis
       .oc-chart-legend > li > .oc-chart-swatch: legend (swatch colors by position)
       .oc-chart-bars > *: bar per item, height from --oc-bar
       .oc-chart-pie (+ --donut): conic-gradient pie; stops set inline
-->
<div style="display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-end">
  <div style="flex:1 1 16rem">
    <ul class="oc-chart-bars" role="img" aria-label="Revenue by quarter: 40, 65, 50, 85 percent of target">
      <li style="--oc-bar:40%"></li><li style="--oc-bar:65%"></li><li style="--oc-bar:50%"></li><li style="--oc-bar:85%"></li>
    </ul>
    <ul class="oc-chart-legend" style="margin-top:.75rem">
      <li><span class="oc-chart-swatch"></span>Q1</li><li><span class="oc-chart-swatch"></span>Q2</li><li><span class="oc-chart-swatch"></span>Q3</li><li><span class="oc-chart-swatch"></span>Q4</li>
    </ul>
  </div>
  <div class="oc-chart-pie oc-chart-pie--donut" role="img" aria-label="Share: 40, 25, 17, 18 percent"></div>
</div>

<svg viewBox="0 0 220 80" width="220" height="80" role="img" aria-label="Line chart with two series">
  <path d="M0 60 L40 45 L80 50 L120 25 L160 30 L220 10" fill="none" stroke="var(--oc-chart-1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M0 70 L40 65 L80 55 L120 58 L160 40 L220 35" fill="none" stroke="var(--oc-chart-2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M0 78 H220" stroke="var(--oc-chart-grid)"/>
</svg>
<span class="oc-badge" style="background:var(--oc-chart-3);color:var(--oc-primary-foreground)">chart-3</span>
<span class="oc-badge" style="background:var(--oc-chart-4);color:var(--oc-primary-foreground)">chart-4</span>
<span class="oc-badge" style="background:var(--oc-chart-5);color:var(--oc-primary-foreground)">chart-5</span>
