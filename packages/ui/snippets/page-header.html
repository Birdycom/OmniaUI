<!-- OmniaUI component: page-header - Page title row with back link, subtitle, meta and actions; actions move under the title in narrow containers. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/page-header.html | Map: header -> back row -> main (text: title + badge, subtitle, meta | actions)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-page-header: Header (size container). Modifiers: --bordered (line under it), --sticky, --sm.
       .oc-page-header-back: Optional row for an .oc-back-link
       .oc-page-header-main: Text block + actions (side by side from a 36rem container width)
       .oc-page-header-text / -title / -subtitle / -meta: Text column, h1 (may hold a badge), sub line, meta row
       .oc-page-header-actions: Buttons
     Slots: back, title, subtitle, meta, actions
-->
<header class="oc-page-header oc-page-header--bordered">
  <div class="oc-page-header-back"><a class="oc-back-link" href="#">Projects</a></div>
  <div class="oc-page-header-main">
    <div class="oc-page-header-text">
      <h1 class="oc-page-header-title">Kitchen renovation <span class="oc-badge oc-badge--success">Active</span></h1>
      <p class="oc-page-header-subtitle">Main street 12, Ghent - started 2 September 2026.</p>
      <div class="oc-page-header-meta"><span>Owner: Ada Lovelace</span><span>Updated 2 hours ago</span></div>
    </div>
    <div class="oc-page-header-actions">
      <button class="oc-btn oc-btn--outline" type="button">Share</button>
      <button class="oc-btn" type="button">New quote</button>
    </div>
  </div>
</header>
