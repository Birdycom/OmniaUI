<!-- OmniaUI component: toggle - Toggle and toggle group: pressed state on checkbox/radio or aria-pressed. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-toggle: label (around input) or button. On state: input:checked, [aria-pressed=true], [data-state=on]. Variants: --outline. Sizes: --sm, --lg. --icon: square
       .oc-toggle-group: connected toggles (radio inputs = single, checkbox inputs = multiple). Modifier: --spaced
-->
<div class="oc-toggle-group" role="group" aria-label="Text formatting">
  <label class="oc-toggle oc-toggle--outline oc-toggle--icon" title="Bold"><input type="checkbox" name="fmt" value="bold" aria-label="Bold" checked><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/></svg></label>
  <label class="oc-toggle oc-toggle--outline oc-toggle--icon" title="Italic"><input type="checkbox" name="fmt" value="italic" aria-label="Italic"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 4h-9M14 20H5M15 4 9 20"/></svg></label>
  <label class="oc-toggle oc-toggle--outline oc-toggle--icon" title="Underline"><input type="checkbox" name="fmt" value="underline" aria-label="Underline"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 12 0V4M4 21h16"/></svg></label>
</div>

<div class="oc-toggle-group" role="radiogroup" aria-label="Alignment">
  <label class="oc-toggle oc-toggle--icon"><input type="radio" name="oc-align" value="left" aria-label="Left" checked><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h14"/></svg></label>
  <label class="oc-toggle oc-toggle--icon"><input type="radio" name="oc-align" value="center" aria-label="Center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M5 18h14"/></svg></label>
  <label class="oc-toggle oc-toggle--icon"><input type="radio" name="oc-align" value="right" aria-label="Right"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M10 12h10M6 18h14"/></svg></label>
</div>

<label class="oc-toggle oc-toggle--outline"><input type="checkbox"> Italic</label>
<label class="oc-toggle oc-toggle--outline oc-toggle--sm"><input type="checkbox" checked> Small</label>
<label class="oc-toggle oc-toggle--outline oc-toggle--lg"><input type="checkbox"> Large</label>
<button class="oc-toggle oc-toggle--outline" type="button" aria-pressed="true">Pressed button</button>
<div class="oc-toggle-group oc-toggle-group--spaced" role="group" aria-label="Spaced"><label class="oc-toggle oc-toggle--outline"><input type="checkbox" checked> A</label><label class="oc-toggle oc-toggle--outline"><input type="checkbox"> B</label></div>
