<!-- OmniaUI component: paper - An off-white paper surface with a fine grain: tones, writing paper with lines, squares or dots, and paper edges. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/paper.html | Map: sheet of lined paper with a margin -> torn sheet in a lift wrapper -> section with the paper theme
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-paper: Off-white background with a fine grain and a matching ink color. Modifier: --smooth (no grain)
       .oc-paper--bright / --ivory / --gray / --kraft: Tones. Own tone: --oc-paper-tint, --oc-paper-l, --oc-paper-c. The same color in light and dark mode
       .oc-paper--sheet: A single sheet with padding (--oc-paper-pad) and a soft shadow
       .oc-paper-lift: Wrapper that gives a sheet with a cut edge a shadow that follows the edge
       .oc-paper--lined: Ruled writing paper; --oc-paper-line (1.75rem) is the rule distance and the line height
       .oc-paper--margin: Red margin line on the start side (--oc-paper-margin-at)
       .oc-paper--grid / --dots: Squared paper and a dot grid (--oc-paper-grid)
       .oc-paper--mm: Millimeter paper, lines every 1, 5 and 10 mm (--oc-paper-mm, --oc-paper-mm-color)
       .oc-paper--torn / --torn-top / --torn-both: Torn edge (--oc-paper-tear, --oc-paper-tear-width)
       .oc-paper--zigzag: Zigzag cut of a receipt at the bottom (--oc-paper-tooth)
       .oc-paper--holes: Punched holes on the start side. .oc-paper--fold: folded corner. .oc-paper--stack: two more sheets under it
       .oc-paper-theme: Sets --oc-background, --oc-card and --oc-popover to off-white for everything inside (on <body> or a section)
     One cut edge at a time: torn, zigzag and holes each use the CSS mask.
-->
<div class="oc-paper oc-paper--sheet oc-paper--lined oc-paper--margin">
  <h4>Meeting notes</h4>
  <p>Customer 1 wants the quote before Friday. Ask Company 1 for the delivery time of the screens.</p>
  <p>Next meeting: Tuesday at 10:00.</p>
</div>

<div class="oc-paper-lift">
  <div class="oc-paper oc-paper--sheet oc-paper--torn">
    <p>A sheet with a torn edge at the bottom.</p>
  </div>
</div>

<section class="oc-paper-theme oc-paper">
  <article class="oc-card"><div class="oc-card-content"><p>A card on an off-white page.</p></div></article>
</section>
