<!-- OmniaUI component: drawer - Drawer: bottom sheet on dialog with drag handle look, no JavaScript. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       dialog.oc-drawer: the dialog (closedby="any"). Modifier: --center (centered from 40rem up)
       .oc-drawer-content: the panel
       .oc-drawer-handle: grabber bar (decorative)
       .oc-drawer-header / -title / -description: heading
       .oc-drawer-body: scrolling content
       .oc-drawer-footer: stacked actions
-->
<button class="oc-btn oc-btn--outline" type="button" command="show-modal" commandfor="oc-drawer-demo">Open drawer</button>

<dialog class="oc-drawer" id="oc-drawer-demo" closedby="any" aria-labelledby="oc-drawer-demo-title">
  <div class="oc-drawer-content">
    <div class="oc-drawer-handle" aria-hidden="true"></div>
    <div class="oc-drawer-header">
      <h2 class="oc-drawer-title" id="oc-drawer-demo-title">Move goal</h2>
      <p class="oc-drawer-description">Set your daily activity goal.</p>
    </div>
    <div class="oc-drawer-body">
      <div class="oc-field">
        <label class="oc-field-label" for="oc-drawer-goal">Calories per day</label>
        <input class="oc-slider" id="oc-drawer-goal" type="range" min="100" max="600" value="350" style="--oc-slider-progress: 50%" oninput="this.style.setProperty('--oc-slider-progress', (this.value - this.min) / (this.max - this.min) * 100 + '%')">
      </div>
    </div>
    <div class="oc-drawer-footer">
      <button class="oc-btn" type="button" command="close" commandfor="oc-drawer-demo">Submit</button>
      <button class="oc-btn oc-btn--outline" type="button" command="close" commandfor="oc-drawer-demo">Cancel</button>
    </div>
  </div>
</dialog>
