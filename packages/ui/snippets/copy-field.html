<!-- OmniaUI component: copy-field - Read-only monospace value with a copy button. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-copy-field: Wrapper
       .oc-copy-field-value: Read-only <input readonly> (or <output> with --wrap)
       .oc-copy-field-button: Copy button; add .is-copied for 2s feedback; data-copy="..." copies that instead of the value;
         data-copied-label (0.17.0): the feedback ("Copied") in .oc-copy-field-button-label and .oc-copy-field-status
       .oc-copy-field-icon-copy / -copied (0.17.0): mdi:content-copy and mdi:check on the button; they swap on .is-copied
       .oc-copy-field-status (0.17.0): visually hidden role="status" live region that announces the feedback
       .oc-copy-field-toggle (0.17.0): show/hide for a secret (input type="password", aria-pressed, aria-label);
         .oc-copy-field-icon-show / -hide (mdi:eye / mdi:eye-off) swap on aria-pressed
       .oc-copy-field--wrap (0.17.0): long values break over lines (use <output class="oc-copy-field-value">)
       .oc-copy-field--display (+ --lg) (0.17.0): large centred code; .oc-copy-field-caption: a line under it
-->
<div class="oc-copy-field">
  <input class="oc-copy-field-value" id="oc-copy-key" type="password" readonly value="JBSWY3DPEHPK3PXP" aria-label="Setup key" autocomplete="off">
  <button class="oc-copy-field-toggle" type="button" aria-pressed="false" aria-controls="oc-copy-key" aria-label="Show value">
    <svg class="oc-copy-field-icon-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 9a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 8a5 5 0 0 1-5-5a5 5 0 0 1 5-5a5 5 0 0 1 5 5a5 5 0 0 1-5 5m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5"/></svg>
    <svg class="oc-copy-field-icon-hide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M11.83 9L15 12.16V12a3 3 0 0 0-3-3zm-4.3.8l1.55 1.55c-.05.21-.08.42-.08.65a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53a5 5 0 0 1-5-5c0-.79.2-1.53.53-2.2M2 4.27l2.28 2.28l.45.45C3.08 8.3 1.78 10 1 12c1.73 4.39 6 7.5 11 7.5c1.55 0 3.03-.3 4.38-.84l.43.42L19.73 22L21 20.73L3.27 3M12 7a5 5 0 0 1 5 5c0 .64-.13 1.26-.36 1.82l2.93 2.93c1.5-1.25 2.7-2.89 3.43-4.75c-1.73-4.39-6-7.5-11-7.5c-1.4 0-2.74.25-4 .7l2.17 2.15C10.74 7.13 11.35 7 12 7"/></svg>
  </button>
  <button class="oc-copy-field-button" type="button" data-copied-label="Copied">
    <svg class="oc-copy-field-icon-copy" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M19 21H8V7h11m0-2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m-3-4H4a2 2 0 0 0-2 2v14h2V3h12z"/></svg>
    <svg class="oc-copy-field-icon-copied" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M21 7L9 19l-5.5-5.5l1.41-1.41L9 16.17L19.59 5.59z"/></svg>
    <span class="oc-copy-field-button-label">Copy</span>
  </button>
  <span class="oc-copy-field-status oc-visually-hidden" role="status" aria-live="polite"></span>
</div>
<script>
  document.addEventListener('click', async (e) => {
    const toggle = e.target.closest('.oc-copy-field-toggle');
    if (toggle) {
      const show = toggle.getAttribute('aria-pressed') !== 'true';
      toggle.setAttribute('aria-pressed', String(show));
      const input = toggle.parentElement.querySelector('input.oc-copy-field-value');
      if (input) input.type = show ? 'text' : 'password';
      return;
    }
    const btn = e.target.closest('.oc-copy-field-button');
    if (!btn) return;
    const field = btn.parentElement;
    const value = field.querySelector('.oc-copy-field-value');
    // data-copy: the raw code when the field shows it in groups ("K7QM 2XPA" -> "K7QM2XPA")
    try { await navigator.clipboard.writeText(btn.dataset.copy ?? value.value); } catch { return; }
    // data-copied-label: the feedback on the button and in the live region (.oc-copy-field-status)
    const label = btn.querySelector('.oc-copy-field-button-label');
    const status = field.querySelector('.oc-copy-field-status');
    const done = btn.dataset.copiedLabel || 'Copied';
    if (label) { label.dataset.label ??= label.textContent; label.textContent = done; }
    if (status) status.textContent = done;
    btn.classList.add('is-copied');
    clearTimeout(btn.ocCopyTimer);
    btn.ocCopyTimer = setTimeout(() => {
      btn.classList.remove('is-copied');
      if (label) label.textContent = label.dataset.label;
      if (status) status.textContent = '';
    }, 2000);
  });
</script>
