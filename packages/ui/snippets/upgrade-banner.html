<!-- OmniaUI component: upgrade-banner - Soft callout for a free plan with limits, a usage meter and an upgrade action. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/upgrade-banner.html | Map: callout -> icon -> body (title + plan, text, usage meter) -> actions -> dismiss
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-upgrade-banner: Callout (role="note" or aside). Modifiers: --premium (brand gradient frame), --compact (one line). State: hidden attribute. Tone: --oc-upgrade-color.
       .oc-upgrade-banner-icon: Icon in the tone color
       .oc-upgrade-banner-body / -title / -plan / -text: Text column, title row, plan pill, explanation (may contain links)
       .oc-upgrade-banner-usage + meter.oc-upgrade-banner-meter: Label, native meter, "3 / 5"
       .oc-upgrade-banner-actions: Upgrade button and secondary link
       .oc-upgrade-banner-dismiss: Optional X in the corner (your app sets hidden)
     Slots: icon, title, plan, text, usage, actions
-->
<aside class="oc-upgrade-banner" aria-label="Plan limits">
  <span class="oc-upgrade-banner-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></span>
  <div class="oc-upgrade-banner-body">
    <p class="oc-upgrade-banner-title">You are on the free plan <span class="oc-upgrade-banner-plan">Free</span></p>
    <p class="oc-upgrade-banner-text">Free accounts keep up to 5 projects. Groups, exports and unlimited history come with <a href="#">Premium</a>.</p>
    <div class="oc-upgrade-banner-usage">
      <span>Projects</span>
      <meter class="oc-upgrade-banner-meter" min="0" max="5" low="3" high="4" optimum="0" value="4" aria-label="Projects used">4 of 5</meter>
      <span>4 / 5</span>
    </div>
  </div>
  <div class="oc-upgrade-banner-actions">
    <a class="oc-btn oc-btn--sm" href="#">Upgrade</a>
    <a class="oc-btn oc-btn--ghost oc-btn--sm" href="#">Compare plans</a>
  </div>
  <button class="oc-upgrade-banner-dismiss" type="button" aria-label="Dismiss">&times;</button>
</aside>
