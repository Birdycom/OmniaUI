<!-- OmniaUI component: rating - Star rating: show a score with halves, or let people pick 1 to 5 stars. No JavaScript. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/rating.html | Map: score and summary -> pick a rating.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-rating: The stars of a score. --oc-rating is the score (decimals work), --oc-rating-max the number of stars (default 5). Give it role="img" and an aria-label ("4.5 out of 5").
       .oc-rating--sm / --lg: Smaller or larger stars (--oc-rating-size sets any size).
       .oc-rating-summary: Stars, the score (__score) and the number of reviews (__count, a link or text) on one line.
       fieldset.oc-rating-input: Five <label>s with a radio inside (value 1–5) and a hidden text ("3 stars"). The checked or hovered star fills the stars before it. --sm / --lg sizes.
       --oc-rating-color / --oc-rating-empty: Colors of the filled and empty stars (default: the warning token and a light muted tone).
-->
<div class="flex flex-column gap-1">
  <span class="oc-rating" style="--oc-rating: 4.5" role="img" aria-label="4.5 out of 5"></span>
  <div class="oc-rating-summary">
    <span class="oc-rating oc-rating--sm" style="--oc-rating: 4.2" role="img" aria-label="4.2 out of 5"></span>
    <span class="oc-rating-summary__score">4.2</span>
    <a class="oc-rating-summary__count" href="#reviews">128 reviews</a>
  </div>
  <span class="oc-rating oc-rating--lg" style="--oc-rating: 3" role="img" aria-label="3 out of 5"></span>
</div>
<fieldset class="oc-rating-input oc-rating-input--lg">
  <legend>Your rating</legend>
  <label><input type="radio" name="oc-rating-demo" value="1"><span>1 star</span></label>
  <label><input type="radio" name="oc-rating-demo" value="2"><span>2 stars</span></label>
  <label><input type="radio" name="oc-rating-demo" value="3"><span>3 stars</span></label>
  <label><input type="radio" name="oc-rating-demo" value="4" checked><span>4 stars</span></label>
  <label><input type="radio" name="oc-rating-demo" value="5"><span>5 stars</span></label>
</fieldset>
