<!-- OmniaUI component: glass - See-through glass sheet and panels with a light top edge, for widgets and panels over a photo, a gradient or the desktop. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/glass.html | Map: div.oc-glass (sheet) -> content -> div.oc-glass-panel (layer) / .oc-card (becomes a glass panel)
     Class API (modifiers are extra classes on the same element):
       .oc-glass: the outer sheet (see-through, blurred background, light top edge, soft shadow); .oc-card inside turns into a glass panel
       .oc-glass-panel: a lighter layer inside a sheet; .oc-glass-divider: hairline
       Modifiers: --strong (more opaque), --flat (desktop window where the OS draws the blur: no own blur, no shadow)
       Tokens: --oc-glass-sheet, -panel, -panel-strong, -edge, -edge-hi, -hairline, -shadow, -panel-shadow, -blur, -radius, -panel-radius
       Solid surfaces with prefers-reduced-transparency: reduce.
     Needs something behind it to show through: a photo, a gradient, or a transparent window (Electron, Tauri).
-->
<div class="oc-glass p-1 grid gap-0.7" style="max-inline-size: 24rem">
  <div class="flex align-items-center justify-between gap-0.5">
    <strong>Usage today</strong>
    <span class="oc-badge oc-badge--outline">Pro plan</span>
  </div>
  <div class="oc-glass-panel p-0.7 grid gap-0.5">
    <div class="flex justify-between font-0.8"><span>Session</span><span class="font-num-tabular">34%</span></div>
    <div class="oc-progress oc-progress--sm oc-progress--glow" role="progressbar" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100" aria-label="Session usage">
      <span class="oc-progress-bar" style="width: 34%"></span>
    </div>
  </div>
  <hr class="oc-glass-divider">
  <p class="m-0 font-0.8" style="color: var(--oc-muted-foreground)">Resets at 18:00.</p>
</div>
