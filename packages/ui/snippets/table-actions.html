<!-- OmniaUI component: table-actions - Row actions as small icon buttons or as one overflow menu (popover) - no JavaScript. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/table-actions.html | Map: table -> row with icon actions -> row with overflow menu
     Class API (modifiers are extra classes / attributes on the same element):
       td.oc-table-actions: Actions cell from the table component (right aligned, no wrap). Modifier: --icons (tighter gap).
       .oc-table-actions-icon: Square icon action (a or button) with aria-label + title. Tones: --primary, --success, --destructive. State: disabled / aria-disabled="true".
       .oc-table-actions-more[popovertarget]: Overflow trigger (three dots). Stays highlighted while its menu is open.
       .oc-dropdown-menu[popover]: The overflow menu (dropdown component); opens toward the inline start.
     Slots: icon actions, or trigger + menu items (.oc-dropdown-item, --destructive, .oc-dropdown-separator)
-->
<div class="oc-table-wrap">
  <table class="oc-table">
    <thead>
      <tr><th>Name</th><th>E-mail</th><th style="width:7rem"><span class="oc-visually-hidden">Actions</span></th></tr>
    </thead>
    <tbody>
      <tr>
        <td>Ada Lovelace</td><td>ada@example.com</td>
        <td class="oc-table-actions oc-table-actions--icons">
          <a class="oc-table-actions-icon oc-table-actions-icon--primary" href="#" aria-label="View Ada" title="View"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></a>
          <a class="oc-table-actions-icon" href="#" aria-label="Edit Ada" title="Edit"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>
          <button class="oc-table-actions-icon oc-table-actions-icon--destructive" type="button" aria-label="Delete Ada" title="Delete"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
        </td>
      </tr>
      <tr>
        <td>Alan Turing</td><td>alan@example.com</td>
        <td class="oc-table-actions">
          <button class="oc-table-actions-more" type="button" popovertarget="oc-table-actions-menu-alan" aria-label="Actions for Alan"></button>
          <div class="oc-dropdown-menu" id="oc-table-actions-menu-alan" popover>
            <a class="oc-dropdown-item" href="#">View</a>
            <a class="oc-dropdown-item" href="#">Edit</a>
            <button class="oc-dropdown-item" type="button">Duplicate</button>
            <div class="oc-dropdown-separator"></div>
            <button class="oc-dropdown-item oc-dropdown-item--destructive" type="button">Delete</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
