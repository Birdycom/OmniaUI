<!-- OmniaUI component: checklist - Rule / step list with met and unmet states (password rules, onboarding). Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-checklist: ul wrapper (use aria-live="polite" for live rules). Modifier: --card (bordered rows with action slot).
       .oc-checklist-item: Row. State: .is-done / aria-checked="true"
       .oc-checklist-text / -title / -hint: Text column, title and hint (card variant)
-->
<ul class="oc-checklist" aria-live="polite" aria-label="Password requirements">
  <li class="oc-checklist-item is-done">At least 12 characters</li>
  <li class="oc-checklist-item is-done">One uppercase letter</li>
  <li class="oc-checklist-item">One number</li>
  <li class="oc-checklist-item">One symbol</li>
</ul>

<ul class="oc-checklist oc-checklist--card" style="margin-top:1rem">
  <li class="oc-checklist-item is-done">
    <span class="oc-checklist-text"><span class="oc-checklist-title">Add company details</span><span class="oc-checklist-hint">Name, VAT number, address</span></span>
    <a class="oc-btn oc-btn--outline oc-btn--sm" href="#">Open</a>
  </li>
  <li class="oc-checklist-item">
    <span class="oc-checklist-text"><span class="oc-checklist-title">Connect your bank</span><span class="oc-checklist-hint">Import transactions automatically</span></span>
    <a class="oc-btn oc-btn--outline oc-btn--sm" href="#">Open</a>
  </li>
</ul>
