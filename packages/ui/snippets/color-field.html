<!-- OmniaUI component: color-field - Native color picker next to a hex text input. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-color-field: Row wrapper
       input[type=color]: Native picker swatch
       .oc-input: Text field with the value (monospaced)
-->
<div class="oc-field">
  <label class="oc-field-label" for="oc-color-demo">Brand color</label>
  <div class="oc-color-field">
    <input type="color" id="oc-color-demo" value="#3366cc" aria-label="Pick a color">
    <input class="oc-input" type="text" value="#3366cc" aria-label="Color value">
  </div>
</div>
