<!-- OmniaUI component: native-select - Native select: themed <select>; optional base-select picker styling. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       select.oc-select: themed select (existing)
       select.oc-select.oc-select--custom: also styles ::picker(select), options, checkmark where appearance: base-select is supported; elsewhere it looks like .oc-select
-->
<div class="oc-field" style="max-inline-size:16rem">
  <label class="oc-field-label" for="oc-ns-fruit">Fruit</label>
  <select class="oc-select oc-select--custom" id="oc-ns-fruit">
    <option>Apple</option>
    <option selected>Banana</option>
    <option>Blueberry</option>
    <option>Grapes</option>
    <option>Pineapple</option>
  </select>
</div>
