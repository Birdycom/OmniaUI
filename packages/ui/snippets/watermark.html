<!-- OmniaUI component: watermark - Light slanted text such as CONCEPT or DRAFT over an image, a card or a live frame. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/watermark.html | Map: positioned box -> content -> span.oc-watermark (last child) per variant
     Class API (modifiers are extra classes on the same element):
       .oc-watermark: click-through layer over its positioned parent, text in a <span>, scales with the box
       Content: a <span> with text, an <img> logo or an inline <svg> icon; .oc-watermark__stack puts a mark above a word
       Modifiers: --straight (no slant), --tile (repeat: several children), --corner / --corner-top (small stamp), --mono (gray logo),
         --light (for dark images), --primary, --destructive
       Tokens: --oc-watermark-color, --oc-watermark-opacity, --oc-watermark-angle, --oc-watermark-size
     Slots: the text (one span; several for --tile). The layer is aria-hidden: say "draft" in the content if it matters.
-->
<figure class="relative m-0 w-full aspect-16 overflow-hidden rounded-lg">
  <span class="oc-media-art oc-media-art--3" role="img" aria-label="Kitchen, design"></span>
  <span class="oc-watermark" aria-hidden="true"><span>Concept</span></span>
</figure>

<article class="oc-card relative">
  <div class="oc-card-header"><h3 class="oc-card-title">Quote 2026-014</h3></div>
  <div class="oc-card-content">Kitchen renovation, Hasselt. Valid for 30 days.</div>
  <span class="oc-watermark oc-watermark--straight oc-watermark--destructive" aria-hidden="true"><span>Draft</span></span>
</article>

<figure class="relative m-0 w-full aspect-16 overflow-hidden rounded-lg">
  <span class="oc-media-art oc-media-art--5" role="img" aria-label="Passive house, photo"></span>
  <span class="oc-watermark oc-watermark--tile oc-watermark--light" aria-hidden="true"><span>Sample</span><span>Sample</span><span>Sample</span><span>Sample</span><span>Sample</span><span>Sample</span><span>Sample</span><span>Sample</span><span>Sample</span><span>Sample</span><span>Sample</span><span>Sample</span></span>
</figure>

<figure class="relative m-0 w-full aspect-16 overflow-hidden rounded-lg">
  <span class="oc-media-art oc-media-art--6" role="img" aria-label="Garden terrace, photo"></span>
  <span class="oc-watermark oc-watermark--corner" aria-hidden="true"><span>Preview</span></span>
</figure>

<figure class="relative m-0 w-full aspect-16 overflow-hidden rounded-lg">

</figure>
