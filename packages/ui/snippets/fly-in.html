<!-- OmniaUI component: fly-in - Cards that fly in from the middle of their row when they scroll into view, with a hover lift that keeps working, and a New badge in a product card. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/fly-in.html | Map: product cards.
     Behaviour: fly.js (npx omniaui copy-js fly); works without it.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-reveal--fly: A card that flies in. Hidden only while html.oc-fly-ready is set (by fly.js) and the card is not yet .is-visible.
       --oc-fly-x: Start offset from the middle of the row; fly.js sets it per card.
       .is-visible: Added by fly.js when the card comes into view; the card flies to its place.
       .oc-product-card__badge: A small New label after the name of a product card (with .oc-pill).
       initFly(scope): Exported from @birdycom/omniaui/fly.js; returns a function that stops watching.
-->
<div class="oc-card-grid" style="inline-size:100%">
  <a class="oc-product-card oc-reveal--fly oc-accent--blue" href="#product-1">
    <h3 class="oc-product-card__name">Product 1</h3>
    <p class="oc-product-card__tagline">Plan every shift</p>
    <p class="oc-product-card__summary">Schedules and leave in one view.</p>
    <span class="oc-product-card__more">Read more</span>
  </a>
  <a class="oc-product-card oc-reveal--fly oc-accent--green" href="#product-2">
    <h3 class="oc-product-card__name">Product 2 <span class="oc-product-card__badge oc-pill oc-pill--accent">New</span></h3>
    <p class="oc-product-card__tagline">Quotes in minutes</p>
    <p class="oc-product-card__summary">From quote to invoice without typing twice.</p>
    <span class="oc-product-card__more">Read more</span>
  </a>
  <a class="oc-product-card oc-reveal--fly oc-accent--violet" href="#product-3">
    <h3 class="oc-product-card__name">Product 3</h3>
    <p class="oc-product-card__tagline">Your shop online</p>
    <p class="oc-product-card__summary">Products, stock and orders in one place.</p>
    <span class="oc-product-card__more">Read more</span>
  </a>
</div>
