<!-- OmniaUI component: terminal-log — Console window with traffic lights, level colors and a blinking cursor. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/terminal-log.html | Map: frame -> bar (dots, title, status) -> body (role=log) -> lines -> prompt
     Class API: .oc-terminal-log > .oc-terminal-log__bar (3 × <i>, .oc-terminal-log__title, .oc-terminal-log__status) ·
       .oc-terminal-log__body (role="log", tabindex=0) > p.oc-terminal-log__line (time.oc-terminal-log__time optional,
       span.oc-terminal-log__level, span.oc-terminal-log__msg) · p.oc-terminal-log__prompt (last line, blinking cursor).
     Modifiers (on a line): --info, --success, --warn, --error, --debug. Height: --oc-terminal-log-height (default 18rem).
     Always dark (color-scheme: dark). Cursor blink and live pulse stop with reduced motion. Appending lines is up to your app.
-->
<div class="oc-terminal-log" style="max-inline-size:40rem">
  <div class="oc-terminal-log__bar">
    <i></i><i></i><i></i>
    <span class="oc-terminal-log__title">scan — example.com</span>
    <span class="oc-terminal-log__status">Live</span>
  </div>
  <div class="oc-terminal-log__body" role="log" aria-live="polite" aria-label="Scan output" tabindex="0">
    <p class="oc-terminal-log__line oc-terminal-log__line--info"><time class="oc-terminal-log__time">09:41:02</time><span class="oc-terminal-log__level">info</span><span class="oc-terminal-log__msg">Starting scan of https://example.com</span></p>
    <p class="oc-terminal-log__line oc-terminal-log__line--debug"><time class="oc-terminal-log__time">09:41:02</time><span class="oc-terminal-log__level">debug</span><span class="oc-terminal-log__msg">Resolved 3 hosts, 14 paths queued</span></p>
    <p class="oc-terminal-log__line oc-terminal-log__line--success"><time class="oc-terminal-log__time">09:41:04</time><span class="oc-terminal-log__level">ok</span><span class="oc-terminal-log__msg">TLS certificate valid for 82 days</span></p>
    <p class="oc-terminal-log__line oc-terminal-log__line--warn"><time class="oc-terminal-log__time">09:41:06</time><span class="oc-terminal-log__level">warn</span><span class="oc-terminal-log__msg">Missing header: Content-Security-Policy</span></p>
    <p class="oc-terminal-log__line oc-terminal-log__line--error"><time class="oc-terminal-log__time">09:41:07</time><span class="oc-terminal-log__level">error</span><span class="oc-terminal-log__msg">/admin answered 200 without login</span></p>
    <p class="oc-terminal-log__prompt">waiting for next host</p>
  </div>
</div>
