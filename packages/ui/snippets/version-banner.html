<!-- OmniaUI component: version-banner - Small "new version available - reload" chip; the reload is a plain link to the current page. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/version-banner.html | Map: chip -> dot -> long text -> short text -> reload action
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-version-banner: The chip (role="status"). Modifiers: --info, --success (tone; default warning), --floating (fixed bottom end). State: hidden attribute.
       .oc-version-banner-dot: Pulsing dot in the tone color
       .oc-version-banner-text / -short: Long text, and the short text shown instead below 40rem
       .oc-version-banner-action: Reload link (href="") or button
     Slots: text, short text, action
-->
<div class="oc-version-banner" role="status">
  <span class="oc-version-banner-dot" aria-hidden="true"></span>
  <span class="oc-version-banner-text">New version (v0.6.0) available - reload the page</span>
  <span class="oc-version-banner-short">New version</span>
  <a class="oc-version-banner-action" href="">Reload</a>
</div>
