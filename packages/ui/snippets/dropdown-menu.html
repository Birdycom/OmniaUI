<!-- OmniaUI component: dropdown-menu - Dropdown extras: sub-menus, checkbox and radio items, shortcuts, destructive/disabled items. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-dropdown-sub > button.oc-dropdown-item + .oc-dropdown-submenu: nested menu (opens on hover and focus-within, chevron added)
       .oc-dropdown-item[role="menuitemcheckbox"|"menuitemradio"][aria-checked]: check mark / dot indicator
       .oc-dropdown-shortcut: right aligned key hint
       .oc-dropdown-item--destructive | --inset | [aria-disabled=true]
-->
<button class="oc-btn oc-btn--outline" type="button" popovertarget="oc-dd-extras">Open menu</button>
<div class="oc-dropdown-menu" id="oc-dd-extras" popover role="menu">
  <div class="oc-dropdown-label">Appearance</div>
  <button class="oc-dropdown-item" type="button" role="menuitemcheckbox" aria-checked="true">Status bar <span class="oc-dropdown-shortcut">Ctrl B</span></button>
  <button class="oc-dropdown-item" type="button" role="menuitemcheckbox" aria-checked="false">Activity bar</button>
  <div class="oc-dropdown-separator" role="separator"></div>
  <div class="oc-dropdown-label">Panel position</div>
  <button class="oc-dropdown-item" type="button" role="menuitemradio" aria-checked="false">Top</button>
  <button class="oc-dropdown-item" type="button" role="menuitemradio" aria-checked="true">Bottom</button>
  <div class="oc-dropdown-separator" role="separator"></div>
  <div class="oc-dropdown-sub">
    <button class="oc-dropdown-item" type="button" role="menuitem" aria-haspopup="menu">More tools</button>
    <div class="oc-dropdown-submenu" role="menu">
      <button class="oc-dropdown-item" type="button" role="menuitem">Save page as&hellip;</button>
      <button class="oc-dropdown-item" type="button" role="menuitem">Developer tools</button>
    </div>
  </div>
  <button class="oc-dropdown-item" type="button" role="menuitem" aria-disabled="true">Disabled item</button>
  <button class="oc-dropdown-item oc-dropdown-item--destructive" type="button" role="menuitem">Delete</button>
</div>
