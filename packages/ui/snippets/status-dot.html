<!-- OmniaUI component: status-dot - A small live state light for a job, agent, sync or server, with the state in text next to it. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/status-dot.html | Map: p.oc-status -> span.oc-status-dot--{tone} + span.oc-status__text (+ span.oc-status__meta)
     Class API (modifiers are extra classes on the same element):
       .oc-status-dot: 8 px dot with a soft ring in the tone color
       Tones: --working (primary, pulses), --waiting (warning), --done (success), --error (destructive), --idle (muted); none = muted
       Sizes: --sm, --lg
       .oc-status: dot + one line of text that cuts off with …; .oc-status__text, .oc-status__meta (right, tabular numbers)
       Token: --oc-status-dot-color (any color)
     The dot is decoration (aria-hidden): the text says the state. A dot without text needs role="img" and an aria-label.
-->
<p class="oc-status"><span class="oc-status-dot oc-status-dot--working" aria-hidden="true"></span><span class="oc-status__text">Working · Reading src/styles/theme.css</span><span class="oc-status__meta">2:14</span></p>
<p class="oc-status"><span class="oc-status-dot oc-status-dot--waiting" aria-hidden="true"></span><span class="oc-status__text">Waiting for your answer</span></p>
<p class="oc-status"><span class="oc-status-dot oc-status-dot--done" aria-hidden="true"></span><span class="oc-status__text">Done · 3 files changed</span><span class="oc-status__meta">12 min</span></p>
<p class="oc-status"><span class="oc-status-dot oc-status-dot--error" aria-hidden="true"></span><span class="oc-status__text">Stopped: the build failed</span></p>
<p class="oc-status"><span class="oc-status-dot oc-status-dot--idle" aria-hidden="true"></span><span class="oc-status__text">Idle</span></p>
