<!-- OmniaUI component: stock - Stock status with a colored dot: in stock, low, out of stock or on order. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/stock.html | Map: stock.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-stock: A dot and the text. Without data-level the dot is green (in stock).
       data-level="low" / "out" / "order": Orange (only a few left), red (out of stock), blue (on order).
       .oc-stock__count / __note: A bold number ("12") and a quiet extra ("delivered in 2–3 days").
       .oc-stock--badge: A tinted pill for tables and product cards.
-->
<div class="flex flex-column gap-1">
  <span class="oc-stock"><span><span class="oc-stock__count">24</span> in stock</span> <span class="oc-stock__note">· delivered in 1–2 days</span></span>
  <span class="oc-stock" data-level="low">Only <span class="oc-stock__count">3</span> left</span>
  <span class="oc-stock" data-level="out">Out of stock</span>
  <span class="oc-stock" data-level="order">On order <span class="oc-stock__note">· expected 14 November</span></span>
  <div class="flex flex-wrap gap-0.5">
    <span class="oc-stock oc-stock--badge">In stock</span>
    <span class="oc-stock oc-stock--badge" data-level="low">Low</span>
    <span class="oc-stock oc-stock--badge" data-level="out">Out</span>
    <span class="oc-stock oc-stock--badge" data-level="order">On order</span>
  </div>
</div>
