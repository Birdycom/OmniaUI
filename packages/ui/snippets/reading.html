<!-- OmniaUI component: reading - A small measured value next to another value, such as a temperature, with a cool, warm or hot level. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/reading.html | Map: three levels -> in a meter row.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-reading: The pill: small, bold, tabular numbers, muted by default.
       .oc-reading--cool / --warm / --hot: Muted, warning or destructive color.
       --oc-reading-color: Any other color token.
       .oc-meter-row__value .oc-reading: Inside the value of a meter row it gets a little room on its left.
-->
<div style="display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center">
  <span class="oc-reading">41 °C</span>
  <span class="oc-reading oc-reading--warm">72 °C</span>
  <span class="oc-reading oc-reading--hot">88 °C</span>
</div>
<div class="oc-meter-list" style="inline-size:min(100%,26rem)">
  <div class="oc-meter-row" style="--oc-meter: 38%">
    <span class="oc-meter-row__label">CPU</span>
    <span class="oc-meter-row__value"><strong>38%</strong><span class="oc-reading">57 °C</span></span>
    <span class="oc-meter-row__bar" role="meter" aria-label="CPU" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38"></span>
  </div>
  <div class="oc-meter-row" data-level="warn" style="--oc-meter: 84%">
    <span class="oc-meter-row__label">GPU</span>
    <span class="oc-meter-row__value"><strong>84%</strong><span class="oc-reading oc-reading--hot">86 °C</span></span>
    <span class="oc-meter-row__bar" role="meter" aria-label="GPU" aria-valuemin="0" aria-valuemax="100" aria-valuenow="84"></span>
  </div>
</div>
