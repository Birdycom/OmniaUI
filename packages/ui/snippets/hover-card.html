<!-- OmniaUI component: hover-card - Hover card: preview on hover/focus via interestfor + popover, CSS hover fallback. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-hover-card: inline wrapper (anchor scope)
       .oc-hover-card-trigger: the link/button (add interestfor="id" for the popover engine)
       .oc-hover-card-content: the card (id, popover, role="tooltip" or region). Sizes: --sm. Wrapper modifier: .oc-hover-card--top
-->
<span class="oc-hover-card">
  <a class="oc-hover-card-trigger" href="#omniacss" interestfor="oc-hc-demo">@omniacss</a>
  <div class="oc-hover-card-content" id="oc-hc-demo" popover>
    <div class="oc-item oc-item--sm" style="padding:0">
      <div class="oc-item-media oc-item-media--icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
      <div class="oc-item-content">
        <p class="oc-item-title">OmniaCSS</p>
        <p class="oc-item-description">CSS-first components and utilities. Light, dark and no build step.</p>
      </div>
    </div>
  </div>
</span>
