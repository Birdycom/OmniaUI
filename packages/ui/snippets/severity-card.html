<!-- OmniaUI component: severity-card - Risk-colored expandable card (low, medium, high, critical) on details / summary - no JavaScript. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/severity-card.html | Map: high card (open: head, body, actions) -> low resolved card
     Class API (modifiers are extra classes / attributes on the same element):
       details.oc-severity-card: Card. Levels: --low, --medium, --high, --critical. State: .is-resolved (neutral, title struck). Same name="..." = one open at a time.
       summary.oc-severity-card-head: Head row with chevron
       .oc-severity-card-icon / -main / -title: Icon, text column, title in the level color
       .oc-severity-card-tags / -tag: Small monospace tags under the title
       .oc-severity-card-level: Level badge at the end of the head
       .oc-severity-card-body / -actions: Details text and action buttons
     Slots: icon, title, tags, level, body, actions
-->
<details class="oc-severity-card oc-severity-card--high" name="oc-findings" open>
  <summary class="oc-severity-card-head">
    <span class="oc-severity-card-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></span>
    <span class="oc-severity-card-main">
      <span class="oc-severity-card-title">shop-example.com data breach</span>
      <span class="oc-severity-card-tags"><span class="oc-severity-card-tag">email</span><span class="oc-severity-card-tag">password</span><span class="oc-severity-card-tag">phone</span></span>
    </span>
    <span class="oc-severity-card-level">High</span>
  </summary>
  <div class="oc-severity-card-body">
    <p>Your e-mail address and a hashed password appeared in a leak from March 2026. Change the password on this site and everywhere you reused it.</p>
    <div class="oc-severity-card-actions">
      <a class="oc-btn oc-btn--sm" href="#">Change password</a>
      <button class="oc-btn oc-btn--outline oc-btn--sm" type="button">Mark as resolved</button>
    </div>
  </div>
</details>
<details class="oc-severity-card oc-severity-card--low is-resolved" name="oc-findings">
  <summary class="oc-severity-card-head">
    <span class="oc-severity-card-main"><span class="oc-severity-card-title">Old forum profile</span></span>
    <span class="oc-severity-card-level">Resolved</span>
  </summary>
  <div class="oc-severity-card-body"><p>The profile was removed on 2 October 2026.</p></div>
</details>
