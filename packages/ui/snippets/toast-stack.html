<!-- OmniaUI component: toast-stack - Toast stack: overlapping toasts that expand on hover or focus. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-toast-container.oc-toast-container--stack: stacking container (add --static for in-flow, --top to dock to the top)
       Newest .oc-toast LAST; the last four layers are visible (scale, offset and opacity by depth)
-->
<div class="oc-toast-container oc-toast-container--static oc-toast-container--stack" tabindex="0" aria-label="Notifications">
  <div class="oc-toast oc-toast--info" role="status"><span class="oc-toast-icon" aria-hidden="true">i</span><div class="oc-toast-body"><p class="oc-toast-title">Update available</p><p class="oc-toast-description">Version 0.9 is ready.</p></div></div>
  <div class="oc-toast oc-toast--warning" role="status"><span class="oc-toast-icon" aria-hidden="true">!</span><div class="oc-toast-body"><p class="oc-toast-title">Storage almost full</p><p class="oc-toast-description">92% of 5 GB used.</p></div></div>
  <div class="oc-toast oc-toast--success" role="status"><span class="oc-toast-icon" aria-hidden="true">&#10003;</span><div class="oc-toast-body"><p class="oc-toast-title">Invoice sent</p><p class="oc-toast-description">Hover to expand the stack.</p></div><button class="oc-toast-close" type="button" aria-label="Dismiss">&times;</button></div>
</div>
