<!-- OmniaUI component: toggle-field - Settings row with a title, a description and a switch. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/toggle-field.html | Map: row label -> text (label + description) -> switch (span.oc-switch + checkbox)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-toggle-field: Row; it is the <label>, so the whole row flips the switch. Modifiers: --card (bordered box), --reverse (switch first).
       .oc-toggle-field-text: Text block
       .oc-toggle-field-label: Title
       .oc-toggle-field-description: Muted help text (link it with aria-describedby)
       .oc-switch: Use a <span class="oc-switch"> here (a label inside a label is invalid HTML)
     States: checked (card border turns primary), disabled (row dimmed), :focus-visible (card outline)
-->
<label class="oc-toggle-field">
  <span class="oc-toggle-field-text">
    <span class="oc-toggle-field-label">Email notifications</span>
    <span class="oc-toggle-field-description" id="oc-toggle-field-demo-desc">Get a message when a receipt is processed.</span>
  </span>
  <span class="oc-switch">
    <input type="checkbox" role="switch" name="notify_email" checked aria-describedby="oc-toggle-field-demo-desc">
    <span class="oc-switch-track"></span>
  </span>
</label>
