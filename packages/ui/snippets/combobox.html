<!-- OmniaUI component: combobox - Combobox: input + listbox styling (filtering and selection are wrapper responsibility). Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-combobox: wrapper (list opens on :focus-within or [data-open])
       input.oc-input.oc-combobox-input: role="combobox" aria-expanded aria-controls aria-autocomplete="list"
       ul.oc-combobox-list: role="listbox"
       li.oc-combobox-option: role="option" tabindex="-1"; aria-selected="true" shows a check; [data-active] marks the keyboard-active option
       .oc-combobox-group / .oc-combobox-empty: group heading and empty message
-->
<div class="oc-combobox">
  <input class="oc-input oc-combobox-input" type="text" role="combobox" aria-expanded="false" aria-controls="oc-cb-list" aria-autocomplete="list" placeholder="Select framework&hellip;" aria-label="Framework">
  <ul class="oc-combobox-list" id="oc-cb-list" role="listbox" aria-label="Frameworks">
    <li class="oc-combobox-option" role="option" tabindex="-1">Astro</li>
    <li class="oc-combobox-option" role="option" tabindex="-1" aria-selected="true">Laravel</li>
    <li class="oc-combobox-option" role="option" tabindex="-1">Nuxt</li>
    <li class="oc-combobox-option" role="option" tabindex="-1">React</li>
    <li class="oc-combobox-option" role="option" tabindex="-1" aria-disabled="true">Svelte (soon)</li>
    <li class="oc-combobox-option" role="option" tabindex="-1">Vue</li>
  </ul>
</div>
