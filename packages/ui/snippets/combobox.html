<!-- OmniaUI component: combobox - Combobox: input + listbox styling (filtering and selection are wrapper responsibility). Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-combobox: wrapper (list opens on :focus-within or [data-open])
       input.oc-input.oc-combobox-input: role="combobox" aria-expanded aria-controls aria-autocomplete="list"
       ul.oc-combobox-list: role="listbox"
       li.oc-combobox-option: role="option" tabindex="-1"; aria-selected="true" shows a check; [data-active] marks the keyboard-active option
       .oc-combobox-group / .oc-combobox-empty: group heading and empty message
       Icons (0.16.0): span.oc-combobox-option-icon first in an option (svg, iconify-icon or img); span.oc-combobox-icon first in
         the wrapper shows the icon of the chosen value in the field. Options without an icon line up with the others.
     Behaviour: data-oc-combobox + oc-combobox.js (npx omniaui copy-js combobox) filters while typing, moves with the arrow keys,
       chooses with Enter or a click, closes with Escape, copies the icon into the field; event oc-combobox-change { value, label }.
       data-oc-portal: a floating list; 0.18.0 a manual popover in the top layer (works inside a modal dialog, sheet or drawer).
-->
<div class="oc-combobox">
  <input class="oc-input oc-combobox-input" type="text" role="combobox" aria-expanded="false" aria-controls="oc-cb-list" aria-autocomplete="list" placeholder="Select framework&hellip;" aria-label="Framework">
  <ul class="oc-combobox-list" id="oc-cb-list" role="listbox" aria-label="Frameworks">
    <li class="oc-combobox-option" role="option" tabindex="-1">Astro</li>
    <li class="oc-combobox-option" role="option" tabindex="-1" aria-selected="true">Laravel</li>
    <li class="oc-combobox-option" role="option" tabindex="-1">Nuxt</li>
    <li class="oc-combobox-option" role="option" tabindex="-1">React</li>
    <li class="oc-combobox-option" role="option" tabindex="-1" aria-disabled="true">Svelte (soon)</li>
    <li class="oc-combobox-option" role="option" tabindex="-1">Vue</li>
  </ul>
</div>

<!-- With icons in front of the options and of the chosen value (needs oc-combobox.js for typing and the keyboard) -->
<div class="oc-combobox" data-oc-combobox>
  <span class="oc-combobox-icon" aria-hidden="true"><iconify-icon icon="mdi:source-branch" aria-hidden="true"></iconify-icon></span>
  <input class="oc-input oc-combobox-input" type="text" role="combobox" aria-expanded="false" aria-controls="oc-cb-icons" aria-autocomplete="list" placeholder="Choose a source&hellip;" aria-label="Source">
  <input type="hidden" name="source" value="">
  <ul class="oc-combobox-list" id="oc-cb-icons" role="listbox" aria-label="Sources">
    <li class="oc-combobox-option" role="option" tabindex="-1" data-value="github"><span class="oc-combobox-option-icon" aria-hidden="true"><iconify-icon icon="mdi:github" aria-hidden="true"></iconify-icon></span>GitHub</li>
    <li class="oc-combobox-option" role="option" tabindex="-1" data-value="gitlab"><span class="oc-combobox-option-icon" aria-hidden="true"><iconify-icon icon="mdi:gitlab" aria-hidden="true"></iconify-icon></span>GitLab</li>
    <li class="oc-combobox-option" role="option" tabindex="-1" data-value="folder"><span class="oc-combobox-option-icon" aria-hidden="true"><iconify-icon icon="mdi:folder-outline" aria-hidden="true"></iconify-icon></span>Local folder</li>
    <li class="oc-combobox-option" role="option" tabindex="-1" data-value="other">Other</li>
    <li class="oc-combobox-empty" role="presentation" hidden>No results</li>
  </ul>
</div>
<script type="module" src="/js/oc-combobox.js"></script>
