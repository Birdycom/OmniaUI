<!-- OmniaUI component: callout - A small card with a text on the left and one action on the right; the action moves under the text when the card is narrow. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/callout.html | Map: text and a button.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-callout: The card: flex row, wraps, card colors and the padding of a small card (11px 13px).
       .oc-callout__text: The text; a <strong> is the title on its own line, the rest is muted.
       .oc-callout__action: One or more buttons; never shrinks. Under the text below about 300px.
-->
<div style="display:grid;gap:1rem;inline-size:100%">
  <div class="oc-callout" style="max-inline-size:26rem">
    <div class="oc-callout__text"><strong>Like the app?</strong><span>A small gift keeps it free for everyone.</span></div>
    <div class="oc-callout__action"><button type="button" class="oc-btn oc-btn--sm">Support</button></div>
  </div>
  <div class="oc-callout" style="max-inline-size:17rem">
    <div class="oc-callout__text"><strong>Update 2.4 is ready</strong><span>Restart to install it.</span></div>
    <div class="oc-callout__action"><button type="button" class="oc-btn oc-btn--sm oc-btn--outline">Later</button><button type="button" class="oc-btn oc-btn--sm">Restart</button></div>
  </div>
</div>
