<!-- OmniaUI component: progress — Progress bar. Needs @birdycom/omniaui CSS. .oc-progress--live: no width transition (a value every few seconds).
     0.18.0: .oc-progress--striped (flat stripes on the part still to do); .oc-progress--split with .oc-progress-segment(--success|--warning|--danger|--info|--muted)
     children (inline-size in %, role="img"), .oc-progress-legend under it. -->
<div class="oc-progress" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
  <div class="oc-progress-bar" style="width: 60%"></div>
</div>
<div class="oc-progress oc-progress--striped" role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="8" aria-label="Stops 3 of 8">
  <span class="oc-progress-bar" style="width: 37.5%"></span>
</div>
<div class="oc-progress oc-progress--split" role="img" aria-label="Right 12, Wrong 4, Open 4">
  <span class="oc-progress-segment oc-progress-segment--success" style="inline-size: 60%" title="Right: 12"></span>
  <span class="oc-progress-segment oc-progress-segment--danger" style="inline-size: 20%" title="Wrong: 4"></span>
  <span class="oc-progress-segment oc-progress-segment--muted" style="inline-size: 20%" title="Open: 4"></span>
</div>
<ul class="oc-progress-legend">
  <li class="oc-progress-segment--success">Right 12</li>
  <li class="oc-progress-segment--danger">Wrong 4</li>
  <li class="oc-progress-segment--muted">Open 4</li>
</ul>
