<!-- OmniaUI component: top-progress - Thin page-top loading bar on a native progress element (indeterminate or with a value). Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/top-progress.html | Map: indeterminate bar -> determinate bar (value) -> static bar in a card
     Class API (modifiers are extra classes / attributes on the same element):
       progress.oc-top-progress: Fixed to the top of the window. Without value = indeterminate (sliding segment); value + max = determinate.
       Modifiers: --success, --warning, --danger, --brand (colors), --lg (4px), --static (in the normal flow, e.g. inside a card).
       States: .is-done (fades out), hidden (removed)
       Custom properties: --oc-top-progress-color, --oc-top-progress-height
     Slots: none (use aria-label for the screen reader name)
-->
<progress class="oc-top-progress" aria-label="Loading page"></progress>

<progress class="oc-top-progress oc-top-progress--static" value="40" max="100" aria-label="Uploading, 40 percent"></progress>
