<!-- OmniaUI component: neon - A border that glows from one accent color to the other, and a button with a neon gradient. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/neon.html | Map: glowing form -> other colors.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-glow-border: Border and glow move from --oc-accent-from to --oc-accent-to and back (3s); works on any element with a border, glass included.
       --oc-glow-border-duration: Length of one round (3s).
       .oc-btn--neon: Gradient from one accent to the other with a glow, bold with a little letter spacing; muted when disabled.
       --oc-btn-neon-ink: Text color on the gradient (white in light mode, near black in dark mode).
-->
<form class="oc-card oc-glow-border" style="display:grid;gap:0.75rem;padding:1.25rem;inline-size:min(100%,24rem)" onsubmit="return false">
  <label class="oc-field"><span class="oc-field-label">Email address</span><input class="oc-input" type="email" placeholder="info@company1.example"></label>
  <button type="submit" class="oc-btn oc-btn--neon">START SCAN</button>
</form>
<div style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center">
  <button type="button" class="oc-btn oc-btn--neon oc-accent--green">Green</button>
  <button type="button" class="oc-btn oc-btn--neon oc-accent--orange">Orange</button>
  <button type="button" class="oc-btn oc-btn--neon" disabled>Disabled</button>
  <div class="oc-card oc-glow-border oc-accent--violet" style="padding:1rem 1.25rem">Violet border</div>
</div>
