<!-- OmniaUI component: group - One section inside a panel or widget, with a title, a colored status on the right and a muted line, and a hairline between groups. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/group.html | Map: groups in a panel.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-group: One section: padding 14px 0 6px; a hairline above every group that follows another.
       .oc-group__head: Title and status on one line.
       .oc-group__title: The title (an h2 or h3); cut with an ellipsis when it is too long.
       .oc-group__aside[data-tone]: Status on the right; data-tone="busy|ok|warn|error" colors it.
       .oc-group__meta: Muted line under the title.
       --oc-group-line: Color of the hairline (glass hairline or border by default).
-->
<div class="oc-card" style="padding:0 1rem 0.5rem;inline-size:min(100%,26rem)">
  <section class="oc-group">
    <header class="oc-group__head"><h2 class="oc-group__title">Service 1</h2><span class="oc-group__aside" data-tone="busy">2 busy</span></header>
    <p class="oc-group__meta">Plan Team · resets Monday</p>
    <div class="oc-meter-list oc-meter-list--dense">
    <div class="oc-meter-row" style="--oc-meter: 46%"><span class="oc-meter-row__label">Session</span><span class="oc-meter-row__value"><strong>46%</strong> · 23k / 50k</span><span class="oc-meter-row__bar" role="meter" aria-label="Session" aria-valuemin="0" aria-valuemax="100" aria-valuenow="46"></span></div>
    <div class="oc-meter-row" data-level="warn" style="--oc-meter: 78%"><span class="oc-meter-row__label">Week</span><span class="oc-meter-row__value"><strong>78%</strong> · 1.6M / 2M</span><span class="oc-meter-row__bar" role="meter" aria-label="Week" aria-valuemin="0" aria-valuemax="100" aria-valuenow="78"></span></div>
    </div>
  </section>
  <section class="oc-group">
    <header class="oc-group__head"><h2 class="oc-group__title">Service 2</h2><span class="oc-group__aside">idle</span></header>
    <p class="oc-group__meta">Plan Free</p>
    <div class="oc-meter-list oc-meter-list--dense">
    <div class="oc-meter-row" style="--oc-meter: 12%"><span class="oc-meter-row__label">Day</span><span class="oc-meter-row__value"><strong>12%</strong> · 6 / 50 requests</span><span class="oc-meter-row__bar" role="meter" aria-label="Day" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12"></span></div>
    </div>
  </section>
  <section class="oc-group">
    <header class="oc-group__head"><h2 class="oc-group__title">Service 3</h2><span class="oc-group__aside" data-tone="error">limit reached</span></header>
    <p class="oc-group__meta">Plan Free · resets in 3 h</p>
    <div class="oc-meter-list oc-meter-list--dense">
    <div class="oc-meter-row" data-level="critical" style="--oc-meter: 100%"><span class="oc-meter-row__label">Day</span><span class="oc-meter-row__value"><strong>100%</strong> · 50 / 50 requests</span><span class="oc-meter-row__bar" role="meter" aria-label="Day" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></span></div>
    </div>
  </section>
</div>
