<!-- OmniaUI component: link-row - A row of links under a feature card, with an external icon and the GitHub mark by themselves. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/link-row.html | Map: ul.oc-link-row -> li > a (own site: no icon; other site: arrow; github.com: mark)
     Class API (modifiers are extra classes on the same element):
       .oc-link-row: wrapping row of links, primary color
       Icons: by the href (http(s) links: arrow; github.com: GitHub mark; relative links: none)
       Modifiers: --accent (element accent, with .oc-accent--*), --muted, --sm, --lg
     Slots: the list items
-->
