<!-- OmniaUI component: language-select - Compact language or currency switcher for a site header. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/language-select.html | Map: language pill (globe icon + select) -> currency pill (symbol + select)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-language-select: Pill frame around icon and select. Modifiers: --ghost (no frame), --currency (symbol in primary color).
       .oc-language-select-icon: Leading icon (inline SVG) or symbol; aria-hidden="true"
       .oc-language-select-control: The native <select> (give it an aria-label)
     States: :focus-within (ring), disabled select (dimmed)
     Behaviour: the app listens to "change" (navigate to /nl/..., set a cookie, or submit the form).
-->
<label class="oc-language-select">
  <span class="oc-language-select-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
  <select class="oc-language-select-control" name="locale" aria-label="Language">
    <option value="en" selected>English</option>
    <option value="nl">Nederlands</option>
    <option value="fr">Fran&ccedil;ais</option>
    <option value="de">Deutsch</option>
  </select>
</label>
<label class="oc-language-select oc-language-select--currency">
  <span class="oc-language-select-icon" aria-hidden="true">&euro;</span>
  <select class="oc-language-select-control" name="currency" aria-label="Currency">
    <option value="EUR" selected>EUR</option>
    <option value="USD">USD</option>
    <option value="GBP">GBP</option>
  </select>
</label>
