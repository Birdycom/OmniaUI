<!-- OmniaUI component: language-select - Compact language or currency switcher for a site header. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/language-select.html | Map: language pill (globe icon + select) -> currency pill (symbol + select)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-language-select: Pill frame around icon and select. Modifiers: --ghost (no frame), --currency (symbol in primary color).
       .oc-language-select-icon: Leading icon (inline SVG) or symbol; aria-hidden="true"
       .oc-language-select-control: The native <select> (give it an aria-label)
       Menu (0.16.0): button.oc-language-select[popovertarget] + .oc-dropdown-menu.oc-language-menu[popover]: one link per
         language (hreflang + lang) with .oc-language-flag (flag webicon), the name in that language, .oc-language-menu-code,
         and a check at aria-current="true". Trigger: .oc-language-flag + .oc-language-select-code ("NL") or the name;
         --icon = round icon-only trigger (globe or flag) with the name in aria-label and a tooltip (oc-tooltip). No script.
     States: :focus-within (ring), disabled select (dimmed)
     Behaviour: the app listens to "change" (navigate to /nl/..., set a cookie, or submit the form).
-->
<label class="oc-language-select">
  <span class="oc-language-select-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
  <select class="oc-language-select-control" name="locale" aria-label="Language">
    <option value="en" selected>English</option>
    <option value="nl">Nederlands</option>
    <option value="fr">Fran&ccedil;ais</option>
    <option value="de">Deutsch</option>
  </select>
</label>
<label class="oc-language-select oc-language-select--currency">
  <span class="oc-language-select-icon" aria-hidden="true">&euro;</span>
  <select class="oc-language-select-control" name="currency" aria-label="Currency">
    <option value="EUR" selected>EUR</option>
    <option value="USD">USD</option>
    <option value="GBP">GBP</option>
  </select>
</label>
<div style="display:flex;justify-content:space-between;align-items:center;inline-size:min(100%,20rem);padding:0.25rem 0.25rem 0.25rem 0.75rem;border:1px solid var(--oc-border);border-radius:var(--oc-radius)">
  <strong>App 1</strong>
  <label class="oc-language-select oc-language-select--ghost oc-language-select--code" data-code="NL">
    <select class="oc-language-select-control" aria-label="Language">
      <option value="en">English</option>
      <option value="nl" selected>Nederlands</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
    </select>
  </label>
</div>

<!-- Menu with flags: the trigger shows the flag and the code, the list the flag, the name in that language and a check -->
<button type="button" class="oc-language-select" popovertarget="oc-language-flags" aria-label="Language: Nederlands">
  <span class="oc-language-flag" aria-hidden="true"><iconify-icon icon="flag:nl-4x3" aria-hidden="true"></iconify-icon></span>
  <span class="oc-language-select-code">NL</span>
</button>
<div class="oc-dropdown-menu oc-language-menu" id="oc-language-flags" popover aria-label="Language">
  <a class="oc-dropdown-item" href="/en/" hreflang="en" lang="en"><span class="oc-language-flag" aria-hidden="true"><iconify-icon icon="flag:gb-4x3" aria-hidden="true"></iconify-icon></span><span>English</span><span class="oc-language-menu-code" aria-hidden="true">EN</span></a>
  <a class="oc-dropdown-item" href="/nl/" hreflang="nl" lang="nl" aria-current="true"><span class="oc-language-flag" aria-hidden="true"><iconify-icon icon="flag:nl-4x3" aria-hidden="true"></iconify-icon></span><span>Nederlands</span><span class="oc-language-menu-code" aria-hidden="true">NL</span></a>
  <a class="oc-dropdown-item" href="/fr/" hreflang="fr" lang="fr"><span class="oc-language-flag" aria-hidden="true"><iconify-icon icon="flag:fr-4x3" aria-hidden="true"></iconify-icon></span><span>Fran&ccedil;ais</span><span class="oc-language-menu-code" aria-hidden="true">FR</span></a>
</div>
