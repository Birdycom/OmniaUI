<!-- OmniaUI component: slider - Slider: native range input with themed track, fill and thumb. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       input.oc-slider[type=range]: the slider. Modifier: --vertical
       --oc-slider-progress: fill length for Chromium/WebKit (Firefox fills natively). Update with a one-line oninput
       --oc-slider-track / --oc-slider-thumb: sizes
-->
<div class="oc-field" style="max-inline-size:20rem">
  <label class="oc-field-label" for="oc-slider-volume">Volume</label>
  <input class="oc-slider" id="oc-slider-volume" type="range" min="0" max="100" value="40" style="--oc-slider-progress: 40%"
         oninput="this.style.setProperty('--oc-slider-progress', (this.value - this.min) / (this.max - this.min) * 100 + '%')">
</div>

<div style="display:flex;align-items:center;gap:2rem;flex-wrap:wrap">
  <input class="oc-slider" type="range" min="0" max="10" step="1" value="3" aria-label="Rating" style="--oc-slider-progress: 30%;max-inline-size:12rem" oninput="this.style.setProperty('--oc-slider-progress', (this.value - this.min) / (this.max - this.min) * 100 + '%')">
  <input class="oc-slider" type="range" value="60" disabled aria-label="Disabled" style="--oc-slider-progress: 60%;max-inline-size:10rem">
  <input class="oc-slider oc-slider--vertical" type="range" value="70" aria-label="Level" style="--oc-slider-progress: 70%">
</div>
