<!-- OmniaUI component: decimal-input - Text field for locale decimals like 1.234,56, with an optional unit. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/decimal-input.html | Map: plain field -> field with unit (wrapper + unit)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-decimal-input: Add to .oc-input. Right-aligned tabular digits. Modifier: --start (left-aligned).
       .oc-decimal-field: Optional frame around the input and a unit
       .oc-decimal-field-unit: Unit text after the value (m², kg, h)
     States: :user-invalid when the pattern does not match (red), aria-invalid="true", disabled
     Pattern below accepts 1234,5 / 1.234,56 (comma decimals). For dot decimals use [0-9,]*(\.[0-9]+)?
-->
<div class="oc-field">
  <label class="oc-field-label" for="oc-decimal-demo">Amount</label>
  <input class="oc-input oc-decimal-input" id="oc-decimal-demo" name="amount" type="text" inputmode="decimal" value="1.234,56" pattern="[0-9.]*(,[0-9]{1,2})?">
</div>
<div class="oc-field">
  <label class="oc-field-label" for="oc-decimal-unit-demo">Surface</label>
  <div class="oc-decimal-field">
    <input class="oc-input oc-decimal-input" id="oc-decimal-unit-demo" name="surface" type="text" inputmode="decimal" value="42,5" pattern="[0-9.]*(,[0-9]{1,2})?">
    <span class="oc-decimal-field-unit">m&sup2;</span>
  </div>
</div>
