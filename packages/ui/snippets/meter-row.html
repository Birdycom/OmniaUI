<!-- OmniaUI component: meter-row - Usage line with a label, the amount as text, a colored bar and when it resets. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/meter-row.html | Map: meter row demo markup.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-meter-row: Grid: label and value on the first line, the bar and the reset line below.
       --oc-meter: The fill, 0–100% (inline style or your code).
       data-level="warn" / "critical": Orange / red bar (and a red value at critical). Without it the bar is green.
       .oc-meter-row__bar[role=meter]: The bar; give it aria-valuenow and a label for screen readers.
       .oc-meter-list (--compact): A stack of rows; --compact for a small widget.
       .oc-meter-list--dense: Tighter rows with a 5px bar and a 0.8rem label, for a tray window (no width transition).
       .oc-meter-list--live: No width transition, for values that change every few seconds.
       .oc-meter-row__sub: Muted second line under the bar; .oc-meter-row__subbar: its thin bar (--oc-meter, data-level).
       .oc-meter-row__fill: Optional fill element inside a bar or sub-bar; patch its inline inline-size in place.
-->
<div class="oc-meter-list" style="inline-size:min(100%,28rem)">
  <div class="oc-meter-row" style="--oc-meter: 62%">
    <span class="oc-meter-row__label">Session (5 hours)</span>
    <span class="oc-meter-row__value"><strong>62%</strong> · 31k / 50k tokens</span>
    <span class="oc-meter-row__bar" role="meter" aria-label="Session (5 hours)" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62"></span>
    <span class="oc-meter-row__reset"><iconify-icon icon="mdi:timer-sand" aria-hidden="true"></iconify-icon>Resets in 2 h 14 min</span>
  </div>
  <div class="oc-meter-row" data-level="warn" style="--oc-meter: 81%">
    <span class="oc-meter-row__label">Week</span>
    <span class="oc-meter-row__value"><strong>81%</strong> · 1.6M / 2M tokens</span>
    <span class="oc-meter-row__bar" role="meter" aria-label="Week" aria-valuemin="0" aria-valuemax="100" aria-valuenow="81"></span>
    <span class="oc-meter-row__reset"><iconify-icon icon="mdi:timer-sand" aria-hidden="true"></iconify-icon>Resets Monday 09:00</span>
  </div>
  <div class="oc-meter-row" data-level="critical" style="--oc-meter: 96%">
    <span class="oc-meter-row__label">Storage</span>
    <span class="oc-meter-row__value"><strong>96%</strong> · 9.6 / 10 GB</span>
    <span class="oc-meter-row__bar" role="meter" aria-label="Storage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="96"></span>
    <span class="oc-meter-row__reset"><iconify-icon icon="mdi:timer-sand" aria-hidden="true"></iconify-icon>Upgrade or clean up to keep syncing</span>
  </div>
</div>
<div class="oc-meter-list oc-meter-list--dense" style="inline-size:min(100%,24rem)">
  <div class="oc-meter-row" style="--oc-meter: 34%">
    <span class="oc-meter-row__label">CPU</span>
    <span class="oc-meter-row__value"><strong>34%</strong><span class="oc-reading">52 °C</span></span>
    <span class="oc-meter-row__bar" role="meter" aria-label="CPU" aria-valuemin="0" aria-valuemax="100" aria-valuenow="34"></span>
  </div>
  <div class="oc-meter-row" data-level="warn" style="--oc-meter: 81%">
    <span class="oc-meter-row__label">GPU</span>
    <span class="oc-meter-row__value"><strong>81%</strong><span class="oc-reading oc-reading--warm">74 °C</span></span>
    <span class="oc-meter-row__bar" role="meter" aria-label="GPU" aria-valuemin="0" aria-valuemax="100" aria-valuenow="81"></span>
    <span class="oc-meter-row__sub">VRAM 2.7 / 8.0 GB<span class="oc-meter-row__subbar" style="--oc-meter: 34%"></span></span>
  </div>
  <div class="oc-meter-row" style="--oc-meter: 58%">
    <span class="oc-meter-row__label">Memory</span>
    <span class="oc-meter-row__value"><strong>58%</strong> · 18.6 / 32 GB</span>
    <span class="oc-meter-row__bar" role="meter" aria-label="Memory" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58"><span class="oc-meter-row__fill" style="inline-size: 58%"></span></span>
    <span class="oc-meter-row__sub">Swap 1.2 / 4 GB<span class="oc-meter-row__subbar"><span class="oc-meter-row__fill" style="inline-size: 30%"></span></span></span>
  </div>
</div>
