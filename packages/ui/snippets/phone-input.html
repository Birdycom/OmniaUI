<!-- OmniaUI component: phone-input - Phone field with a country dial code select and the national number. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/phone-input.html | Map: field wrapper -> label -> phone frame (dial select + tel input) -> hint
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-phone-input: Frame around both parts. Modifiers: --sm, --error.
       .oc-phone-input-dial: Native select with the dial codes (+32, +31...)
       .oc-phone-input-number: The national number (type="tel", autocomplete="tel-national")
     States: :focus-within (ring), aria-invalid="true" or :user-invalid on the number (red), disabled number (dimmed)
     Slots: one <option> per country; the value of the form is dial code + number (join them on the server)
-->
<div class="oc-field">
  <label class="oc-field-label" for="oc-phone-demo">Mobile number</label>
  <div class="oc-phone-input">
    <select class="oc-phone-input-dial" name="phone_dial" aria-label="Country code">
      <option value="+32" selected>BE +32</option>
      <option value="+31">NL +31</option>
      <option value="+33">FR +33</option>
      <option value="+49">DE +49</option>
    </select>
    <input class="oc-phone-input-number" id="oc-phone-demo" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="470 12 34 56" pattern="[0-9 ]{8,14}">
  </div>
  <p class="oc-field-description">Digits only; spaces are fine.</p>
</div>
