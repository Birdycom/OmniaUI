<!-- OmniaUI component: menu-static - The dropdown menu as a surface of its own, with a check column and hints, for a tray menu or a menu inside a panel. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/menu-static.html | Map: tray menu -> flat, in a glass window.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-dropdown-menu--static: No popover or position: the menu is shown and fills its container.
       .oc-dropdown-menu--flat: No border, radius, shadow or background: the window around it is the frame.
       .oc-dropdown-check: A 20px check column at the start of an item; shows ✓ when the item has aria-checked="true".
       .oc-dropdown-hint: Muted text on the right (a shortcut, a time).
       .oc-dropdown-label: Group title; small capitals in a static menu.
       .oc-dropdown-item--destructive: Red item (Quit, Delete).
-->
<div class="oc-dropdown-menu oc-dropdown-menu--static" role="menu" aria-label="App 1" style="max-inline-size:17rem">
  <div class="oc-dropdown-label">View</div>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="true"><span class="oc-dropdown-check" aria-hidden="true"></span>Always on top<span class="oc-dropdown-hint">Ctrl+T</span></button>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="false"><span class="oc-dropdown-check" aria-hidden="true"></span>Compact mode</button>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="true"><span class="oc-dropdown-check" aria-hidden="true"></span>Start with Windows</button>
  <div class="oc-dropdown-separator"></div>
  <div class="oc-dropdown-label">Refresh</div>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="false"><span class="oc-dropdown-check" aria-hidden="true"></span>Every minute</button>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="true"><span class="oc-dropdown-check" aria-hidden="true"></span>Every 5 minutes<span class="oc-dropdown-hint">now</span></button>
  <div class="oc-dropdown-separator"></div>
  <button type="button" class="oc-dropdown-item oc-dropdown-item--destructive">Quit<span class="oc-dropdown-hint">Ctrl+Q</span></button>
</div>
<div class="oc-glass" style="padding:4px;inline-size:min(100%,17rem)">
<div class="oc-dropdown-menu oc-dropdown-menu--static oc-dropdown-menu--flat" role="menu" aria-label="App 1">
  <div class="oc-dropdown-label">View</div>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="true"><span class="oc-dropdown-check" aria-hidden="true"></span>Always on top<span class="oc-dropdown-hint">Ctrl+T</span></button>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="false"><span class="oc-dropdown-check" aria-hidden="true"></span>Compact mode</button>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="true"><span class="oc-dropdown-check" aria-hidden="true"></span>Start with Windows</button>
  <div class="oc-dropdown-separator"></div>
  <div class="oc-dropdown-label">Refresh</div>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="false"><span class="oc-dropdown-check" aria-hidden="true"></span>Every minute</button>
  <button type="button" class="oc-dropdown-item" role="menuitemcheckbox" aria-checked="true"><span class="oc-dropdown-check" aria-hidden="true"></span>Every 5 minutes<span class="oc-dropdown-hint">now</span></button>
  <div class="oc-dropdown-separator"></div>
  <button type="button" class="oc-dropdown-item oc-dropdown-item--destructive">Quit<span class="oc-dropdown-hint">Ctrl+Q</span></button>
</div>
</div>
