<!-- OmniaUI component: chat-composer — Chat message field with a toolbar and a send button in one frame. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/chat-composer.html | Map: form -> textarea -> bar (tools, hint, send)
     Class API: form.oc-chat-composer > textarea.oc-chat-composer__input (placeholder + required) · .oc-chat-composer__bar >
       .oc-chat-composer__tools > button.oc-chat-composer__tool · .oc-chat-composer__hint · button.oc-chat-composer__send (type=submit).
     Modifiers: .oc-chat-composer--inline (one row). States: :focus-within ring; send is dimmed while the field is empty
       (:placeholder-shown) or :disabled. The textarea grows with its content (field-sizing). No JavaScript needed.
     Tip: put an emoji-picker trigger in the tools (see emoji-picker).
-->
<form class="oc-chat-composer" action="#" style="max-inline-size:32rem">
  <label class="oc-visually-hidden" for="oc-chat-input">Message</label>
  <textarea class="oc-chat-composer__input" id="oc-chat-input" name="message" rows="1" placeholder="Write a message…" required></textarea>
  <div class="oc-chat-composer__bar">
    <div class="oc-chat-composer__tools">
      <button type="button" class="oc-chat-composer__tool" aria-label="Attach a file">&#128206;</button>
      <button type="button" class="oc-chat-composer__tool" aria-label="Mention someone">@</button>
      <button type="button" class="oc-chat-composer__tool" aria-label="Insert emoji">&#128578;</button>
    </div>
    <span class="oc-chat-composer__hint">Enter for a new line</span>
    <button type="submit" class="oc-chat-composer__send" aria-label="Send">&#10148;</button>
  </div>
</form>
