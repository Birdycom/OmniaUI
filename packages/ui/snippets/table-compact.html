<!-- OmniaUI component: table-compact - Table variant: compact striped table without outer cell borders, for inside cards and side panels. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/table-compact.html | Map: card -> header -> compact wrapper -> table (head, striped body, total footer)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-table-compact: Wrapper around a table.oc-table (scrolls sideways when needed). Modifiers: --bordered (own frame), --plain (no stripes, no head background).
       th / td [data-numeric]: Right aligned tabular numbers (table component). [data-wrap]: the cell may wrap.
       tfoot row: Bold total row with a stronger line above it
       .oc-table-compact-muted: Muted secondary text in a cell
     Slots: thead, tbody rows, optional tfoot
-->
<div class="oc-card" style="max-width:28rem">
  <div class="oc-card-header"><h3 class="oc-card-title">Materials</h3></div>
  <div class="oc-table-compact">
    <table class="oc-table">
      <thead><tr><th>Item</th><th data-numeric>Qty</th><th data-numeric>Price</th></tr></thead>
      <tbody>
        <tr><td>Oak worktop <span class="oc-table-compact-muted">(3 m)</span></td><td data-numeric>1</td><td data-numeric>&euro; 640.00</td></tr>
        <tr><td>Cabinet 60 cm</td><td data-numeric>2</td><td data-numeric>&euro; 380.00</td></tr>
        <tr><td>Sink</td><td data-numeric>1</td><td data-numeric>&euro; 210.00</td></tr>
        <tr><td>Tap</td><td data-numeric>1</td><td data-numeric>&euro; 95.00</td></tr>
      </tbody>
      <tfoot><tr><td colspan="2">Total</td><td data-numeric>&euro; 1,325.00</td></tr></tfoot>
    </table>
  </div>
</div>
