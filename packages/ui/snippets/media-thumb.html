<!-- OmniaUI component: media-thumb — 16:9 video thumbnail with duration badge and watch-progress bar. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/media-thumb.html | Map: thumb link -> picture -> badge -> duration -> progress
     Class API: a.oc-media-thumb (or div) > img / video / .oc-media-art · .oc-media-thumb__badge (top left, --live = red) ·
       .oc-media-thumb__duration (bottom right) · progress.oc-media-thumb__progress (value / max = watched part).
     Modifiers: .oc-media-thumb--square / --portrait. States: .is-watched (dimmed picture). No JavaScript.
-->
<a class="oc-media-thumb" href="#" style="inline-size:20rem" aria-label="Morning light in the dunes, 12 minutes 4 seconds">
  <div class="oc-media-art oc-media-art--3"></div>
  <span class="oc-media-thumb__badge">New</span>
  <span class="oc-media-thumb__duration">12:04</span>
  <progress class="oc-media-thumb__progress" value="40" max="100" aria-label="Watched 40%">40%</progress>
</a>
