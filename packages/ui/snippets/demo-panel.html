<!-- OmniaUI component: demo-panel - Live preview + code, stacked or in tabs. Needs @birdycom/omniaui CSS.
     Class API: .oc-demo (--tabs = preview/code tabs) · .oc-preview__title (small heading) · .oc-demo__preview (--tall, --center) ·
       .oc-demo__tablist > label.oc-demo__tab > input[type=radio] (first = preview, second = code) · .oc-demo__code (code panel in the tabs variant)
-->
<div class="oc-demo oc-demo--tabs">
  <div class="oc-demo__tablist" role="radiogroup" aria-label="View">
    <label class="oc-demo__tab"><input type="radio" name="oc-demo-view" checked> Preview</label>
    <label class="oc-demo__tab"><input type="radio" name="oc-demo-view"> Code</label>
  </div>
  <div class="oc-demo__preview">
    <button class="oc-btn">Save</button>
    <button class="oc-btn oc-btn--outline">Cancel</button>
  </div>
  <div class="oc-demo__code">
    <pre class="oc-code-window__body"><code>&lt;button class="oc-btn"&gt;Save&lt;/button&gt;
&lt;button class="oc-btn oc-btn--outline"&gt;Cancel&lt;/button&gt;</code></pre>
  </div>
</div>
