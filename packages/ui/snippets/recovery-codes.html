<!-- OmniaUI component: recovery-codes - Warning panel with a code grid plus copy and download actions. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-recovery-codes: Panel (warning tint)
       .oc-recovery-codes-title / -warning: Heading and explanation
       .oc-recovery-codes-list: Two-column monospace grid (selectable with one click)
       .oc-recovery-codes-actions: Button row
-->
<div class="oc-recovery-codes">
  <h3 class="oc-recovery-codes-title">Recovery codes</h3>
  <p class="oc-recovery-codes-warning">Store these codes somewhere safe. Each code works once.</p>
  <ul class="oc-recovery-codes-list">
    <li>4F8K-92QA</li><li>M3ZP-71LD</li>
    <li>7TQX-0BNE</li><li>C8WV-5YHR</li>
    <li>2JDA-KE63</li><li>R9UG-X4MS</li>
  </ul>
  <div class="oc-recovery-codes-actions">
    <button class="oc-btn oc-btn--outline oc-btn--sm" type="button">Copy all</button>
    <button class="oc-btn oc-btn--outline oc-btn--sm" type="button">Download .txt</button>
  </div>
</div>
