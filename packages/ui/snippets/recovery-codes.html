<!-- OmniaUI component: recovery-codes - Warning panel with a code grid plus copy, download and print actions. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-recovery-codes: Panel (warning tint)
       .oc-recovery-codes-title / -warning: Heading and explanation (the warning can start with an icon: mdi:alert-outline)
       .oc-recovery-codes-list: Two-column monospace grid (selectable with one click)
       .oc-recovery-codes-actions: Button row; data-oc-recovery="copy|download|print" wires a button to the script below
       data-copied-label (0.17.0): feedback on the copy button (.oc-recovery-codes-label) and in .oc-recovery-codes-status
       .oc-recovery-codes-icon-copy / -copied (0.17.0): mdi:content-copy and mdi:check; they swap on .is-copied
       .oc-recovery-codes-status (0.17.0): visually hidden role="status" live region
-->
<div class="oc-recovery-codes">
  <h3 class="oc-recovery-codes-title">Recovery codes</h3>
  <p class="oc-recovery-codes-warning"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 2L1 21h22M12 6l7.53 13H4.47M11 10v4h2v-4m-2 6v2h2v-2"/></svg><span>Store these codes somewhere safe. Each code works once.</span></p>
  <ul class="oc-recovery-codes-list">
    <li>4F8K-92QA</li><li>M3ZP-71LD</li>
    <li>7TQX-0BNE</li><li>C8WV-5YHR</li>
    <li>2JDA-KE63</li><li>R9UG-X4MS</li>
  </ul>
  <div class="oc-recovery-codes-actions">
    <button class="oc-btn oc-btn--outline oc-btn--sm" type="button" data-oc-recovery="copy" data-copied-label="Copied"><svg class="oc-recovery-codes-icon-copy" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M19 21H8V7h11m0-2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m-3-4H4a2 2 0 0 0-2 2v14h2V3h12z"/></svg><svg class="oc-recovery-codes-icon-copied" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M21 7L9 19l-5.5-5.5l1.41-1.41L9 16.17L19.59 5.59z"/></svg><span class="oc-recovery-codes-label">Copy all</span></button>
    <button class="oc-btn oc-btn--outline oc-btn--sm" type="button" data-oc-recovery="download"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M5 20h14v-2H5m14-9h-4V3H9v6H5l7 7z"/></svg><span>Download .txt</span></button>
    <button class="oc-btn oc-btn--outline oc-btn--sm" type="button" data-oc-recovery="print"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M18 3H6v4h12m1 5a1 1 0 0 1-1-1a1 1 0 0 1 1-1a1 1 0 0 1 1 1a1 1 0 0 1-1 1m-3 7H8v-5h8m3-6H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3"/></svg><span>Print</span></button>
  </div>
  <span class="oc-recovery-codes-status oc-visually-hidden" role="status" aria-live="polite"></span>
</div>
<script>
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-oc-recovery]');
    if (!btn) return;
    const panel = btn.closest('.oc-recovery-codes');
    const codes = Array.from(panel.querySelectorAll('.oc-recovery-codes-list li')).map((li) => li.textContent.trim());
    const text = codes.join('\n');
    const action = btn.dataset.ocRecovery;
    if (action === 'copy') {
      try { await navigator.clipboard.writeText(text); } catch { return; }
      // data-copied-label: feedback on the button and in the live region (.oc-recovery-codes-status)
      const label = btn.querySelector('.oc-recovery-codes-label');
      const status = panel.querySelector('.oc-recovery-codes-status');
      const done = btn.dataset.copiedLabel || 'Copied';
      if (label) { label.dataset.label ??= label.textContent; label.textContent = done; }
      if (status) status.textContent = done;
      btn.classList.add('is-copied');
      clearTimeout(btn.ocCopyTimer);
      btn.ocCopyTimer = setTimeout(() => {
        btn.classList.remove('is-copied');
        if (label) label.textContent = label.dataset.label;
        if (status) status.textContent = '';
      }, 2000);
      return;
    }
    if (action === 'print') {
      // only the codes on paper: a hidden iframe with the title and the list
      const esc = (t) => t.replace(/[&<>"']/g, (ch) => `&#${ch.charCodeAt(0)};`);
      const title = esc(panel.querySelector('.oc-recovery-codes-title')?.textContent.trim() || 'Recovery codes');
      const frame = document.createElement('iframe');
      frame.setAttribute('aria-hidden', 'true');
      frame.style.cssText = 'position:fixed;inline-size:0;block-size:0;border:0;inset:auto auto 0 0';
      frame.srcdoc = `<!doctype html><meta charset="utf-8"><title>${title}</title><style>body{font:14px ui-monospace,Consolas,monospace;margin:2cm}h1{font:600 16px system-ui,sans-serif}ul{list-style:none;padding:0;columns:2}</style><h1>${title}</h1><ul>${codes.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>`;
      frame.addEventListener('load', () => { frame.contentWindow.print(); setTimeout(() => frame.remove(), 1000); });
      document.body.append(frame);
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text + '\n'], { type: 'text/plain' }));
    a.download = btn.dataset.filename || 'recovery-codes.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });
</script>
