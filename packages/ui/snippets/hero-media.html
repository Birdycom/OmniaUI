<!-- OmniaUI component: hero-media - Full-width hero with a video or photo behind the text, a dark scrim on the text side and a poster under reduced motion. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes on the same element):
       .oc-hero-media: the section (full width, dark color scheme, at least --oc-hero-media-min high)
       .oc-hero-media__media: the video or img (object-fit: cover, position --oc-hero-media-position)
       .oc-hero-media__content: the text in the page container, each child at most --oc-hero-media-measure wide
       --scrim-start / --scrim-end: dark layer on the text side / other side; --scrim: over the whole picture
       --center / --end: text centered / at the end side
-->
<section class="oc-hero-media oc-hero-media--scrim-start">
  <img class="oc-hero-media__media" src="/img/hero.webp" alt="">
  <div class="oc-hero-media__content">
    <p class="oc-eyebrow">Company 1</p>
    <h2 class="oc-display oc-display--md">Software that moves your business forward</h2>
    <p class="oc-lead">Web applications, desktop tools and support, built around the way your team works.</p>
    <div class="oc-actions">
      <a class="oc-btn" href="#work">See our work</a>
      <a class="oc-btn oc-btn--outline" href="#contact">Get in touch</a>
    </div>
  </div>
</section>
