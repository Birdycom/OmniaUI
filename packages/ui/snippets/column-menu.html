<!-- OmniaUI component: column-menu - Column visibility checklist in a popover; hides table columns with :has() - no JavaScript. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/column-menu.html | Map: scope -> toolbar with trigger -> popover (title, form with checkboxes, reset) -> table
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-column-menu-scope: Wrapper around menu + table. An unchecked [data-col="n"] hides column n (1-10) of the .oc-table inside.
       .oc-column-menu[popover]: Popover panel, opened with button[popovertarget]
       .oc-column-menu-title: Small heading
       form.oc-column-menu-list: The checkbox list (a form, so button type="reset" restores the defaults)
       .oc-column-menu-item: label + input[type=checkbox][data-col]. State: input disabled = locked column.
       .oc-column-menu-footer: Row for Reset / Done buttons
     Slots: title, one item per column, footer buttons
-->
<div class="oc-column-menu-scope">
  <div class="oc-table-toolbar">
    <span class="oc-table-toolbar-spacer"></span>
    <button class="oc-btn oc-btn--outline oc-btn--sm" type="button" popovertarget="oc-column-menu-demo">Columns</button>
  </div>
  <div class="oc-column-menu" id="oc-column-menu-demo" popover>
    <p class="oc-column-menu-title">Visible columns</p>
    <form class="oc-column-menu-list">
      <label class="oc-column-menu-item"><input type="checkbox" data-col="1" checked disabled> Name</label>
      <label class="oc-column-menu-item"><input type="checkbox" data-col="2" checked> E-mail</label>
      <label class="oc-column-menu-item"><input type="checkbox" data-col="3" checked> City</label>
      <label class="oc-column-menu-item"><input type="checkbox" data-col="4"> Phone</label>
      <div class="oc-column-menu-footer">
        <button class="oc-btn oc-btn--ghost oc-btn--sm" type="reset">Reset</button>
      </div>
    </form>
  </div>
  <div class="oc-table-wrap">
    <table class="oc-table">
      <thead><tr><th>Name</th><th>E-mail</th><th>City</th><th>Phone</th></tr></thead>
      <tbody>
        <tr><td>Ada Lovelace</td><td>ada@example.com</td><td>London</td><td>+44 20 7946 0001</td></tr>
        <tr><td>Alan Turing</td><td>alan@example.com</td><td>Manchester</td><td>+44 161 496 0002</td></tr>
      </tbody>
    </table>
  </div>
</div>
