<!-- OmniaUI component: launcher-card - Large clickable card with icon, title and description (module hub, settings sections). Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-launcher: Card (link or button). State: aria-current="true" / .is-active, aria-disabled="true".
       .oc-launcher-icon: Tinted icon tile
       .oc-launcher-title: Title (may contain a badge)
       .oc-launcher-description: Muted description
       .oc-launcher-footer: Optional footer text (e.g. why it is disabled)
     Slots: icon, title (+ trailing badge), description, footer
-->

</a>
