<!-- OmniaUI component: definition-list - Label / value rows in a panel (dl). Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-dl-panel: Panel wrapper (role="region")
       .oc-dl-title / -description: Panel heading and note
       .oc-dl: The dl
       .oc-dl-row: div grouping one term and detail
       .oc-dl-term / .oc-dl-detail: dt / dd
       .oc-dl-footer: Optional footer (actions)
     Slots: title, description, rows (term + detail), footer
-->
<div class="oc-dl-panel" role="region" aria-label="Company data">
  <h3 class="oc-dl-title">Company data found</h3>
  <p class="oc-dl-description">Retrieved from the VAT register.</p>
  <dl class="oc-dl">
    <div class="oc-dl-row"><dt class="oc-dl-term">Name</dt><dd class="oc-dl-detail">Birdy Systems BV</dd></div>
    <div class="oc-dl-row"><dt class="oc-dl-term">Enterprise number</dt><dd class="oc-dl-detail">BE 0123.456.789</dd></div>
    <div class="oc-dl-row"><dt class="oc-dl-term">Address</dt><dd class="oc-dl-detail">Main Street 1, 2000 Antwerp</dd></div>
  </dl>
  <div class="oc-dl-footer"><button class="oc-btn oc-btn--sm" type="button">Use these details</button></div>
</div>
