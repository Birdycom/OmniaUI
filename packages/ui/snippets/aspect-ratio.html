<!-- OmniaUI component: aspect-ratio - Aspect-ratio box with presets and fill behaviour for img/video/iframe. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-aspect: ratio box (default 16 / 9). Presets: --square, --photo (4/3), --portrait (3/4), --wide (21/9). --center centers text
       --oc-aspect: custom ratio, e.g. style="--oc-aspect: 5 / 2"
-->
<div style="max-inline-size:24rem">
  <div class="oc-aspect oc-aspect--center"><span class="oc-item-description">16 / 9</span></div>
</div>

<div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-start">
  <div class="oc-aspect oc-aspect--square oc-aspect--center" style="inline-size:7rem"><span class="oc-item-description">1 / 1</span></div>
  <div class="oc-aspect oc-aspect--photo oc-aspect--center" style="inline-size:9rem"><span class="oc-item-description">4 / 3</span></div>
  <div class="oc-aspect oc-aspect--portrait oc-aspect--center" style="inline-size:6rem"><span class="oc-item-description">3 / 4</span></div>
  <div class="oc-aspect oc-aspect--center" style="inline-size:12rem;--oc-aspect: 5 / 2"><span class="oc-item-description">5 / 2</span></div>
</div>
