<!-- OmniaUI component: list-toolbar - Search, result count, cards / table view toggle and actions above a list; the toggle switches views with :has() - no JavaScript. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/list-toolbar.html | Map: scope -> toolbar (search, count, spacer, view toggle, actions) -> cards panel -> table panel
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-list-toolbar: Toolbar row (wraps). Modifiers: --sticky (sticks to the top), --bordered (framed bar).
       .oc-list-toolbar-search: Search area (holds an .oc-input type="search")
       .oc-list-toolbar-count / -spacer / -actions: Result count, flexible gap, end buttons
       .oc-list-toolbar-views: Radio group (role="radiogroup") for the view
       .oc-list-toolbar-view: label + input[type=radio][value=cards|table|list] + icon; checked = active
       .oc-list-toolbar-scope: Optional wrapper; shows only the .oc-list-toolbar-panel[data-view] that matches the checked radio
     Slots: search, count, views, actions, panels
-->
<div class="oc-list-toolbar-scope">
  <div class="oc-list-toolbar" role="toolbar" aria-label="Products">
    <div class="oc-list-toolbar-search"><input class="oc-input" type="search" placeholder="Search products" aria-label="Search products"></div>
    <span class="oc-list-toolbar-count">3 items</span>
    <span class="oc-list-toolbar-spacer"></span>
    <div class="oc-list-toolbar-views" role="radiogroup" aria-label="View">
      <label class="oc-list-toolbar-view" title="Cards"><input type="radio" name="oc-list-view" value="cards" checked aria-label="Cards"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></label>
      <label class="oc-list-toolbar-view" title="Table"><input type="radio" name="oc-list-view" value="table" aria-label="Table"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h18"/></svg></label>
    </div>
    <div class="oc-list-toolbar-actions"><button class="oc-btn oc-btn--sm" type="button">New product</button></div>
  </div>
  <div class="oc-list-toolbar-panel" data-view="cards">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.75rem">
      <div class="oc-card oc-card--sm"><div class="oc-card-content">Oak table</div></div>
      <div class="oc-card oc-card--sm"><div class="oc-card-content">Linen chair</div></div>
      <div class="oc-card oc-card--sm"><div class="oc-card-content">Brass lamp</div></div>
    </div>
  </div>
  <div class="oc-list-toolbar-panel" data-view="table">
    <table class="oc-table"><thead><tr><th>Product</th></tr></thead><tbody><tr><td>Oak table</td></tr><tr><td>Linen chair</td></tr><tr><td>Brass lamp</td></tr></tbody></table>
  </div>
</div>
