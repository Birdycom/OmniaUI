<!-- OmniaUI component: menubar - Menubar: horizontal menu bar built from popover dropdown menus. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-menubar: the bar (role="menubar")
       .oc-menubar-trigger: button with popovertarget
       .oc-dropdown-menu[popover]: each menu (+ .oc-dropdown-item, -label, -separator, -shortcut, -sub)
-->
<div class="oc-menubar" role="menubar" aria-label="Application">
  <button class="oc-menubar-trigger" type="button" role="menuitem" popovertarget="oc-mb-file" aria-haspopup="menu">File</button>
  <button class="oc-menubar-trigger" type="button" role="menuitem" popovertarget="oc-mb-view" aria-haspopup="menu">View</button>
</div>
<div class="oc-dropdown-menu" id="oc-mb-file" popover role="menu">
  <button class="oc-dropdown-item" type="button" role="menuitem">New tab <span class="oc-dropdown-shortcut">Ctrl T</span></button>
  <button class="oc-dropdown-item" type="button" role="menuitem">New window <span class="oc-dropdown-shortcut">Ctrl N</span></button>
  <div class="oc-dropdown-separator" role="separator"></div>
  <div class="oc-dropdown-sub">
    <button class="oc-dropdown-item" type="button" role="menuitem" aria-haspopup="menu">Share</button>
    <div class="oc-dropdown-submenu" role="menu">
      <button class="oc-dropdown-item" type="button" role="menuitem">E-mail link</button>
      <button class="oc-dropdown-item" type="button" role="menuitem">Messages</button>
    </div>
  </div>
  <div class="oc-dropdown-separator" role="separator"></div>
  <button class="oc-dropdown-item" type="button" role="menuitem">Print <span class="oc-dropdown-shortcut">Ctrl P</span></button>
</div>
<div class="oc-dropdown-menu" id="oc-mb-view" popover role="menu">
  <button class="oc-dropdown-item" type="button" role="menuitemcheckbox" aria-checked="true">Always show bookmarks</button>
  <button class="oc-dropdown-item" type="button" role="menuitemcheckbox" aria-checked="false">Always show full URLs</button>
  <div class="oc-dropdown-separator" role="separator"></div>
  <button class="oc-dropdown-item" type="button" role="menuitem">Reload <span class="oc-dropdown-shortcut">Ctrl R</span></button>
</div>
