<!-- OmniaUI component: graph - The look of a small network graph in SVG: a center with linked nodes, colored by level, moving edges and a pulse. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/graph.html | Map: drawn by hand -> one node lit.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-graph / .oc-graph__svg: The frame (accent color --oc-graph-accent) and the SVG, which scales with its width.
       .oc-graph__edge: A dashed line in the accent color that flows outwards.
       .oc-graph__node[data-level]: A node group: low, medium, high or critical sets --oc-graph-color.
       .oc-graph__halo / __dot / __mark / __label: Soft ring, dot, sign inside and the name under it.
       .oc-graph__node--center + .oc-graph__pulse: The center in the accent color with a ring that grows and fades.
       .is-focused / .is-active: On the graph and one node (and its edge): that node lights up, the rest dims.
       .oc-graph__tip (+ -level, -title, -meta): Tooltip for the node under the pointer; data-level colors its first line.
-->
<div class="oc-graph" style="inline-size:min(100%,26rem)">
  <svg class="oc-graph__svg" viewBox="-170 -170 340 340" role="img" aria-label="Customer 1 and 5 sources">
    <line class="oc-graph__edge" x1="0" y1="0" x2="0" y2="-120"/>
    <line class="oc-graph__edge" x1="0" y1="0" x2="114.1" y2="-37.1"/>
    <line class="oc-graph__edge" x1="0" y1="0" x2="70.5" y2="97.1"/>
    <line class="oc-graph__edge" x1="0" y1="0" x2="-70.5" y2="97.1"/>
    <line class="oc-graph__edge" x1="0" y1="0" x2="-114.1" y2="-37.1"/>
    <g class="oc-graph__node oc-graph__node--center"><circle class="oc-graph__pulse" r="21"/><circle class="oc-graph__halo" r="30"/><circle class="oc-graph__dot" r="21"/><text class="oc-graph__mark">◉</text><text class="oc-graph__label" y="35">Customer 1</text></g>
    <g class="oc-graph__node" data-level="critical" transform="translate(0 -120)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">!</text><text class="oc-graph__label" y="27">Forum 1</text></g>
    <g class="oc-graph__node" data-level="high" transform="translate(114.1 -37.1)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">▲</text><text class="oc-graph__label" y="27">Shop 2</text></g>
    <g class="oc-graph__node" data-level="medium" transform="translate(70.5 97.1)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">●</text><text class="oc-graph__label" y="27">People finder 1</text></g>
    <g class="oc-graph__node" data-level="low" transform="translate(-70.5 97.1)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">○</text><text class="oc-graph__label" y="27">Register 1</text></g>
    <g class="oc-graph__node" data-level="low" transform="translate(-114.1 -37.1)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">○</text><text class="oc-graph__label" y="27">Image search 1</text></g>
  </svg>
</div>
<div class="oc-graph is-focused" style="inline-size:min(100%,26rem)">
  <svg class="oc-graph__svg" viewBox="-170 -170 340 340" role="img" aria-label="Customer 1 and 5 sources">
    <line class="oc-graph__edge" x1="0" y1="0" x2="0" y2="-120"/>
    <line class="oc-graph__edge is-active" x1="0" y1="0" x2="114.1" y2="-37.1"/>
    <line class="oc-graph__edge" x1="0" y1="0" x2="70.5" y2="97.1"/>
    <line class="oc-graph__edge" x1="0" y1="0" x2="-70.5" y2="97.1"/>
    <line class="oc-graph__edge" x1="0" y1="0" x2="-114.1" y2="-37.1"/>
    <g class="oc-graph__node oc-graph__node--center"><circle class="oc-graph__pulse" r="21"/><circle class="oc-graph__halo" r="30"/><circle class="oc-graph__dot" r="21"/><text class="oc-graph__mark">◉</text><text class="oc-graph__label" y="35">Customer 1</text></g>
    <g class="oc-graph__node" data-level="critical" transform="translate(0 -120)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">!</text><text class="oc-graph__label" y="27">Forum 1</text></g>
    <g class="oc-graph__node is-active" data-level="high" transform="translate(114.1 -37.1)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">▲</text><text class="oc-graph__label" y="27">Shop 2</text></g>
    <g class="oc-graph__node" data-level="medium" transform="translate(70.5 97.1)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">●</text><text class="oc-graph__label" y="27">People finder 1</text></g>
    <g class="oc-graph__node" data-level="low" transform="translate(-70.5 97.1)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">○</text><text class="oc-graph__label" y="27">Register 1</text></g>
    <g class="oc-graph__node" data-level="low" transform="translate(-114.1 -37.1)"><circle class="oc-graph__halo" r="21"/><circle class="oc-graph__dot" r="14"/><text class="oc-graph__mark">○</text><text class="oc-graph__label" y="27">Image search 1</text></g>
  </svg>
</div>
