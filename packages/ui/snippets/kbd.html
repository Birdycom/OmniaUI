<!-- OmniaUI component: kbd - Keyboard key and shortcut group. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-kbd: one key (use on <kbd>)
       .oc-kbd-group: row of keys with a gap; .oc-kbd-sep for a '+' between them
-->
<p style="margin:0;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.875rem">
  Open the command palette with
  <span class="oc-kbd-group"><kbd class="oc-kbd">Ctrl</kbd><kbd class="oc-kbd">K</kbd></span>
  or press <kbd class="oc-kbd">/</kbd> to search.
</p>

<button class="oc-btn oc-btn--outline" type="button">Save <span class="oc-kbd-group"><kbd class="oc-kbd">&#8984;</kbd><kbd class="oc-kbd">S</kbd></span></button>
<span class="oc-kbd-group"><kbd class="oc-kbd">Ctrl</kbd><span class="oc-kbd-sep">+</span><kbd class="oc-kbd">Shift</kbd><span class="oc-kbd-sep">+</span><kbd class="oc-kbd">P</kbd></span>
