<!-- OmniaUI component: greeting - Dashboard header with a time-of-day greeting, the date and actions. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/greeting.html | Map: header -> icon tile -> body (eyebrow, title with name, date) -> actions
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-greeting: Header row. Modifiers: --morning / --afternoon / --evening (tint, chosen by your app or wrapper), --lg.
       .oc-greeting-icon: Tinted icon tile (sun, moon)
       .oc-greeting-body / -eyebrow / -title / -name: Text column, small label, heading and the highlighted name
       time.oc-greeting-date: Today's date (datetime attribute)
       .oc-greeting-actions: Buttons at the end
     Slots: icon, eyebrow, title, date, actions
-->
<header class="oc-greeting oc-greeting--morning">
  <span class="oc-greeting-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
  <div class="oc-greeting-body">
    <p class="oc-greeting-eyebrow">Dashboard</p>
    <h1 class="oc-greeting-title">Good morning, <span class="oc-greeting-name">Ada</span></h1>
    <time class="oc-greeting-date" datetime="2026-10-15">Thursday 15 October 2026</time>
  </div>
  <div class="oc-greeting-actions">
    <a class="oc-btn oc-btn--outline oc-btn--sm" href="#">Agenda</a>
    <button class="oc-btn oc-btn--sm" type="button">New project</button>
  </div>
</header>
