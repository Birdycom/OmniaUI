<!-- OmniaUI component: back-link - Outline link that names its destination (Back to Products). Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-back-link: Anchor styled as an outline button with a leading arrow
     Behaviour (oc-back-link.js): data-oc-back = go back in the history when the visitor came from this site, else the href.
     0.18.0: a plain click first dispatches a cancelable `oc-back` event on the link; call preventDefault() in a listener to
     run your own back action (close a panel); Ctrl/Cmd/Shift and middle click keep opening the href.
-->
<a class="oc-back-link" href="#">Back to Products</a>
