<!-- OmniaUI component: panel - A framed panel on the page for a form, a call to action or a feature: card background, strong border, large radius and an optional soft glow in a corner. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/panel.html | Map: panel with a glow -> glow positions.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-panel: The panel: padding clamp(1.5rem, 4vw, 2.5rem) (--oc-panel-padding), --oc-border-strong, radius 1.2 × --oc-radius-lg, scroll-margin-top from --oc-scroll-offset (6rem).
       .oc-panel--glow: A soft light in the top start corner in --oc-panel-glow-color (brand 1); --oc-panel-glow-at moves it.
       .oc-panel--glow-end: The light in the top end corner.
       .oc-panel--glow-both: Two lights: brand 1 top start and brand 3 bottom end (call to action).
-->
<div class="oc-panel oc-panel--glow" style="inline-size:min(100%, 34rem)">
  <h2 style="margin:0 0 0.5rem;font-size:1.35rem">Send us a message</h2>
  <p class="oc-text-muted" style="margin:0">We usually answer within one working day.</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:1rem;inline-size:100%">
  <div class="oc-panel"><strong>.oc-panel</strong><p class="oc-text-muted" style="margin:0.35rem 0 0">No light.</p></div>
  <div class="oc-panel oc-panel--glow"><strong>--glow</strong><p class="oc-text-muted" style="margin:0.35rem 0 0">Top start.</p></div>
  <div class="oc-panel oc-panel--glow oc-panel--glow-end"><strong>--glow-end</strong><p class="oc-text-muted" style="margin:0.35rem 0 0">Top end.</p></div>
  <div class="oc-panel oc-panel--glow-both"><strong>--glow-both</strong><p class="oc-text-muted" style="margin:0.35rem 0 0">Two lights.</p></div>
</div>
