<!-- OmniaUI component: entity-card — Framed media cell (image, glyph, icon) next to a detail column with facts. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/entity-card.html | Map: card -> grid (frame | body: eyebrow, title, description, facts) -> footer
     Class API: article.oc-entity-card > .oc-entity-card__grid > .oc-entity-card__frame (img / svg / .oc-entity-card__glyph;
       --contain keeps a margin) + .oc-entity-card__body (.oc-entity-card__eyebrow, h3.oc-entity-card__title,
       p.oc-entity-card__description, dl.oc-entity-card__facts) · .oc-entity-card__footer (tags, actions; optional).
     Modifiers: .oc-entity-card--stacked (frame on top), --sm. Stacks by itself in containers under 22rem. No JavaScript.
-->
<article class="oc-entity-card" style="max-inline-size:34rem">
  <div class="oc-entity-card__grid">
    <div class="oc-entity-card__frame"><span class="oc-entity-card__glyph" aria-hidden="true">&#9765;</span></div>
    <div class="oc-entity-card__body">
      <p class="oc-entity-card__eyebrow">Symbol · Ancient Egypt</p>
      <h3 class="oc-entity-card__title">Ankh</h3>
      <p class="oc-entity-card__description">The sign of life. Often held by gods in temple reliefs.</p>
      <dl class="oc-entity-card__facts">
        <dt>Code</dt><dd>S34</dd>
        <dt>Period</dt><dd>Early Dynastic onwards</dd>
        <dt>Reading</dt><dd>ʿnḫ</dd>
      </dl>
    </div>
  </div>
  <div class="oc-entity-card__footer">
    <span class="oc-badge oc-badge--secondary">Life</span>
    <span class="oc-badge oc-badge--secondary">Amulet</span>
  </div>
</article>
