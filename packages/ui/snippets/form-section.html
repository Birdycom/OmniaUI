<!-- OmniaUI component: form-section - Collapsible part of a long form with an icon, title, hint and status; red edge while a field inside is invalid. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/form-section.html | Map: form section demo markup.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-form-section: A <details>; same name on siblings = one open at a time.
       .oc-form-section__summary: Icon, heading (title + hint), status and a chevron.
       .oc-form-section__icon: The webicon of the section in a tinted square.
       .oc-form-section__status: Free slot: a badge (Complete, 1 error), a count …
       .oc-form-section__body: The fields in a responsive grid; .oc-form-section__wide spans the full row.
       :user-invalid / [aria-invalid]: A field that fails validation after the user touched it colors the section red.
-->
<form style="inline-size:min(100%,44rem)" onsubmit="event.preventDefault()">
<details class="oc-form-section" name="contact" open>
  <summary class="oc-form-section__summary">
    <span class="oc-form-section__icon"><iconify-icon icon="mdi:card-account-details-outline" aria-hidden="true"></iconify-icon></span>
    <span class="oc-form-section__heading"><span class="oc-form-section__title">General</span><span class="oc-form-section__hint">Name, VAT number and type</span></span>
    <span class="oc-form-section__status"><span class="oc-badge oc-badge--success">Complete</span></span>
  </summary>
  <div class="oc-form-section__body">
    <div class="oc-field"><label class="oc-field-label" for="fs-name">Name</label><input class="oc-input" id="fs-name" type="text" value="Company 1"></div>
    <div class="oc-field"><label class="oc-field-label" for="fs-vat">VAT number</label><input class="oc-input" id="fs-vat" type="text" value="BE0000.000.001"></div>
    <div class="oc-field"><label class="oc-field-label" for="fs-type">Type</label><input class="oc-input" id="fs-type" type="text" value="Company"></div>
  </div>
</details>
<details class="oc-form-section" name="contact">
  <summary class="oc-form-section__summary">
    <span class="oc-form-section__icon"><iconify-icon icon="mdi:map-marker-outline" aria-hidden="true"></iconify-icon></span>
    <span class="oc-form-section__heading"><span class="oc-form-section__title">Address</span><span class="oc-form-section__hint">Invoice and delivery address</span></span>
    <span class="oc-form-section__status"></span>
  </summary>
  <div class="oc-form-section__body">
    <div class="oc-field oc-form-section__wide"><label class="oc-field-label" for="fs-street">Street and number</label><input class="oc-input" id="fs-street" type="text" value="Company address 1"></div>
    <div class="oc-field"><label class="oc-field-label" for="fs-zip">Postal code</label><input class="oc-input" id="fs-zip" type="text" value="1000"></div>
    <div class="oc-field"><label class="oc-field-label" for="fs-city">City</label><input class="oc-input" id="fs-city" type="text" value="City 1"></div>
  </div>
</details>
<details class="oc-form-section" name="contact">
  <summary class="oc-form-section__summary">
    <span class="oc-form-section__icon"><iconify-icon icon="mdi:email-outline" aria-hidden="true"></iconify-icon></span>
    <span class="oc-form-section__heading"><span class="oc-form-section__title">Contact</span><span class="oc-form-section__hint">E-mail and phone</span></span>
    <span class="oc-form-section__status"><span class="oc-badge oc-badge--destructive">1 error</span></span>
  </summary>
  <div class="oc-form-section__body">
    <div class="oc-field"><label class="oc-field-label" for="fs-mail">E-mail</label><input class="oc-input" id="fs-mail" type="email" value="info@company1" required></div>
    <div class="oc-field"><label class="oc-field-label" for="fs-phone">Phone</label><input class="oc-input" id="fs-phone" type="tel" value="+32 012 34 56 71"></div>
  </div>
</details>
</form>
