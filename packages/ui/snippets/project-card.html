<!-- OmniaUI component: project-card - Portfolio card with a browser-like preview, type badge, name, meta and an arrow link. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/project-card.html | Map: a.oc-project-card -> __frame (__bar + __shot) -> __body (type, name, meta, more)
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-project-card: The card (usually an <a>, the whole card is clickable). Modifier: --flat (edge-to-edge preview)
       .oc-project-card__frame: Preview window. .oc-project-card__bar: title bar with three <i> dots
       .oc-project-card__shot: Screenshot <img>, or an empty <span> for a gradient placeholder
       .oc-project-card__body: Text column
       .oc-project-card__type / __name / __meta / __more: Badge, title, sector line, "View" link with arrow
       .oc-accent--*: Accent preset for the badge, dot, border and placeholder
     Slots: shot (image), type, name, meta, more
-->
<a class="oc-project-card oc-accent--green" href="#project">
  <span class="oc-project-card__frame">
    <span class="oc-project-card__bar" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="oc-project-card__shot" role="img" aria-label="Northwind Bakery website, screenshot"></span>
  </span>
  <span class="oc-project-card__body">
    <span class="oc-project-card__type">Website</span>
    <span class="oc-project-card__name">Northwind Bakery</span>
    <span class="oc-project-card__meta">Food &amp; retail &middot; Antwerp</span>
    <span class="oc-project-card__more">View project</span>
  </span>
</a>
