<!-- OmniaUI component: ribbon - A diagonal band across a corner of a card, image or document: Paid, New, Sale. Pick the corner and the tone. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/ribbon.html | Map: pick a corner -> on a document -> tones and sizes.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-ribbon: The band, a child of the card or image box. That box gets position: relative and clips the band automatically (:has(), zero specificity).
       .oc-ribbon--top-start / --bottom-start / --bottom-end: The corner; without a modifier it sits top end (top right in a left-to-right page). Start and end follow the writing direction.
       .oc-ribbon--success / --warning / --destructive / --muted: Tone; the default is the primary color.
       .oc-ribbon--sm / --lg: A smaller band (product card) or a larger one (document, hero image).
       --oc-ribbon-inset: Distance from the corner to the middle of the band (2.25rem); the band length follows it.
       --oc-ribbon-bg / --oc-ribbon-fg: Your own colors, for example a brand color or a gradient.
-->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:1rem;inline-size:100%">
  <div class="oc-card" style="min-block-size:9rem;display:grid;place-items:center;text-align:center">
    <span class="oc-ribbon oc-ribbon--top-start">New</span>
    <div><strong>Top start</strong><br><small class="oc-text-muted">--top-start</small></div>
  </div>
  <div class="oc-card" style="min-block-size:9rem;display:grid;place-items:center;text-align:center">
    <span class="oc-ribbon oc-ribbon--success">Paid</span>
    <div><strong>Top end</strong><br><small class="oc-text-muted">default</small></div>
  </div>
  <div class="oc-card" style="min-block-size:9rem;display:grid;place-items:center;text-align:center">
    <span class="oc-ribbon oc-ribbon--bottom-start oc-ribbon--warning">Due soon</span>
    <div><strong>Bottom start</strong><br><small class="oc-text-muted">--bottom-start</small></div>
  </div>
  <div class="oc-card" style="min-block-size:9rem;display:grid;place-items:center;text-align:center">
    <span class="oc-ribbon oc-ribbon--bottom-end oc-ribbon--destructive">Overdue</span>
    <div><strong>Bottom end</strong><br><small class="oc-text-muted">--bottom-end</small></div>
  </div>
</div>
<article class="oc-card" style="max-inline-size:30rem;inline-size:100%;padding:1.5rem;display:grid;gap:1rem">
  <span class="oc-ribbon oc-ribbon--success oc-ribbon--lg">Paid</span>
  <header style="display:grid;gap:0.25rem">
    <span class="oc-text-muted" style="font-size:0.8125rem">Invoice</span>
    <strong style="font-size:1.25rem">2026-0042</strong>
    <span style="font-size:0.875rem">Customer 1 · info@company1.example</span>
  </header>
  <dl style="display:grid;grid-template-columns:auto 1fr;gap:0.25rem 1rem;margin:0;font-size:0.875rem">
    <dt class="oc-text-muted">Invoice date</dt><dd style="margin:0">2 November 2026</dd>
    <dt class="oc-text-muted">Paid on</dt><dd style="margin:0">9 November 2026</dd>
    <dt class="oc-text-muted">Total</dt><dd style="margin:0"><strong>€ 1.210,00</strong></dd>
  </dl>
</article>
<div style="display:flex;flex-wrap:wrap;gap:1rem">
  <div class="oc-card" style="inline-size:9rem;block-size:7rem"><span class="oc-ribbon oc-ribbon--sm">New</span></div>
  <div class="oc-card" style="inline-size:9rem;block-size:7rem"><span class="oc-ribbon oc-ribbon--sm oc-ribbon--destructive">Sale</span></div>
  <div class="oc-card" style="inline-size:9rem;block-size:7rem"><span class="oc-ribbon oc-ribbon--sm oc-ribbon--muted">Draft</span></div>
  <div class="oc-card" style="inline-size:11rem;block-size:7rem"><span class="oc-ribbon oc-ribbon--warning">Beta</span></div>
  <div class="oc-card" style="inline-size:13rem;block-size:7rem"><span class="oc-ribbon oc-ribbon--lg" style="--oc-ribbon-bg:linear-gradient(90deg,var(--oc-accent-from,var(--oc-primary)),var(--oc-accent-to,var(--oc-primary)))">Pro</span></div>
</div>
