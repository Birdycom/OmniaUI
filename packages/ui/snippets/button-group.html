<!-- OmniaUI component: button-group - Joined buttons with shared borders: horizontal, vertical, text addon. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-btn-group: inline-flex wrapper (role="group" + aria-label). Modifier: --vertical.
       .oc-btn: any button variant inside the group
       .oc-btn-group-text: static text cell (a count, a unit) next to a button
-->
<div class="oc-btn-group" role="group" aria-label="Text alignment">
  <button class="oc-btn oc-btn--outline" type="button">Left</button>
  <button class="oc-btn oc-btn--outline" type="button">Center</button>
  <button class="oc-btn oc-btn--outline" type="button">Right</button>
</div>

<div class="oc-btn-group oc-btn-group--vertical" role="group" aria-label="Zoom">
  <button class="oc-btn oc-btn--outline" type="button">Zoom in</button>
  <button class="oc-btn oc-btn--outline" type="button">Zoom out</button>
</div>
<div class="oc-btn-group" role="group" aria-label="Quantity">
  <button class="oc-btn oc-btn--outline" type="button" aria-label="Decrease">&minus;</button>
  <span class="oc-btn-group-text">3 items</span>
  <button class="oc-btn oc-btn--outline" type="button" aria-label="Increase">+</button>
</div>
