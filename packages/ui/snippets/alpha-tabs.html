<!-- OmniaUI component: alpha-tabs - All + A-Z letter filter bar for long lists; scrolls sideways on small screens. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/alpha-tabs.html | Map: nav -> "All" item -> letter items (current, empty)
     Class API (modifiers are extra classes / attributes on the same element):
       nav.oc-alpha-tabs: Letter bar. Modifiers: --wrap (wrap instead of scroll), --sm, --plain (no frame).
       .oc-alpha-tabs-item: One letter (a href="?letter=A" or button). States: aria-current="true" / .is-active, aria-disabled="true" (no entries).
       .oc-alpha-tabs-item--all: The wider "All" item at the start
     Slots: one item per letter (render only the letters you need, or all with empty ones disabled)
-->
<nav class="oc-alpha-tabs" aria-label="Filter by letter">
  <a class="oc-alpha-tabs-item oc-alpha-tabs-item--all" href="?letter=all">All</a>
  <a class="oc-alpha-tabs-item" href="?letter=A">A</a>
  <a class="oc-alpha-tabs-item" href="?letter=B" aria-current="true">B</a>
  <a class="oc-alpha-tabs-item" href="?letter=C">C</a>
  <a class="oc-alpha-tabs-item" href="?letter=D">D</a>
  <a class="oc-alpha-tabs-item" aria-disabled="true">E</a>
  <a class="oc-alpha-tabs-item" href="?letter=F">F</a>
  <a class="oc-alpha-tabs-item" href="?letter=G">G</a>
  <a class="oc-alpha-tabs-item" href="?letter=H">H</a>
  <a class="oc-alpha-tabs-item" href="?letter=I">I</a>
  <a class="oc-alpha-tabs-item" href="?letter=J">J</a>
  <a class="oc-alpha-tabs-item" href="?letter=K">K</a>
  <a class="oc-alpha-tabs-item" href="?letter=L">L</a>
  <a class="oc-alpha-tabs-item" href="?letter=M">M</a>
  <a class="oc-alpha-tabs-item" href="?letter=N">N</a>
  <a class="oc-alpha-tabs-item" href="?letter=O">O</a>
  <a class="oc-alpha-tabs-item" href="?letter=P">P</a>
  <a class="oc-alpha-tabs-item" aria-disabled="true">Q</a>
  <a class="oc-alpha-tabs-item" href="?letter=R">R</a>
  <a class="oc-alpha-tabs-item" href="?letter=S">S</a>
  <a class="oc-alpha-tabs-item" href="?letter=T">T</a>
  <a class="oc-alpha-tabs-item" href="?letter=U">U</a>
  <a class="oc-alpha-tabs-item" href="?letter=V">V</a>
  <a class="oc-alpha-tabs-item" href="?letter=W">W</a>
  <a class="oc-alpha-tabs-item" aria-disabled="true">X</a>
  <a class="oc-alpha-tabs-item" href="?letter=Y">Y</a>
  <a class="oc-alpha-tabs-item" href="?letter=Z">Z</a>
</nav>
