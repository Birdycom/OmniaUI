<!-- OmniaUI component: resizable - Resizable panels using CSS resize (horizontal, vertical, free box). Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-resizable: flex container. Modifier: --vertical
       .oc-resizable-panel: pane. Modifier: --resizable (gets the resize grip; sets min/max size)
       .oc-resizable-box: any element with resize: both
-->
<div class="oc-resizable" style="block-size:11rem">
  <div class="oc-resizable-panel oc-resizable-panel--resizable"><strong>Sidebar</strong><br>Drag the corner grip to resize.</div>
  <div class="oc-resizable-panel"><strong>Content</strong><br>Takes the remaining space.</div>
</div>

<div class="oc-resizable oc-resizable--vertical" style="block-size:14rem">
  <div class="oc-resizable-panel oc-resizable-panel--resizable"><strong>Editor</strong></div>
  <div class="oc-resizable-panel"><strong>Preview</strong></div>
</div>
<div class="oc-resizable-box oc-resizable" style="inline-size:14rem;block-size:6rem"><div class="oc-resizable-panel">Resize me in both directions</div></div>
