<!-- OmniaUI component: brand-mark - A logo from an icon and text: the mark with a glow in the brand color, a word mark with one part in the brand gradient and a small tagline. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/brand-mark.html | Map: in the header -> sizes.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-brand-mark: The logo: a link or a span with the icon and the text side by side.
       .oc-brand-mark__icon: The mark (svg or img), 2.25rem, with a drop shadow in brand 1.
       .oc-brand-mark__text: Word mark and tagline stacked.
       .oc-brand-mark__word: The name: --oc-font-display, 800, tight letter spacing.
       .oc-brand-mark__accent: The part of the name in the gradient brand 1 → brand 2.
       .oc-brand-mark__tagline: Mono, uppercase, wide letter spacing, muted.
       .oc-brand-mark--sm / --lg: Smaller (footer) or larger (hero, ecosystem map). The sizes are tokens: --oc-brand-mark-icon, --oc-brand-mark-word, --oc-brand-mark-tagline.
-->

  <span class="oc-brand-mark__text">
    <span class="oc-brand-mark__word">Company<span class="oc-brand-mark__accent">1</span></span>
    <span class="oc-brand-mark__tagline">Software &amp; IT</span>
  </span>
</a>
