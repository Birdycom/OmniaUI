<!-- OmniaUI component: next-teaser - "Next product" teaser card with label, name, mark and an arrow tagline. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/next-teaser.html | Map: a.oc-next-teaser -> __label -> __name (mark + text) -> __tagline
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-next-teaser: The card (an <a>). Modifier: --prev ("Previous" link, arrow left before the tagline)
       .oc-next-teaser__label: Small uppercase label
       .oc-next-teaser__name: Name; may start with an .oc-product-mark
       .oc-next-teaser__tagline: Short line with a moving arrow
       .oc-accent--*: Accent preset
     Slots: label, name, mark, tagline
-->
<a class="oc-next-teaser oc-accent--violet" href="#next">
  <span class="oc-next-teaser__label">Next product</span>
  <span class="oc-next-teaser__name"><span class="oc-product-mark oc-product-mark--sm oc-accent--violet" aria-hidden="true">&#9673;</span>Acme Design</span>
  <span class="oc-next-teaser__tagline">The design system behind our apps</span>
</a>
