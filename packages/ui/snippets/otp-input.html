<!-- OmniaUI component: otp-input - One-time code field drawn as separate cells on a single real input. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-otp: The input. Set style="--oc-otp-length: 6" and maxlength to the code length. aria-invalid="true" shows the error state.
-->
<div class="oc-field">
  <label class="oc-field-label" for="oc-otp-demo">Authentication code</label>
  <input class="oc-otp" id="oc-otp-demo" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" style="--oc-otp-length: 6" value="123">
  <p class="oc-field-description">Enter the 6-digit code from your authenticator app.</p>
</div>
