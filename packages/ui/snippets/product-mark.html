<!-- OmniaUI component: product-mark - Squircle app icon tile in the accent gradient (sm / lg / xl). Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/product-mark.html | Map: span.oc-product-mark (glyph, img or svg) per size
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-product-mark: The tile. Uses corner-shape: squircle where supported, a rounded square otherwise.
         Sizes: --sm, (default), --lg, --xl. Styles: --soft (tinted), --glow, --cover (full-bleed img)
       .oc-accent--*: Accent preset (green, violet, orange, cyan, red, yellow, blue)
       --oc-mark-size: Custom size
     Slots: content (glyph, emoji, <img alt=""> or inline SVG)
-->
<span class="oc-product-mark oc-product-mark--sm oc-accent--green" aria-hidden="true">&#9670;</span>
<span class="oc-product-mark oc-accent--violet" aria-hidden="true">&#9673;</span>
<span class="oc-product-mark oc-product-mark--lg oc-accent--orange" aria-hidden="true">&#9650;</span>
<span class="oc-product-mark oc-product-mark--xl oc-accent--cyan" aria-hidden="true">&#9733;</span>
