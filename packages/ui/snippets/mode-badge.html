<!-- OmniaUI component: mode-badge - Test and live at a glance: a badge in fixed mode colors (also on a photo or print), "both" as two parts side by side. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-mode-badge[data-mode="test|live|both"]: the badge (test amber, live green, the same in light and dark mode)
       Modifiers: --sm, --lg. data-mode="both": two child spans (Test, Live), each in its own color.
       Tokens: --oc-mode-test, --oc-mode-live, --oc-mode-ink (text). Also used by .oc-card--accent[data-tone="test|live"]
       and .oc-code-plate[data-mode].
       0.18.0: data-mode="staging" / "offline" (--oc-mode-staging, --oc-mode-offline); .oc-env-frame[data-mode]: a line around the viewport, pointer-events none.
-->
<span class="oc-mode-badge" data-mode="test">Test</span>
<span class="oc-mode-badge" data-mode="live">Live</span>
<span class="oc-mode-badge" data-mode="both"><span>Test</span><span>Live</span></span>
<span class="oc-mode-badge oc-mode-badge--sm" data-mode="live">Live</span>
<span class="oc-mode-badge oc-mode-badge--lg" data-mode="test">Test</span>
<span class="oc-mode-badge" data-mode="staging">Staging</span>
<span class="oc-mode-badge" data-mode="offline">Offline</span>
<div class="oc-env-frame" data-mode="live" aria-hidden="true"></div>
