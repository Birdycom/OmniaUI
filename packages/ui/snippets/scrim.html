<!-- OmniaUI component: scrim - A calm fade over a picture (from a color at one edge to transparent) so text on top of it stays readable. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/scrim.html | Map: positioned box -> image -> span.oc-scrim (or .oc-has-scrim on the box) -> text (.oc-scrim-content)
     Class API (modifiers are extra classes on the same element):
       .oc-scrim: click-through layer over its positioned parent (child element, aria-hidden)
       .oc-has-scrim: the same scrim as ::after on the box itself, no extra element
       Modifiers: --top, --start, --end (default: bottom), --full (one even layer), --dark (near black instead of the page background)
       .oc-scrim-content: text above the scrim (position: relative; z-index 2)
       Tokens: --oc-scrim-color, --oc-scrim-strength (0 to 1, default 0.85), --oc-scrim-size (fade length, default 60%)
     Slots: none. The layer is decorative (aria-hidden).
-->
<figure class="relative m-0 w-full aspect-16 overflow-hidden rounded-lg">
  <img style="display:block;inline-size:100%;block-size:100%;object-fit:cover" src="/img/blocks/otp-split-photo.webp" alt="Stone surface with old carvings">
  <span class="oc-scrim oc-scrim--dark" aria-hidden="true"></span>
  <figcaption class="oc-scrim-content absolute p-2" style="inset-block-end:0;color:oklch(98% 0 0)">Caption on the scrim</figcaption>
</figure>

<figure class="oc-has-scrim oc-scrim--top m-0 w-full aspect-16 overflow-hidden rounded-lg">
  <img style="display:block;inline-size:100%;block-size:100%;object-fit:cover" src="/img/blocks/otp-split-photo.webp" alt="">
</figure>
