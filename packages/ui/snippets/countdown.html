<!-- OmniaUI component: countdown - Time left for a task, a round or a reservation: inline, a pill or large digits, with an optional shrinking bar; orange when little time is left. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-countdown[role=timer] > .oc-countdown-label + .oc-countdown-time. Modifiers: --pill | --display (large digits) | --bar.
       data-state="low" (orange) | "done" (red); --oc-countdown-left (1 = full, 0 = empty) for the bar.
       Ticking: oc-countdown.js (npx omniaui copy-js countdown) on [data-oc-countdown] with data-oc-countdown-end (ISO or
       ms) or data-oc-countdown-seconds, data-oc-countdown-total, data-oc-countdown-low. Event: oc-countdown-end.
-->
<div class="oc-countdown oc-countdown--pill" role="timer" aria-label="Time left" data-oc-countdown data-oc-countdown-seconds="90">
  <span class="oc-countdown-label">Time left</span>
  <b class="oc-countdown-time">1:30</b>
</div>
<script type="module" src="/js/oc-countdown.js"></script>
