<!-- OmniaUI component: collapsible - Card-style details/summary form section with icon, title and chevron. Needs @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       details.oc-collapsible: Root. Modifier: --dense (compact paddings).
       summary: Header row with .oc-collapsible-icon + .oc-collapsible-title; the chevron is CSS
       .oc-collapsible-content: Body with a top border
     Slots: icon, title (summary), content (default)
-->
<details class="oc-collapsible" open>
  <summary>
    <svg class="oc-collapsible-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    <span class="oc-collapsible-title">General information</span>
  </summary>
  <div class="oc-collapsible-content">
    <div class="oc-field">
      <label class="oc-field-label" for="oc-collapsible-name">Name</label>
      <input class="oc-input" id="oc-collapsible-name" value="Birdy Systems BV">
    </div>
  </div>
</details>
