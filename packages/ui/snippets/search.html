<!-- OmniaUI component: search - Search field. Needs @birdycom/omniaui CSS.
     Class API: .oc-search (label wrapper) · .oc-search-icon (svg) · .oc-search-input (input type="search") · .oc-search-hint (kbd, hidden while focused)
-->
<label class="oc-search">
  <svg class="oc-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input class="oc-search-input" type="search" name="q" placeholder="Search the docs" aria-label="Search the docs">
  <kbd class="oc-search-hint">/</kbd>
</label>
