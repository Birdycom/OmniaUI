<!-- OmniaUI component: tree - Nested tree list on details / summary with a sticky action column - no JavaScript. Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/tree.html | Map: tree box -> head row -> list -> folder (details) with child list -> leaf rows
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-tree: Scroll box (card frame). Modifiers: --flush (no frame), --quiet (actions show on hover / focus). Height: --oc-tree-height.
       .oc-tree-head: Optional root row that sticks to the top
       ul.oc-tree-list: List; a nested list indents one step (--oc-tree-indent)
       details.oc-tree-node: Folder (open = expanded); summary.oc-tree-row is its row
       .oc-tree-row: Row (summary for a folder, div for a leaf). States: aria-current="true" on the row or its label link / .is-selected, .is-muted
       .oc-tree-icon / -label / -count: Icon, name (never wraps), item count
       .oc-tree-actions: Action buttons, pinned to the end edge (position: sticky)
     Slots: head, rows (icon, label, count, actions), nested lists
-->
<div class="oc-tree" aria-label="Projects" style="--oc-tree-height:18rem">
  <div class="oc-tree-row oc-tree-head"><span class="oc-tree-label">All projects</span><span class="oc-tree-actions"><button class="oc-btn oc-btn--ghost oc-btn--xs" type="button">New</button></span></div>
  <ul class="oc-tree-list">
    <li>
      <details class="oc-tree-node" open>
        <summary class="oc-tree-row">
          <span class="oc-tree-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          <span class="oc-tree-label">Kitchen renovation - Main street 12</span><span class="oc-tree-count">3</span>
          <span class="oc-tree-actions"><button class="oc-table-actions-icon" type="button" aria-label="Add to Kitchen renovation" title="Add">+</button></span>
        </summary>
        <ul class="oc-tree-list">
          <li><div class="oc-tree-row"><span class="oc-tree-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg></span><a class="oc-tree-label" href="#" aria-current="true">Quote v2.pdf</a><span class="oc-tree-actions"><button class="oc-table-actions-icon" type="button" aria-label="Rename Quote v2.pdf" title="Rename">&#9998;</button></span></div></li>
          <li><div class="oc-tree-row"><span class="oc-tree-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg></span><a class="oc-tree-label" href="#">Floor plan with very long file name that scrolls.dwg</a><span class="oc-tree-actions"><button class="oc-table-actions-icon" type="button" aria-label="Rename Floor plan" title="Rename">&#9998;</button></span></div></li>
        </ul>
      </details>
    </li>
    <li>
      <details class="oc-tree-node">
        <summary class="oc-tree-row"><span class="oc-tree-icon" aria-hidden="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="oc-tree-label">Bathroom</span><span class="oc-tree-count">1</span></summary>
        <ul class="oc-tree-list">
          <li><div class="oc-tree-row is-muted"><span class="oc-tree-label">Photos (archived)</span></div></li>
        </ul>
      </details>
    </li>
  </ul>
</div>
