<!-- OmniaUI component: sortable-row - Table row with a drag grip and drag / drop states (styling only). Needs @birdycom/omniaui CSS.
     File: packages/ui/snippets/sortable-row.html | Map: table -> grip column -> normal row -> dragging row -> drop target row
     Class API (modifiers are extra classes / attributes on the same element):
       tr.oc-sortable-row[draggable="true"]: Row that can be moved. States: .is-dragging (row being moved), .is-drop-before / .is-drop-after (drop line on the target row).
       td.oc-sortable-row-grip-cell: Narrow first cell
       button.oc-sortable-row-grip: Grip with six dots (aria-label "Move ..."). States: aria-pressed="true" (picked up with the keyboard), disabled (locked row).
     Slots: grip cell + the normal row cells. Behaviour (native drag and drop or keys) comes from your own code.
-->
<div class="oc-table-wrap">
  <table class="oc-table">
    <thead><tr><th class="oc-sortable-row-grip-cell"><span class="oc-visually-hidden">Order</span></th><th>Step</th><th>Owner</th></tr></thead>
    <tbody>
      <tr class="oc-sortable-row" draggable="true">
        <td class="oc-sortable-row-grip-cell"><button class="oc-sortable-row-grip" type="button" aria-label="Move Measure the room"></button></td>
        <td>Measure the room</td><td>Ada</td>
      </tr>
      <tr class="oc-sortable-row is-dragging" draggable="true">
        <td class="oc-sortable-row-grip-cell"><button class="oc-sortable-row-grip" type="button" aria-label="Move Order materials"></button></td>
        <td>Order materials</td><td>Alan</td>
      </tr>
      <tr class="oc-sortable-row is-drop-after" draggable="true">
        <td class="oc-sortable-row-grip-cell"><button class="oc-sortable-row-grip" type="button" aria-label="Move Install"></button></td>
        <td>Install</td><td>Grace</td>
      </tr>
      <tr class="oc-sortable-row">
        <td class="oc-sortable-row-grip-cell"><button class="oc-sortable-row-grip" type="button" aria-label="Final check (locked)" disabled></button></td>
        <td>Final check</td><td>Ada</td>
      </tr>
    </tbody>
  </table>
</div>
