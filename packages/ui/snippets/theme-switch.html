<!-- OmniaUI component: theme-switch — System / light / dark switch — CSS only (color-scheme + :has()). Needs @birdycom/omniaui CSS. -->
<fieldset class="oc-theme-switch" aria-label="Color theme">
  <label><input type="radio" name="oc-theme" value="system" checked> System</label>
  <label><input type="radio" name="oc-theme" value="light"> Light</label>
  <label><input type="radio" name="oc-theme" value="dark"> Dark</label>
</fieldset>

<!-- With icons only (the text stays for screen readers): -->
<fieldset class="oc-theme-switch oc-theme-switch--icons" aria-label="Color theme">
  <label title="System"><input type="radio" name="oc-theme" value="system" checked><iconify-icon icon="mdi:monitor" aria-hidden="true"></iconify-icon><span class="oc-theme-switch__text">System</span></label>
  <label title="Light"><input type="radio" name="oc-theme" value="light"><iconify-icon icon="mdi:white-balance-sunny" aria-hidden="true"></iconify-icon><span class="oc-theme-switch__text">Light</span></label>
  <label title="Dark"><input type="radio" name="oc-theme" value="dark"><iconify-icon icon="mdi:weather-night" aria-hidden="true"></iconify-icon><span class="oc-theme-switch__text">Dark</span></label>
</fieldset>
