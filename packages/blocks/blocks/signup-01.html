<!-- OmniaUI block: signup-01 - Create-account card with name, e-mail, password and confirmation. Needs @birdycom/omniaui-blocks + @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-block-authpage: Page wrapper that centers one card. Modifier: --plain (page background instead of muted)
       .oc-block-authcard: Card column. Modifiers: --flat (no card chrome), --wide
       .oc-block-authcard-logo: Icon tile above the title
       .oc-block-authcard-head / -title / -text: Centered heading block, title and description
       .oc-block-authcard-fields / -row: Field stack and a justified row (remember me / forgot password)
       .oc-block-authcard-submit: Full-width submit button
       .oc-block-authcard-foot / -legal / -hint: Switch-form line, legal line, small helper text
       .oc-block-authcard-center: Centered column (OTP input)
       .oc-block-authsocial: Auto-fit grid of social buttons
       .oc-block-authduo: Split layout root (container query: two columns from 42rem of its own width). Modifier: --reverse
       .oc-block-authduo-grid / -panel / -form: Grid, brand panel (modifiers --image, --muted) and form column
       .oc-block-authduo-logo / -quote: Panel logo and quote
       .oc-block-authmin: Minimal centered column without a card
       .oc-separator-text: Divider with centered text (separator component)
-->
<div class="oc-block-authpage oc-block-authpage--plain">
  <form class="oc-block-authcard" action="#" method="post">
    <span class="oc-block-authcard-logo"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></span>
    <div class="oc-block-authcard-head">
      <h1 class="oc-block-authcard-title">Create an account</h1>
      <p class="oc-block-authcard-text">Enter your information to get started</p>
    </div>
    <div class="oc-block-authcard-fields">
      <div class="oc-field">
        <label class="oc-field-label" for="oc-signup01-name">Full name</label>
        <input class="oc-input" id="oc-signup01-name" name="text" type="text" autocomplete="name" required placeholder="Ada Lovelace">
      </div>
      <div class="oc-field">
        <label class="oc-field-label" for="oc-signup01-email">E-mail</label>
        <input class="oc-input" id="oc-signup01-email" name="email" type="email" autocomplete="email" required placeholder="name@company.com">
      </div>
      <div class="oc-field">
        <label class="oc-field-label" for="oc-signup01-password">Password</label>
        <div class="oc-input-reveal">
          <input class="oc-input" id="oc-signup01-password" name="oc-signup01-password" type="password" autocomplete="new-password" required>
          <button class="oc-input-reveal-button" type="button" aria-pressed="false" aria-label="Toggle password visibility">Show</button>
        </div>
      </div>
      <div class="oc-field">
        <label class="oc-field-label" for="oc-signup01-confirm">Confirm password</label>
        <div class="oc-input-reveal">
          <input class="oc-input" id="oc-signup01-confirm" name="oc-signup01-confirm" type="password" autocomplete="new-password" required>
          <button class="oc-input-reveal-button" type="button" aria-pressed="false" aria-label="Toggle password visibility">Show</button>
        </div>
      </div>
      <p class="oc-block-authcard-hint">Must be at least 8 characters long.</p>
      <button class="oc-btn oc-block-authcard-submit" type="submit">Create account</button>
    </div>
    <p class="oc-block-authcard-foot">Already have an account? <a href="#">Sign in</a></p>
  </form>
</div>
