<!-- OmniaUI block: two-factor - Authenticator setup: QR, copyable key, OTP code and recovery codes. Needs @birdycom/omniaui-blocks + @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       .oc-block-twofactor: Single-column wrapper
       .oc-block-twofactor-step: One step (heading + content)
       .oc-block-twofactor-center: Centered column for the QR code
       .oc-block-twofactor-qr: QR placeholder box (replace with your img/svg)
     Slots: QR code, setup key, code input, recovery codes
-->
<div class="oc-block-twofactor">
  <section class="oc-block-twofactor-step">
    <div class="oc-heading oc-heading--sm"><h2 class="oc-heading-title">1. Scan the QR code</h2><p class="oc-heading-description">Use an authenticator app, or enter the key manually.</p></div>
    <div class="oc-block-twofactor-center">
      <div class="oc-block-twofactor-qr" role="img" aria-label="QR code">QR code</div>
      <div class="oc-copy-field"><input class="oc-copy-field-value" type="text" readonly value="JBSWY3DPEHPK3PXP" aria-label="Setup key"><button class="oc-copy-field-button" type="button">Copy</button></div>
    </div>
  </section>
  <section class="oc-block-twofactor-step">
    <div class="oc-heading oc-heading--sm"><h2 class="oc-heading-title">2. Confirm with a code</h2></div>
    <div class="oc-field">
      <label class="oc-field-label" for="oc-twofactor-code">Authentication code</label>
      <input class="oc-otp" id="oc-twofactor-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="--oc-otp-length: 6">
    </div>
    <button class="oc-btn" type="submit">Enable two-factor</button>
  </section>
  <section class="oc-block-twofactor-step">
    <div class="oc-recovery-codes">
      <h3 class="oc-recovery-codes-title">Recovery codes</h3>
      <p class="oc-recovery-codes-warning">Store these codes somewhere safe. Each code works once.</p>
      <ul class="oc-recovery-codes-list"><li>4F8K-92QA</li><li>M3ZP-71LD</li><li>7TQX-0BNE</li><li>C8WV-5YHR</li></ul>
      <div class="oc-recovery-codes-actions"><button class="oc-btn oc-btn--outline oc-btn--sm" type="button">Copy all</button><button class="oc-btn oc-btn--outline oc-btn--sm" type="button">Download .txt</button></div>
    </div>
  </section>
</div>
