<!-- OmniaUI block: wizard-dialog - Modal wizard: stepper rail on the left, step content and navigation footer. Needs @birdycom/omniaui-blocks + @birdycom/omniaui CSS.
     Class API (modifiers are extra classes / attributes on the same element):
       dialog.oc-modal > .oc-modal-content.oc-modal-content--xl: Dialog shell
       .oc-block-wizard: Rail + main (row from 48rem, column below)
       .oc-block-wizard-rail: Contains an ol.oc-stepper
       .oc-block-wizard-main: Right column
       .oc-block-wizard-step: One step's content (hidden when inactive)
       .oc-modal-footer: Back / Next buttons
     Slots: stepper rail, step content (one per step), footer (back, next/finish)
-->
<button class="oc-btn" type="button" command="show-modal" commandfor="oc-wizard-demo">Open setup wizard</button>

<dialog class="oc-modal" id="oc-wizard-demo" closedby="closerequest" aria-labelledby="oc-wizard-title">
  <div class="oc-modal-content oc-modal-content--xl">
    <div class="oc-block-wizard">
      <div class="oc-block-wizard-rail">
        <ol class="oc-stepper" aria-label="Setup steps">
          <li><button class="oc-stepper-item oc-stepper-item--done" type="button"><span class="oc-stepper-label">Company</span></button></li>
          <li><button class="oc-stepper-item oc-stepper-item--active" type="button" aria-current="step"><span class="oc-stepper-label">Invoicing</span></button></li>
          <li><button class="oc-stepper-item" type="button" disabled><span class="oc-stepper-label">Team</span></button></li>
        </ol>
      </div>
      <div class="oc-block-wizard-main">
        <div class="oc-modal-header"><h2 class="oc-modal-title" id="oc-wizard-title">Invoicing</h2><p class="oc-modal-description">Step 2 of 3</p></div>
        <div class="oc-block-wizard-step">
          <div class="oc-field"><label class="oc-field-label" for="oc-wizard-prefix">Invoice prefix</label><input class="oc-input" id="oc-wizard-prefix" value="INV-"></div>
          <div class="oc-field"><label class="oc-field-label" for="oc-wizard-next">Next number</label><input class="oc-input" id="oc-wizard-next" value="1001"></div>
        </div>
        <div class="oc-modal-footer">
          <button class="oc-btn oc-btn--outline" type="button">Back</button>
          <button class="oc-btn" type="button">Next</button>
        </div>
      </div>
    </div>
  </div>
</dialog>
