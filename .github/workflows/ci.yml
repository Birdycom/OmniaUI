# File: .github/workflows/ci.yml
# Map: checkout -> node 22 -> npm ci -> npm test (build + CLI/React/Vue tests) -> audit
# No PHP here: the Laravel/Livewire packages are tested locally with phpunit.
# The build needs no OmniaCSS checkout: vendor/omniacss is committed.
name: OmniaUI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Manifests + CSS packages + React/Vue builds + UI site, then the CLI, React and Vue tests.
      - name: Run test pipeline
        run: npm test

      - name: Run npm audit (production)
        run: npm audit --omit=dev --audit-level=high
