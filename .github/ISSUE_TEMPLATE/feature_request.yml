name: Feature request
description: A component, block, option or framework wrapper you would like in OmniaUI.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      placeholder: "A date range picker component."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you use it for?
      description: Where it would go in your app, and which framework you use (HTML, React, Vue, Blade, Livewire).
  - type: input
    id: links
    attributes:
      label: Examples
      description: Links to a design or a similar component elsewhere.
