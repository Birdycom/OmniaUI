name: Bug report
description: An OmniaUI component, block or framework package does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A small example helps most: the component, your markup or code, and what you see.
        Utility classes (`p-1`, `md:flex` …) and the build tools live in [OmniaCSS](https://github.com/Birdycom/OmniaCSS/issues/new/choose).
        **OmniaUI Pro** customers: mail support@omniaui.eu (the Pro code is not public, so please do not paste it here).
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@birdycom/omniaui (components, CSS, CLI)"
        - "@birdycom/omniaui-blocks"
        - "@birdycom/omniaui-react"
        - "@birdycom/omniaui-vue"
        - "birdycom/omniaui-laravel (Blade)"
        - "birdycom/omniaui-livewire"
        - Docs (omniaui.eu)
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component or block
      placeholder: "modal, tooltip, pricing …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`npm ls @birdycom/omniaui` or `composer show birdycom/omniaui-laravel`."
      placeholder: "0.12.1"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
      placeholder: "The modal does not close with Esc in Safari 27."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Your markup or code (HTML, JSX, Vue or Blade) and the steps.
      render: html
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Safari 27, macOS 26, Vite 8, React 19"
